dd:"Fieber/Sepsis • Meningitis • Thyreotoxische Krise • malignes neuroleptisches Syndrom • Drogen (Ecstasy, Kokain) • Hypoglykämie",
b:"Klinik: Elektrolyte, Kreatinin, CK, Leberwerte, Gerinnung, BZ",
nf:2,nfm:"Hitzschlag → 112 • in den Schatten/kühlen Raum, Kleidung öffnen • aktiv kühlen (feuchte Tücher, Luftzufächeln, Kühlpacks an Hals, Achseln, Leisten) • bei Bewusstsein: kühle Getränke (Elektrolyte) • Sonnenstich: Oberkörper hoch, Kopf kühlen • Hitzeerschöpfung: Schocklage, trinken lassen"},

{n:"Unterkühlung",a:"Hypothermie, Erfrierung",k:"allg",
d:"Absinken der Körperkerntemperatur unter 35 °C. Stadien: leicht (32–35 °C), mittel (28–32 °C), schwer (< 28 °C). Erfrierung = lokaler Kälteschaden.",
u:"Kälteexposition (Bergunfall, Lawine, Wasser, Obdachlosigkeit) • Alkohol, Drogen, Medikamente • ältere Menschen, Säuglinge • Bewusstlosigkeit, Immobilität (Sturz in der Wohnung) • Hypothyreose, Hypoglykämie, Sepsis",
s:"Leicht: Kältezittern (Muskelzittern), Tachykardie, Hypertonie, Hyperventilation, blasse kalte Haut, Unruhe • Mittel: Zittern hört auf (!), Bradykardie, Hypotonie, Bewusstseinstrübung, Verwirrtheit, Apathie, „paradoxes Entkleiden“ • Schwer: Bewusstlosigkeit, weite Pupillen, kaum tastbarer Puls, langsame Atmung, Kammerflimmern, Scheintod • Erfrierungen: weiße, gefühllose, harte Haut (Finger, Zehen, Nase, Ohren), später Blasen, Nekrosen",
l:"Kältezittern, später Apathie und Bewusstseinstrübung bei Körpertemperatur < 35 °C",
ko:"Kammerflimmern, Herzstillstand • Bergungstod (Kreislaufversagen durch Einstrom von kaltem Schalenblut) • Erfrierungen mit Amputation • Pneumonie, Nierenversagen",
dd:"Hypoglykämie • Intoxikation • Hypothyreose (Myxödemkoma) • Schlaganfall • Sepsis",
b:"Körperkerntemperatur (Spezialthermometer) • BZ, Elektrolyte (Kalium), Blutgase, Gerinnung",
nf:2,nfm:"112 • vorsichtig bewegen, Patient flach lagern, nicht reiben, nicht aktiv bewegen lassen (Bergungstod) • nasse Kleidung vorsichtig entfernen, zudecken (Rettungsdecke, Decken), Wärmepackungen nur am Rumpf • bei Bewusstsein: warme gezuckerte Getränke (kein Alkohol) • Reanimation: „niemand ist tot, bevor er nicht warm und tot ist“ • Erfrierungen: nicht reiben, langsam erwärmen, steril abdecken"},

{n:"Vergiftungen (Intoxikationen)",a:"Intoxikation, Medikamentenvergiftung, Pilzvergiftung, Alkoholvergiftung",k:"allg",
d:"Schädigung des Körpers durch Aufnahme giftiger Substanzen (oral, inhalativ, über die Haut, Injektion) – akzidentell (Kinder!), suizidal oder durch Missbrauch.",
u:"Medikamente (Schlafmittel, Benzodiazepine, Antidepressiva, Paracetamol, Opioide) • Alkohol, Drogen • Haushaltschemikalien (Reinigungsmittel, Lampenöl), Pflanzen, Pilze (Knollenblätterpilz!) • Kohlenmonoxid (siehe eigener Eintrag), Reizgase • Pflanzenschutzmittel (Alkylphosphate) • Kinder: Tabletten, Zigaretten, Batterien, Putzmittel",
s:"Je nach Gift: Bewusstseinsstörung bis Koma • Atemdepression (Opioide: stecknadelkopfgroße Pupillen; Benzodiazepine) • Erregung, Halluzinationen, weite Pupillen (Anticholinergika, Amphetamine, Kokain) • Übelkeit, Erbrechen, Durchfall, Bauchkrämpfe • Krampfanfälle • Herzrhythmusstörungen • Hypo-/Hyperthermie • Verätzungen im Mund (Säuren/Laugen) • Knollenblätterpilz: nach 6–24 Std. Brechdurchfall, scheinbare Besserung, dann Leberversagen (Tag 3–5) • Paracetamol: anfangs symptomarm, Leberversagen nach 2–4 Tagen",
l:"Unklare Bewusstseinsstörung, Erbrechen, Krampfanfälle oder auffällige Pupillen mit Hinweis auf Giftaufnahme",
ko:"Atemstillstand, Aspiration • Herzrhythmusstörungen, Schock • Leber-, Nierenversagen • Hirnschäden • Tod",
dd:"Hypoglykämie • Schlaganfall, Hirnblutung • Meningitis/Enzephalitis • Stoffwechselkoma • Epilepsie • psychiatrische Erkrankung",
b:"BZ (immer!) • Toxikologisches Screening (Blut, Urin), Paracetamol-/Alkoholspiegel • Leber-, Nierenwerte, Elektrolyte, Blutgase, CO-Hb, Cholinesterase (Alkylphosphate) • EKG",
nf:2,nfm:"Eigenschutz! • 112, zusätzlich Giftinformationszentrum (z. B. Giftnotruf Berlin 030 19240 / München 089 19240) • KEIN Erbrechen auslösen, keine Milch • bei Bewusstsein: Mund ausspülen, Wasser in kleinen Schlucken (nicht bei Schaumbildnern) • Bewusstlos: stabile Seitenlage, Atmung kontrollieren • Giftreste, Verpackungen, Erbrochenes asservieren • Vitalzeichen"},

{n:"Kohlenmonoxidvergiftung",a:"CO-Vergiftung, Rauchgasvergiftung",k:"allg",
d:"Vergiftung durch das farb-, geruch- und geschmacklose Gas Kohlenmonoxid, das sich ca. 250-mal stärker als Sauerstoff an Hämoglobin bindet → innere Erstickung.",
u:"Unvollständige Verbrennung: defekte Gasthermen/Heizungen, Kohleöfen, Holzkohlegrill in geschlossenen Räumen (Shisha-Bar!), Brände, Autoabgase in Garagen, Suizidversuch • oft mehrere Personen (auch Haustiere) betroffen",
s:"Kopfschmerzen (häufigstes Symptom), Schwindel, Übelkeit, Erbrechen • Müdigkeit, Verwirrtheit, Sehstörungen • Tachykardie, Brustschmerz (Herzischämie), Atemnot • Bewusstlosigkeit, Krampfanfälle, Koma • rosig-rote Hautfarbe (spät, unzuverlässig!) • Pulsoxymeter zeigt falsch normale Werte!",
l:"Kopfschmerz, Schwindel, Übelkeit bei mehreren Personen im gleichen Raum (Heizung, Brand, Grill)",
ko:"Hirnschäden, verzögerte neurologische Spätschäden (Gedächtnis, Parkinsonismus) • Herzinfarkt, Rhythmusstörungen • Tod • Fetus besonders gefährdet",
dd:"Grippaler Infekt, Influenza (mehrere Familienmitglieder!) • Migräne • Lebensmittelvergiftung • andere Intoxikationen",
b:"CO-Hb im Blut (Nichtraucher > 5 %, schwere Vergiftung > 20–30 %) • Laktat ↑, CK, Troponin • EKG",
nf:2,nfm:"Eigenschutz (Raum nicht betreten, Feuerwehr!) • 112 • Fenster/Türen öffnen, Patient an die frische Luft • Sauerstoff (Rettungsdienst, ggf. Druckkammer) • bewusstlos: stabile Seitenlage, ggf. Reanimation"},

{n:"Synkope",a:"Ohnmacht, Kollaps, vasovagale Synkope",k:"allg",
d:"Kurzer, spontan reversibler Bewusstseinsverlust mit Verlust des Muskeltonus durch vorübergehende Minderdurchblutung des Gehirns.",
u:"Reflexsynkope (häufigste): vasovagal (Schmerz, Angst, Blut sehen, langes Stehen, Hitze), situativ (Husten, Wasserlassen, Pressen), Karotissinus-Syndrom • Orthostatisch: Volumenmangel, Medikamente (Antihypertensiva), autonome Neuropathie (Diabetes, Parkinson) • Kardial (gefährlich!): Rhythmusstörungen (Bradykardie, AV-Block, Kammertachykardie), Aortenstenose, hypertrophe Kardiomyopathie, Lungenembolie, Herzinfarkt",
s:"Prodromi (vasovagal): Schwindel, Schwarzwerden vor Augen, Übelkeit, Schwitzen, Blässe, Gähnen, Wärmegefühl • kurzer Bewusstseinsverlust (Sekunden bis 1 Min.), Sturz • ggf. kurze Myoklonien (DD Epilepsie) • rasche vollständige Reorientierung • kardial: ohne Vorwarnung, im Liegen oder bei Belastung, Herzklopfen vorher",
l:"Kurze Bewusstlosigkeit mit rascher vollständiger Erholung",
ko:"Sturzverletzungen • bei kardialer Ursache plötzlicher Herztod",
dd:"Epileptischer Anfall (Zungenbiss seitlich, Nachschlaf, Verwirrtheit) • Hypoglykämie • TIA/Schlaganfall • psychogener Anfall • Intoxikation",
b:"BZ • EKG (immer!), ggf. Langzeit-EKG • Blutbild (Anämie), Elektrolyte • Schellong-Test, Echo",
nf:1,nfm:"Bewusstlos mit Atmung → stabile Seitenlage; nach Erwachen flach liegen, Beine hoch • BZ messen • 112 bei: Synkope unter Belastung oder im Liegen, Brustschmerz, Herzklopfen, Atemnot, Herzerkrankung, Verletzung, ausbleibender rascher Erholung, älteren Menschen"},

{n:"Fremdkörperaspiration / Bolusgeschehen",a:"Verschlucken, Bolustod, Ersticken",k:"allg",
d:"Eindringen eines Fremdkörpers in die Atemwege (Kehlkopf, Luftröhre, Bronchien). Bolus: großer Nahrungsbrocken verlegt den Kehlkopfeingang – akute Erstickungsgefahr.",
u:"Kinder (1–4 J.): Nüsse, Erdnüsse, Spielzeugteile, Münzen • Erwachsene: Fleischbrocken (Bolus), v. a. unter Alkohol, bei Zahnprothesen, Schluckstörungen (Schlaganfall, Demenz, Parkinson)",
s:"Plötzlicher heftiger Hustenanfall beim Essen/Spielen • Atemnot, Würgen, inspiratorischer Stridor • Griff an den Hals, kann nicht sprechen • Zyanose • Bewusstlosigkeit • später (kleine Fremdkörper): einseitig abgeschwächtes Atemgeräusch, Giemen, rezidivierende Pneumonien",
l:"Plötzlicher Erstickungsanfall beim Essen oder Spielen",
ko:"Ersticken, Herz-Kreislauf-Stillstand • Hypoxischer Hirnschaden • Atelektase, Pneumonie, Lungenabszess (übersehener Fremdkörper)",
dd:"Anaphylaxie, Larynxödem • Pseudokrupp, Epiglottitis • Asthmaanfall • Herzinfarkt („Café-Koronar“)",
b:"Röntgen/Bronchoskopie in der Klinik",
nf:2,nfm:"Zum Husten auffordern, solange effektiv • ineffektiv: bis zu 5 kräftige Schläge zwischen die Schulterblätter (vornübergebeugt), dann bis zu 5 Oberbauchkompressionen (Heimlich-Manöver; Säugling: 5 Brustkompressionen, kein Heimlich) • im Wechsel wiederholen • 112 • bewusstlos: Reanimation beginnen (Kompressionen können Fremdkörper lösen) • nach Heimlich immer ärztliche Kontrolle (innere Verletzungen)"},

{n:"Hyperventilationssyndrom",a:"Hyperventilationstetanie, psychogene Hyperventilation",k:"allg",
d:"Über den Bedarf gesteigerte Atmung → vermehrte CO₂-Abatmung → respiratorische Alkalose → Abnahme des ionisierten Kalziums → Tetaniesymptome.",
u:"Psychogen (häufigste): Angst, Panik, Aufregung, Stress, Schmerz • organische Ursachen ausschließen: Lungenembolie, Asthma, Pneumonie, Herzinfarkt, Ketoazidose (Kussmaul-Atmung), Sepsis, Salicylatvergiftung, Fieber, ZNS-Läsionen",
s:"Schnelle, tiefe Atmung, Lufthunger, Beklemmungsgefühl in der Brust • Kribbeln um den Mund und in Händen/Füßen • Pfötchenstellung der Hände, Karpfenmaul • Schwindel, Benommenheit, Herzklopfen • Angst, Unruhe, Todesangst",
l:"Schnelle Atmung + Kribbeln um den Mund + Pfötchenstellung bei Aufregung",
ko:"Synkope • Verletzungen • Übersehen einer organischen Ursache (!)",
dd:"Lungenembolie (!) • Herzinfarkt • Asthma • Hypoglykämie • Hypokalzämische Tetanie (Hypoparathyreoidismus) • Ketoazidose",
b:"Blutgase: pCO₂ ↓, pH ↑ • Kalzium gesamt normal • bei Zweifeln EKG, D-Dimere, BZ",
nf:1,nfm:"Beruhigen, ruhig und langsam mitatmen lassen (Bauchatmung, verlängerte Ausatmung) • Tütenrückatmung nur, wenn organische Ursache sicher ausgeschlossen (Gefahr bei Lungenembolie/Herzinfarkt!) • bei Brustschmerz, Vorerkrankungen, Unsicherheit → 112"},

{n:"Exsikkose / Dehydratation",a:"Austrocknung, Wassermangel",k:"allg",
d:"Abnahme des Körperwassers durch zu geringe Zufuhr oder zu hohe Verluste. Besonders gefährdet: Säuglinge, Kleinkinder und ältere Menschen.",
u:"Ungenügende Zufuhr: vermindertes Durstgefühl im Alter, Demenz, Schluckstörung, Bettlägerigkeit • Verluste: Durchfall, Erbrechen, Fieber, Schwitzen/Hitze, Diuretika, Diabetes mellitus (osmotische Diurese), Diabetes insipidus, Verbrennungen, Blutungen",
s:"Durst (bei Älteren oft fehlend!) • trockene Schleimhäute, trockene Zunge, stehende Hautfalten • verminderte, konzentrierte Urinmenge • Schwäche, Schwindel, Kopfschmerz • Tachykardie, Hypotonie, Orthostase • Verwirrtheit, Delir (Ältere!) • Fieber (Durstfieber) • Säuglinge: eingesunkene Fontanelle, eingefallene Augen, wenig nasse Windeln, Apathie, Gewichtsverlust",
l:"Trockene Schleimhäute, stehende Hautfalten, wenig Urin, Verwirrtheit beim älteren Menschen",
ko:"Hypovolämischer Schock • akutes Nierenversagen • Delir, Stürze • Thrombosen, Schlaganfall • Elektrolytentgleisung, Krampfanfälle",
dd:"Herzinsuffizienz, Sepsis • Hyperglykämisches Koma • Addison-Krise",
b:"Hkt ↑, Gesamteiweiß ↑ • Natrium (hyper-/hypo-/isoton), Kalium • Harnstoff, Kreatinin ↑ • BZ • Urin: spezifisches Gewicht ↑",
nf:1,nfm:"Schwere Exsikkose mit Bewusstseinsstörung, Schock oder fehlender Urinmenge → 112. Säuglinge mit Austrocknungszeichen → sofort Arzt."},

{n:"Hyperkaliämie",a:"Erhöhtes Kalium",k:"allg",
d:"Kaliumkonzentration im Serum > 5,0 mmol/l; ab ~6,5 mmol/l Gefahr lebensbedrohlicher Herzrhythmusstörungen.",
u:"Niereninsuffizienz (häufigste) • Medikamente: ACE-Hemmer, Sartane, kaliumsparende Diuretika (Spironolacton), NSAR, Kaliumpräparate • Addison • Azidose (Ketoazidose) • Zellzerfall: Hämolyse, Rhabdomyolyse, Tumorlyse, Verbrennungen • Pseudohyperkaliämie (Stauung, Hämolyse in der Blutprobe)",
s:"Oft symptomarm • Muskelschwäche, Lähmungen • Parästhesien • Übelkeit • Herzrhythmusstörungen: Bradykardie, AV-Block, Kammerflimmern, Asystolie",
l:"Muskelschwäche und Bradykardie bei Niereninsuffizienz/ACE-Hemmer-Einnahme",
ko:"Kammerflimmern, Herzstillstand",
dd:"Pseudohyperkaliämie (Laborartefakt) • andere Ursachen von Bradykardie/Muskelschwäche",
b:"Kalium ↑ • Kreatinin, BZ, Blutgase (Azidose), CK • EKG: hohe, spitze T-Wellen, PQ-Verlängerung, verbreiterter QRS",
nf:2,nfm:"Kalium > 6,5 oder EKG-Veränderungen/Symptome → 112 (Monitoring)"},

{n:"Hyponatriämie",a:"Natriummangel",k:"allg",
d:"Natriumkonzentration im Serum < 135 mmol/l; häufigste Elektrolytstörung, v. a. bei älteren Menschen.",
u:"Diuretika (v. a. Thiazide) • SIADH (inadäquate ADH-Sekretion: Bronchialkarzinom, Pneumonie, ZNS-Erkrankungen, Medikamente wie SSRI, Carbamazepin) • Erbrechen, Durchfall • Herzinsuffizienz, Leberzirrhose, nephrotisches Syndrom • Addison, Hypothyreose • übermäßiges Trinken (psychogene Polydipsie, Marathon, Ecstasy), „Tea and toast“-Diät",
s:"Leicht: oft symptomlos, Übelkeit, Kopfschmerz, Konzentrationsstörung, Gangunsicherheit (Stürze!) • Schwer (< 125 mmol/l, rasch entstanden): Verwirrtheit, Erbrechen, Somnolenz, Krampfanfälle, Koma (Hirnödem)",
l:"Verwirrtheit, Übelkeit und Stürze beim älteren Menschen unter Diuretika",
ko:"Hirnödem, Krampfanfälle, Atemstillstand • Stürze, Frakturen • bei zu rascher Korrektur: osmotische Demyelinisierung (zentrale pontine Myelinolyse)",
dd:"Delir anderer Ursache • Demenz • Schlaganfall • Hypoglykämie",
b:"Natrium ↓ • Serum- und Urinosmolalität, Urin-Natrium • TSH, Kortisol • Kreatinin, BZ",
nf:1,nfm:"Bewusstseinsstörung, Krampfanfall → 112. Langsame Korrektur nur in der Klinik."},

{n:"Akute Höhenkrankheit / Taucherkrankheit",a:"Höhenlungenödem, Höhenhirnödem, Dekompressionskrankheit, Caissonkrankheit",k:"allg",
d:"Höhenkrankheit: Anpassungsstörung an Sauerstoffmangel in großer Höhe (> 2.500 m). Dekompressionskrankheit: Bildung von Gasblasen (Stickstoff) im Gewebe nach zu schnellem Auftauchen.",
u:"Höhe: zu schneller Aufstieg, fehlende Akklimatisation, Anstrengung, frühere Höhenkrankheit • Tauchen: zu schnelles Auftauchen, fehlende Dekompressionsstopps, Fliegen nach dem Tauchen",
s:"Akute Bergkrankheit: Kopfschmerzen, Übelkeit, Appetitlosigkeit, Schwindel, Schlafstörungen, Müdigkeit • Höhenhirnödem: Ataxie, Verwirrtheit, Bewusstseinsstörung • Höhenlungenödem: Leistungsabfall, Atemnot in Ruhe, Husten, Brodeln, Zyanose • Dekompression: Gelenk-/Muskelschmerzen („Bends“), Hautjucken, Marmorierung, Lähmungen, Sehstörung, Atemnot, Bewusstlosigkeit",
l:"Kopfschmerz und Übelkeit in großer Höhe bzw. Gelenkschmerzen/neurologische Ausfälle nach dem Tauchen",
ko:"Höhenhirn- und Höhenlungenödem, Tod • Dekompression: bleibende neurologische Schäden, arterielle Gasembolie",
dd:"Migräne • Infekt • Erschöpfung, Dehydratation • Hypoglykämie • Schlaganfall",
b:"Pulsoxymetrie • Klinik",
nf:2,nfm:"Höhenhirn-/-lungenödem: sofort Abstieg, Sauerstoff, Bergrettung/112 • Taucherunfall: 112 bzw. Taucherhotline, 100 % Sauerstoff, flach lagern, Druckkammer"},

{n:"Stromunfall / Blitzunfall",a:"Elektrounfall",k:"allg",
d:"Schädigung durch elektrischen Strom: Herzrhythmusstörungen, Verbrennungen an Ein- und Austrittsstellen, innere Gewebeschäden.",
u:"Haushaltsstrom (Niederspannung < 1.000 V): defekte Geräte, Bastelarbeiten, Kinder an Steckdosen • Hochspannung (> 1.000 V): Bahnoberleitungen, Industrie • Blitzschlag",
s:"Niederspannung: Muskelkrampf („Kleben bleiben“), Herzrhythmusstörungen bis Kammerflimmern, Strommarken (kleine Verbrennungen an Ein-/Austritt) • Hochspannung: schwere Verbrennungen, Muskelnekrosen, Lichtbogen, Stürze, Bewusstlosigkeit, Atemstillstand • Blitz: Herz-Atem-Stillstand, Lichtenberg-Figuren (farnkrautartige Hautzeichnung), Trommelfellrupturen",
l:"Bewusstlosigkeit/Herzrhythmusstörungen nach Stromkontakt, Strommarken",
ko:"Kammerflimmern, Asystolie • Rhabdomyolyse, Nierenversagen • Kompartmentsyndrom • Verletzungen durch Sturz • Katarakt, neurologische Spätschäden",
dd:"Synkope, Krampfanfall • Herzinfarkt",
b:"EKG (auch bei Symptomfreiheit), CK, Myoglobin, Kreatinin, Kalium, Troponin",
nf:2,nfm:"EIGENSCHUTZ: Strom abschalten (Sicherung, Stecker), Hochspannung: Abstand ≥ 5 m, nur Fachpersonal • 112 • Bewusstsein/Atmung prüfen, ggf. Reanimation + AED • Strommarken steril abdecken • jeder Stromunfall gehört zur EKG-Überwachung in die Klinik"}
);

</script>
<script>
(function(){
"use strict";
var D = (window.D || []).slice();
var CATS = window.CATS || {};

// ---------- Hilfsfunktionen ----------
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"");}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
// Text mit " • " als Aufzählung darstellen
function fmt(s){
  if(!s) return "<p>–</p>";
  var parts=String(s).split(" • ");
  if(parts.length>1) return "<ul>"+parts.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>";
  return "<p>"+esc(s)+"</p>";
}
D.forEach(function(d){
  d.id=slug(d.n);
  d._s=norm([d.n,d.a,d.d,d.u,d.s,d.l,d.ko,d.dd,d.b,d.nfm,d.bv,(CATS[d.k]||"")].join(" "));
  d._n=norm(d.n+" "+(d.a||""));
});
D.sort(function(a,b){return a.n.localeCompare(b.n,"de");});
var byId={}; D.forEach(function(d){byId[d.id]=d;});

// ---------- Einstellungen ----------
var fs=parseInt(store("hp_fs")||"17",10); if(!(fs>=13&&fs<=26)) fs=17;
function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px");store("hp_fs",String(fs));}
applyFs();
$("fsPlus").onclick=function(){fs=Math.min(26,fs+1);applyFs();};
$("fsMinus").onclick=function(){fs=Math.max(13,fs-1);applyFs();};
var th=store("hp_theme"); if(th) document.documentElement.setAttribute("data-theme",th);
$("themeBtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  var nx=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); store("hp_theme",nx);
};
var favs={}; try{favs=JSON.parse(store("hp_favs")||"{}")||{};}catch(e){favs={};}
function saveFavs(){store("hp_favs",JSON.stringify(favs));}

// ---------- Zustand ----------
var state={tab:"liste",q:"",cat:"",not:false,bv:false,fav:false};

// Kategorie-Auswahl
(function(){
  var sel=$("catSel"), counts={};
  D.forEach(function(d){counts[d.k]=(counts[d.k]||0)+1;});
  var h='<option value="">Alle Organsysteme ('+D.length+')</option>';
  Object.keys(CATS).forEach(function(k){ if(counts[k]) h+='<option value="'+k+'">'+esc(CATS[k])+' ('+counts[k]+')</option>';});
  sel.innerHTML=h;
  sel.onchange=function(){state.cat=sel.value;render();};
})();
function toggle(btn,key){btn.onclick=function(){state[key]=!state[key];btn.setAttribute("aria-pressed",state[key]);render();};}
toggle($("fNot"),"not"); toggle($("fBv"),"bv"); toggle($("fFav"),"fav");
var qT; $("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){state.q=e.target.value;render();},120);});

document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){setTab(t.dataset.tab);};
});
function setTab(tab){
  state.tab=tab;
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t.dataset.tab===tab);});
  $("listControls").style.display=tab==="liste"?"":"none";
  window.scrollTo(0,0); render();
}

// ---------- Badges ----------
function badges(d,withCat){
  var h="";
  if(withCat) h+='<span class="badge b-cat">'+esc(CATS[d.k]||d.k)+'</span>';
  if(d.nf===2) h+='<span class="badge b-red">🚨 NOTFALL</span>';
  else if(d.nf===1) h+='<span class="badge b-amber">⚠️ kann Notfall werden</span>';
  if(d.bv) h+='<span class="badge b-violet">⛔ Behandlungsverbot</span>';
  return h;
}
function card(d){
  return '<button class="card" data-id="'+d.id+'"><h3>'+(favs[d.id]?"★ ":"")+esc(d.n)+'</h3>'+
    (d.a?'<div class="meta">'+esc(d.a)+'</div>':'')+
    '<div class="badges">'+badges(d,true)+'</div>'+
    (d.l?'<p class="ls">'+esc(d.l)+'</p>':'')+'</button>';
}
function bindCards(root){
  root.querySelectorAll(".card,[data-open]").forEach(function(el){
    el.addEventListener("click",function(){openD(el.dataset.id||el.dataset.open);});
  });
}

// ---------- Liste ----------
function filtered(){
  var terms=norm(state.q).split(/\s+/).filter(Boolean);
  var res=D.filter(function(d){
    if(state.cat && d.k!==state.cat) return false;
    if(state.not && !d.nf) return false;
    if(state.bv && !d.bv) return false;
    if(state.fav && !favs[d.id]) return false;
    for(var i=0;i<terms.length;i++) if(d._s.indexOf(terms[i])<0) return false;
    return true;
  });
  if(terms.length){
    res.sort(function(a,b){
      var sa=terms.every(function(t){return a._n.indexOf(t)>=0;})?0:1;
      var sb=terms.every(function(t){return b._n.indexOf(t)>=0;})?0:1;
      return sa-sb || a.n.localeCompare(b.n,"de");
    });
  }
  return res;
}
function renderList(){
  var r=filtered();
  var h='<p class="count">'+r.length+' von '+D.length+' Erkrankungen'+(state.q?' für „'+esc(state.q)+'“':'')+'</p>';
  if(!r.length) h+='<div class="empty">Nichts gefunden. Anderen Suchbegriff oder weniger Filter versuchen.</div>';
  else h+='<div class="list">'+r.map(card).join("")+'</div>';
  h+=disclaimer();
  $("main").innerHTML=h; bindCards($("main"));
}

// ---------- Detail ----------
var SECS=[
  ["d","1","Kurze Definition / Erklärung"],
  ["k","2","Kategorie / Organsystem"],
  ["u","3","Ursachen / Pathophysiologie"],
  ["s","4","Symptome / Leitsymptome"],
  ["ko","5","Komplikationen"],
  ["dd","6","Differentialdiagnosen"],
  ["b","7","Blutwerte / Labor / Diagnostik"]
];
function openD(id,noPush){
  var d=byId[id]; if(!d) return;
  $("dTitle").textContent=d.n;
  $("dFav").textContent=favs[d.id]?"★":"☆";
  $("dFav").onclick=function(){ if(favs[d.id]) delete favs[d.id]; else favs[d.id]=1; saveFavs(); $("dFav").textContent=favs[d.id]?"★":"☆"; };
  var h="";
  if(d.a) h+='<p class="alias">Auch: '+esc(d.a)+'</p>';
  h+='<div class="badges" style="margin-bottom:6px">'+badges(d,false)+'</div>';
  if(d.nf) h+='<div class="alert '+(d.nf===2?"red":"amber")+'"><h4>'+(d.nf===2?"🚨 NOTFALL – sofort 112 / Notarzt":"⚠️ Kann zum Notfall werden")+'</h4>'+fmt(d.nfm||"Bei Verschlechterung sofort Notruf 112.")+'</div>';
  if(d.bv) h+='<div class="alert violet"><h4>⛔ Behandlungsverbot für Heilpraktiker</h4>'+fmt(d.bv)+'</div>';
  SECS.forEach(function(s){
    var v=s[0]==="k"?(CATS[d.k]||d.k):d[s[0]];
    h+='<div class="sec"><h4><span class="num">'+s[1]+'.</span> '+s[2]+'</h4>'+fmt(v)+
      (s[0]==="s"&&d.l?'<div class="ls-box">Leitsymptom(e): '+esc(d.l)+'</div>':'')+'</div>';
  });
  h+=disclaimer();
  $("dBody").innerHTML=h;
  $("detail").classList.add("open"); $("detail").scrollTop=0;
  document.body.style.overflow="hidden";
  if(!noPush){ try{history.pushState({d:id},"","#"+id);}catch(e){} }
}
function closeD(){ $("detail").classList.remove("open"); document.body.style.overflow=""; if(state.tab==="liste") renderList(); }
$("back").onclick=function(){ if(history.state&&history.state.d) history.back(); else closeD(); };
window.addEventListener("popstate",function(e){ if(e.state&&e.state.d) openD(e.state.d,true); else closeD(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && $("detail").classList.contains("open")) $("back").click(); });

function disclaimer(){
  return '<p class="disc">Lern- und Nachschlagehilfe zur Vorbereitung auf die Heilpraktikerprüfung – ersetzt kein Lehrbuch, keine ärztliche Diagnose und nicht den aktuellen Gesetzestext. Laborwerte sind Richtwerte (laborabhängig). Rechtsstand: IfSG, HeilprG, AMG, BtMG, ZHG, HebG – bei Zweifel den aktuellen Gesetzestext prüfen.</p>';
}

// ---------- Notfälle ----------
var LEIT=[
  ["Akuter Brustschmerz","Herzinfarkt, instabile Angina pectoris, Lungenembolie, Aortendissektion, Spannungspneumothorax, Perikarditis/Perikardtamponade, Ösophagusruptur"],
  ["Akute Atemnot","Lungenembolie, Lungenödem, Status asthmaticus, Pneumothorax, Anaphylaxie, Epiglottitis/Pseudokrupp, Fremdkörperaspiration, Pneumonie (schwer)"],
  ["Akuter Bauchschmerz (akutes Abdomen)","Perforation, Ileus, Appendizitis, Mesenterialinfarkt, akute Pankreatitis, rupturiertes Aortenaneurysma, Extrauteringravidität, Gallen-/Nierenkolik, Hodentorsion/Ovarialtorsion"],
  ["Plötzlicher „Vernichtungskopfschmerz“","Subarachnoidalblutung, Hirnblutung, Meningitis, akutes Glaukom, hypertensiver Notfall, Sinusvenenthrombose"],
  ["Lähmung, Sprach-/Sehstörung, hängender Mundwinkel","Schlaganfall/TIA (FAST-Test!), Hirnblutung, Hypoglykämie (DD!)"],
  ["Fieber + Nackensteife + Petechien","Meningokokken-Meningitis / -Sepsis (Waterhouse-Friderichsen) – Behandlungsverbot + Notfall"],
  ["Bewusstseinsstörung / Koma","Hypoglykämie, Ketoazidose, hyperosmolares Koma, Schlaganfall, Vergiftung, Leber-/urämisches Koma, Addison-Krise, Myxödemkoma, Krampfanfall"],
  ["Krampfanfall > 5 Minuten","Status epilepticus, Eklampsie, Hypoglykämie, Meningitis/Enzephalitis"],
  ["Schock (Puls ↑, RR ↓, kaltschweißig)","Blutung, Anaphylaxie, Sepsis, Herzinfarkt (kardiogen), Lungenembolie, Dehydratation"],
  ["Bluterbrechen / Teerstuhl","Ösophagusvarizenblutung, Ulkusblutung, Mallory-Weiss-Syndrom"],
  ["Kaltes, blasses, pulsloses Bein","Akuter arterieller Verschluss (6 P nach Pratt)"],
  ["Geschwollenes, blau-rotes, schmerzhaftes Bein","Tiefe Beinvenenthrombose (Lungenemboliegefahr!), Phlegmasia coerulea dolens"],
  ["Rotes, hartes, schmerzhaftes Auge + Übelkeit","Akuter Glaukomanfall"],
  ["Plötzlicher schmerzloser Sehverlust","Zentralarterienverschluss, Netzhautablösung, Riesenzellarteriitis"],
  ["Akuter Hodenschmerz (junger Mann)","Hodentorsion (OP binnen 4–6 Std.)"],
  ["Schwangere mit Kopfschmerz, Sehstörung, Oberbauchschmerz","Präeklampsie/Eklampsie, HELLP-Syndrom"],
  ["Unterbauchschmerz + ausbleibende Regel","Extrauteringravidität (Tubarruptur → Schock)"],
  ["Suizidgedanken mit konkretem Plan","Akute Suizidalität → nicht allein lassen, 112"],
  ["Rückenschmerz + Taubheit im Reithosenbereich + Blasenstörung","Cauda-equina-Syndrom (Notfall-OP)"]
];
function renderNotfall(){
  var groups={};
  D.filter(function(d){return d.nf===2;}).forEach(function(d){(groups[d.k]=groups[d.k]||[]).push(d);});
  var h='<div class="panel" style="border-color:var(--red)"><h3>🚑 Grundregeln im Notfall</h3>'+
  '<p><span class="big112">112</span> &nbsp;Notruf – Feuerwehr/Rettungsdienst (europaweit)</p>'+
  '<ol><li><b>Eigenschutz</b>, Situation erfassen.</li>'+
  '<li><b>Bewusstsein</b> prüfen (ansprechen, anfassen, Schmerzreiz).</li>'+
  '<li><b>Atmung</b> prüfen (Kopf überstrecken, max. 10 Sek. sehen–hören–fühlen).</li>'+
  '<li><b>Keine normale Atmung → 112 + Herzdruckmassage</b> 30:2 (100–120/min, 5–6 cm tief), AED holen lassen.</li>'+
  '<li>Bewusstlos mit Atmung → <b>stabile Seitenlage</b>, ständig Atmung kontrollieren.</li>'+
  '<li>Notruf: <b>Wo? Was? Wie viele? Welche Verletzungen/Symptome? Warten auf Rückfragen.</b></li>'+
  '<li>Vitalzeichen überwachen (Puls, RR, Atmung, Bewusstsein, BZ), beim Patienten bleiben, beruhigen, Wärmeerhalt, <b>nichts essen/trinken</b>.</li>'+
  '<li><b>ABCDE</b>: Airway – Breathing – Circulation – Disability (Neuro, BZ) – Exposure.</li>'+
  '<li>Dokumentieren (Uhrzeit, Befunde, Maßnahmen) und an Rettungsdienst übergeben.</li></ol>'+
  '<p><b>Lagerungen:</b> Schock → Beine hoch (Schocklage, nicht bei kardiogenem Schock/Lungenödem) • Atemnot/Lungenödem/Herzinfarkt → Oberkörper hoch (Herzbett, Beine tief) • akutes Abdomen → Knierolle • Schlaganfall → Oberkörper 30° • Schwangere ab 2. Hälfte → Linksseitenlage (V.-cava-Kompression).</p>'+
  '<p><b>Merke:</b> Im Notfall darf und muss auch der Heilpraktiker Erste Hilfe leisten (§ 323c StGB – unterlassene Hilfeleistung). Auch bei Behandlungsverbot gilt die Pflicht zur Ersten Hilfe!</p></div>';
  h+='<div class="panel"><h3>🔎 Leitsymptom → an welchen Notfall denken?</h3><div class="tscroll"><table class="t"><tr><th>Leitsymptom</th><th>Denke an</th></tr>'+
    LEIT.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td></tr>';}).join("")+'</table></div></div>';
  h+='<h3 style="margin:18px 0 4px">Alle Erkrankungen, die immer ein Notfall sind ('+D.filter(function(d){return d.nf===2;}).length+')</h3>';
  Object.keys(CATS).forEach(function(k){
    if(!groups[k]) return;
    h+='<div class="grp">'+esc(CATS[k])+'</div><div class="list">'+groups[k].map(card).join("")+'</div>';
  });
  var n1=D.filter(function(d){return d.nf===1;});
  h+='<h3 style="margin:22px 0 4px">⚠️ Können zum Notfall werden ('+n1.length+')</h3><div class="list">'+n1.map(card).join("")+'</div>';
  h+=disclaimer();
  $("main").innerHTML=h; bindCards($("main"));
}

// ---------- Behandlungsverbote ----------
function renderVerbot(){
  var bv=D.filter(function(d){return d.bv;});
  var h='<div class="panel" style="border-color:var(--violet)"><h3>⛔ Behandlungsverbot nach § 24 Infektionsschutzgesetz (IfSG)</h3>'+
  '<p>Die Behandlung von Personen, die an einer der folgenden Krankheiten erkrankt <b>oder dessen verdächtig</b> sind, ist <b>nur Ärzten</b> gestattet:</p><ul>'+
  '<li><b>§ 6 Abs. 1 Satz 1 Nr. 1 IfSG</b> – meldepflichtige Krankheiten (Verdacht, Erkrankung, Tod): Botulismus, Cholera, Diphtherie, humane spongiforme Enzephalopathie (CJK), akute Virushepatitis, HUS, virusbedingtes hämorrhagisches Fieber, Keuchhusten, Masern, Meningokokken-Meningitis/-Sepsis, Milzbrand, Mumps, Pest, Poliomyelitis, Röteln, Tollwut, Typhus/Paratyphus, Windpocken, zoonotische Influenza, Tuberkulose (Erkrankung/Tod) u. a.</li>'+
  '<li><b>§ 6 Abs. 1 Satz 1 Nr. 2</b> – mikrobielle Lebensmittelvergiftung / akute infektiöse Gastroenteritis (bei Tätigkeit im Lebensmittelbereich oder ≥ 2 Fällen mit Zusammenhang)</li>'+
  '<li><b>§ 6 Abs. 1 Satz 1 Nr. 5</b> – bedrohliche übertragbare Krankheiten, die nicht namentlich genannt sind</li>'+
  '<li><b>§ 34 Abs. 1 IfSG</b> – Krankheiten in Gemeinschaftseinrichtungen (Schule, Kita): u. a. Cholera, Diphtherie, EHEC-Enteritis, hämorrhagisches Fieber, Hib-Meningitis, Impetigo contagiosa, Keuchhusten, ansteckungsfähige Lungen-TBC, Masern, Meningokokken, Mumps, Mpox (Orthopocken), Paratyphus, Pest, Polio, Röteln, Scharlach / Streptococcus-pyogenes-Infektionen, Shigellose, Skabies, Typhus, Hepatitis A/E, Windpocken, <b>Kopflausbefall</b></li>'+
  '<li><b>§ 7 IfSG</b> – Infektion mit einem der labormeldepflichtigen Erreger (z. B. Salmonellen, Campylobacter, Noro-, Rota-, Influenza-, Hepatitis-, FSME-, Varizella-Zoster-Viren, Legionellen, Listerien, Yersinien, Giardia, Toxoplasma konnatal, HIV, Treponema pallidum, Plasmodien, Echinokokken, Gonokokken …)</li>'+
  '<li><b>sonstige sexuell übertragbare Krankheiten</b> (z. B. Gonorrhoe, Chlamydien, Herpes genitalis, Feigwarzen, Trichomonaden, Ulcus molle)</li></ul>'+
  '<p>Auch das Untersuchen auf diese Krankheiten (Abstriche/Erregernachweis) ist dem Heilpraktiker verboten. Bei Verdacht: <b>Patient an den Arzt verweisen</b>. Heilpraktiker sind nach § 8 Abs. 1 Nr. 8 IfSG bei Verdacht/Erkrankung nach § 6 <b>selbst meldepflichtig</b> (namentliche Meldung binnen 24 Std. an das Gesundheitsamt).</p></div>';
  h+='<div class="panel"><h3>📜 Weitere Tätigkeitsverbote für Heilpraktiker</h3><ul>'+
  '<li><b>Zahnheilkunde</b> (Zahnheilkundegesetz) – keine Behandlung von Zähnen, Mund- und Kieferkrankheiten im zahnärztlichen Sinn</li>'+
  '<li><b>Geburtshilfe</b> (Hebammengesetz) – nur Hebammen und Ärzte; Ausnahme: Notfall</li>'+
  '<li><b>Verschreibungspflichtige Arzneimittel</b> (AMG) – dürfen nicht verordnet werden</li>'+
  '<li><b>Betäubungsmittel</b> (BtMG) – keine Verschreibung</li>'+
  '<li><b>Röntgen / ionisierende Strahlen</b> zur Anwendung am Menschen (Strahlenschutzrecht)</li>'+
  '<li><b>Leichenschau</b> und Ausstellen des Totenscheins; Todesfeststellung (Landesrecht)</li>'+
  '<li><b>Impfungen</b> sowie Behandlung meldepflichtiger Tierseuchen; Ausstellen von <b>Arbeitsunfähigkeitsbescheinigungen</b> mit Wirkung für die gesetzliche Krankenversicherung</li>'+
  '<li>Transplantationen, Schwangerschaftsabbruch, Kastration, Blut-/Plasmaspenden-Entnahme, künstliche Befruchtung (ESchG), Geschlechtsumwandlung u. a. – Arztvorbehalt</li>'+
  '<li>Behandlung im Rahmen der gesetzlichen Unfall-/Krankenversicherung als Leistungserbringer</li></ul>'+
  '<p><b>Sorgfaltspflicht:</b> Der Heilpraktiker muss seine Grenzen kennen und bei ernsten Erkrankungen rechtzeitig an den Arzt verweisen.</p></div>';
  h+='<h3 style="margin:18px 0 4px">Erkrankungen mit Behandlungsverbot in dieser Sammlung ('+bv.length+')</h3><div class="list">'+bv.map(card).join("")+'</div>';
  h+=disclaimer();
  $("main").innerHTML=h; bindCards($("main"));
}

// ---------- Lernkarten ----------
var lern={cat:"",only:"",cur:null,shown:{}};
function pickCard(){
  var pool=D.filter(function(d){
    if(lern.cat&&d.k!==lern.cat) return false;
    if(lern.only==="nf"&&!d.nf) return false;
    if(lern.only==="bv"&&!d.bv) return false;
    if(lern.only==="fav"&&!favs[d.id]) return false;
    return true;
  });
  if(!pool.length){lern.cur=null;return;}
  var c; do{c=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&lern.cur&&c.id===lern.cur.id);
  lern.cur=c; lern.shown={};
}
function renderLern(){
  if(!lern.cur) pickCard();
  var catOpts='<option value="">Alle Organsysteme</option>'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(lern.cat===k?" selected":"")+'>'+esc(CATS[k])+'</option>';}).join("");
  var h='<div class="filters"><select class="cat" id="lCat">'+catOpts+'</select>'+
    '<select class="cat" id="lOnly"><option value="">Alle Karten</option><option value="nf"'+(lern.only==="nf"?" selected":"")+'>Nur Notfälle</option><option value="bv"'+(lern.only==="bv"?" selected":"")+'>Nur Behandlungsverbote</option><option value="fav"'+(lern.only==="fav"?" selected":"")+'>Nur Gemerkte</option></select></div>';
  var c=lern.cur;
  if(!c){h+='<div class="empty">Keine Karten für diese Auswahl.</div>';}
  else{
    h+='<div class="flash"><div class="meta" style="color:var(--muted);font-size:.85rem">'+esc(CATS[c.k])+'</div><h3>'+esc(c.n)+'</h3>'+
      '<p style="color:var(--muted);margin:4px 0 0">Was weißt du dazu? Tippe auf einen Punkt zum Aufdecken.</p><div class="revbtns">';
    var items=[["d","Definition"],["u","Ursachen"],["s","Symptome"],["l","Leitsymptom"],["ko","Komplikationen"],["dd","DD"],["b","Labor"],["nf","Notfall?"],["bv","Behandlungsverbot?"]];
    items.forEach(function(it){ h+='<button class="btn ghost" data-rev="'+it[0]+'"'+(lern.shown[it[0]]?' style="opacity:.55"':'')+'>'+it[1]+'</button>'; });
    h+='<button class="btn ghost" data-rev="all">Alles</button></div>';
    items.forEach(function(it){
      if(!lern.shown[it[0]]) return;
      var v;
      if(it[0]==="nf") v=c.nf===2?"JA – immer Notfall. "+(c.nfm||""):c.nf===1?"Kann zum Notfall werden. "+(c.nfm||""):"Kein typischer Notfall.";
      else if(it[0]==="bv") v=c.bv?"JA – "+c.bv:"Kein Behandlungsverbot nach IfSG (Sorgfaltspflicht beachten).";
      else v=c[it[0]];
      h+='<div class="sec"><h4>'+it[1]+'</h4>'+fmt(v)+'</div>';
    });
    h+='<div class="revbtns"><button class="btn" id="lNext">Nächste Karte →</button><button class="btn ghost" data-open="'+c.id+'">Ganze Seite öffnen</button></div></div>';
  }
  $("main").innerHTML=h;
  $("lCat").onchange=function(e){lern.cat=e.target.value;lern.cur=null;renderLern();};
  $("lOnly").onchange=function(e){lern.only=e.target.value;lern.cur=null;renderLern();};
  if($("lNext")) $("lNext").onclick=function(){pickCard();renderLern();};
  $("main").querySelectorAll("[data-rev]").forEach(function(b){b.onclick=function(){
    var r=b.dataset.rev; if(r==="all"){["d","u","s","l","ko","dd","b","nf","bv"].forEach(function(x){lern.shown[x]=1;});} else lern.shown[r]=1; renderLern();
  };});
  bindCards($("main"));
}

// ---------- Laborwerte ----------
function renderLabor(){
  var L=window.LABOR||[];
  var h='<div class="panel"><h3>🧪 Wichtige Laborwerte (Erwachsene, Richtwerte)</h3><p style="color:var(--muted)">Referenzbereiche schwanken je nach Labor und Methode. ↑/↓ = typische Ursachen.</p></div>';
  L.forEach(function(g){
    h+='<div class="panel"><h3>'+esc(g.g)+'</h3><div class="tscroll"><table class="t"><tr><th>Wert</th><th>Normbereich</th><th>↑ erhöht bei</th><th>↓ erniedrigt bei</th></tr>'+
      g.r.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';}).join("")+'</table></div></div>';
  });
  h+=disclaimer();
  $("main").innerHTML=h;
}

function render(){
  if(state.tab==="liste") renderList();
  else if(state.tab==="notfall") renderNotfall();
  else if(state.tab==="verbot") renderVerbot();
  else if(state.tab==="lern") renderLern();
  else if(state.tab==="labor") renderLabor();
}
render();
var h0=location.hash.replace("#",""); if(h0&&byId[h0]){ try{history.replaceState(null,"",location.pathname);}catch(e){} openD(h0); }
})();

</script>
