<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Krankheiten Nachschlagewerk</title>
<meta name="description" content="Offline-Nachschlagewerk für Heilpraktiker: Definition, Organsystem, Ursachen, Symptome, Komplikationen, Differentialdiagnosen, Laborwerte, Notfälle und Behandlungsverbote.">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#efece5; --text:#1f2328; --muted:#5d6670;
  --line:#ddd8cc; --accent:#2f6f5e; --accent-weak:#e1eee9;
  --red:#b42318; --red-weak:#fde8e6; --amber:#9a5b00; --amber-weak:#fff3d6;
  --violet:#5b3a9e; --violet-weak:#eee8fa; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181b; --surface:#1d2125; --surface2:#262b30; --text:#e8eaed; --muted:#a2aab3;
    --line:#343a41; --accent:#6cc4a8; --accent-weak:#1f3530;
    --red:#ff7a6e; --red-weak:#3a1f1d; --amber:#f0b54a; --amber-weak:#352a14;
    --violet:#b79cf5; --violet-weak:#2b2340; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1d2125; --surface2:#262b30; --text:#e8eaed; --muted:#a2aab3;
  --line:#343a41; --accent:#6cc4a8; --accent-weak:#1f3530;
  --red:#ff7a6e; --red-weak:#3a1f1d; --amber:#f0b54a; --amber-weak:#352a14;
  --violet:#b79cf5; --violet-weak:#2b2340; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.titlebar h1{font-size:1.15rem;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;min-width:40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0d1a16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0d1a16}}
.search{display:flex;gap:8px;padding-bottom:10px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:1rem}
.search input:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.red[aria-pressed="true"]{background:var(--red-weak);border-color:var(--red);color:var(--red)}
.chip.violet[aria-pressed="true"]{background:var(--violet-weak);border-color:var(--violet);color:var(--violet)}
select.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.84rem;max-width:100%}
main{padding:14px 0 60px}
.count{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 2px;font-size:1.02rem}
.card .meta{color:var(--muted);font-size:.82rem}
.card .ls{margin:6px 0 0;font-size:.9rem;color:var(--text);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.01em}
.b-red{background:var(--red-weak);color:var(--red)}
.b-amber{background:var(--amber-weak);color:var(--amber)}
.b-violet{background:var(--violet-weak);color:var(--violet)}
.b-cat{background:var(--surface2);color:var(--muted)}
/* Detail */
.detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.detail.open{display:block}
.dhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);z-index:2}
.dhead .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.dhead h2{margin:0;font-size:1.15rem;flex:1;line-height:1.25}
.dbody{padding:14px 0 70px}
.alias{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.alert{border-radius:12px;padding:10px 14px;margin:10px 0;border:1.5px solid}
.alert h4{margin:0 0 4px;font-size:.95rem}
.alert p{margin:0;font-size:.93rem}
.alert.red{background:var(--red-weak);border-color:var(--red)}
.alert.red h4{color:var(--red)}
.alert.amber{background:var(--amber-weak);border-color:var(--amber)}
.alert.amber h4{color:var(--amber)}
.alert.violet{background:var(--violet-weak);border-color:var(--violet)}
.alert.violet h4{color:var(--violet)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sec h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.sec h4 .num{display:inline-block;min-width:1.4em}
.sec p{margin:0}
.sec ul{margin:0;padding-left:1.15em}
.sec li{margin:2px 0}
.ls-box{background:var(--accent-weak);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.panel h3{margin:0 0 8px;font-size:1.05rem}
.panel p,.panel li{font-size:.95rem}
.panel ul,.panel ol{padding-left:1.2em;margin:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.big112{font-size:1.6rem;font-weight:800;color:var(--red)}
.grp{margin:16px 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.flash h3{margin:0 0 4px;font-size:1.3rem}
.revbtns{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.disc{font-size:.8rem;color:var(--muted);margin-top:20px;line-height:1.45}
mark{background:var(--amber-weak);color:inherit;border-radius:3px;padding:0 1px}
.fav{border:none;background:none;font-size:1.3rem;cursor:pointer;padding:4px;line-height:1}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <h1>🩺 Krankheiten-Nachschlagewerk</h1>
      <button class="iconbtn" id="fsMinus" title="Schrift kleiner" aria-label="Schrift kleiner">A−</button>
      <button class="iconbtn" id="fsPlus" title="Schrift größer" aria-label="Schrift größer">A+</button>
      <button class="iconbtn" id="themeBtn" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="liste" aria-selected="true">📚 Erkrankungen</button>
      <button class="tab" role="tab" data-tab="notfall" aria-selected="false">🚨 Notfälle</button>
      <button class="tab" role="tab" data-tab="verbot" aria-selected="false">⛔ Behandlungsverbote</button>
      <button class="tab" role="tab" data-tab="lern" aria-selected="false">🃏 Lernkarten</button>
      <button class="tab" role="tab" data-tab="labor" aria-selected="false">🧪 Laborwerte</button>
    </div>
    <div id="listControls">
      <div class="search"><input id="q" type="search" placeholder="Suche: Name, Symptom, Laborwert … z. B. „Brustschmerz“" autocomplete="off"></div>
      <div class="filters">
        <select class="cat" id="catSel" aria-label="Organsystem"></select>
        <button class="chip red" id="fNot" aria-pressed="false">🚨 Notfall</button>
        <button class="chip violet" id="fBv" aria-pressed="false">⛔ Behandlungsverbot</button>
        <button class="chip" id="fFav" aria-pressed="false">★ Gemerkt</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<section class="detail" id="detail" aria-modal="true" role="dialog">
  <div class="dhead"><div class="wrap">
    <button class="iconbtn" id="back" aria-label="Zurück">←</button>
    <h2 id="dTitle"></h2>
    <button class="fav" id="dFav" aria-label="Merken">☆</button>
  </div></div>
  <div class="wrap dbody" id="dBody"></div>
</section>

{n:"Koronare Herzkrankheit (KHK) / Angina pectoris",a:"Stenokardie, Brustenge",k:"herz",
d:"Manifestation der Arteriosklerose an den Herzkranzgefäßen mit Missverhältnis zwischen Sauerstoffangebot und -bedarf des Herzmuskels (Myokardischämie).",
u:"Arteriosklerose der Koronarien • Risikofaktoren: Rauchen, Hypertonie, Diabetes, Hypercholesterinämie, Adipositas, Bewegungsmangel, familiäre Belastung, männliches Geschlecht, Alter • Auslöser des Anfalls: Belastung, Kälte, Stress, schwere Mahlzeiten",
s:"Retrosternaler Druck-/Engegefühl, Brennen • Ausstrahlung in linken Arm, Hals, Unterkiefer, Rücken, Oberbauch • Dauer meist < 20 Min. • Besserung in Ruhe oder nach Nitro innerhalb von Minuten • Atemnot, Angst • Stabile AP: belastungsabhängig, gleichbleibend • Instabile AP: neu, zunehmend, in Ruhe → Notfall (akutes Koronarsyndrom)",
l:"Belastungsabhängiger retrosternaler Schmerz, der in Ruhe/nach Nitro nachlässt",
ko:"Herzinfarkt • Herzrhythmusstörungen • Herzinsuffizienz • plötzlicher Herztod",
dd:"Herzinfarkt • Lungenembolie • Aortendissektion • Perikarditis • Refluxösophagitis • Ösophagusspasmus • BWS-Syndrom/Interkostalneuralgie • Gallenkolik • Panikattacke • Pneumothorax",
b:"Ruhe-EKG oft unauffällig, Belastungs-EKG: ST-Senkung • Troponin bei stabiler AP normal (↑ → Infarkt) • Lipide, BZ/HbA1c • Echokardiografie, Koronarangiografie",
nf:1,nfm:"Instabile Angina pectoris (Ruheschmerz, Crescendo, erstmalig) = akutes Koronarsyndrom → 112, Oberkörper hoch, beengende Kleidung öffnen, nicht belasten, beruhigen."},

{n:"Herzinfarkt",a:"Myokardinfarkt, akutes Koronarsyndrom, STEMI, NSTEMI",k:"herz",
d:"Absterben (Nekrose) von Herzmuskelgewebe durch akuten Verschluss eines Herzkranzgefäßes, meist durch Thrombus auf rupturierter arteriosklerotischer Plaque.",
u:"KHK/Arteriosklerose mit Plaqueruptur und Thrombose • Risikofaktoren wie bei KHK • selten Koronarspasmus, Embolie",
s:"Starker, anhaltender (> 20 Min.) retrosternaler Vernichtungsschmerz • Ausstrahlung in linken Arm, Kiefer, Rücken, Oberbauch • keine Besserung durch Ruhe oder Nitro • Todesangst, kalter Schweiß, Blässe • Übelkeit, Erbrechen • Atemnot • Rhythmusstörungen, Blutdruckabfall • Bei Frauen, Älteren und Diabetikern oft atypisch/stumm (nur Oberbauchschmerz, Übelkeit, Schwäche)",
l:"Vernichtungsschmerz hinter dem Brustbein > 20 Min., nitroresistent, mit Todesangst",
ko:"Kammerflimmern/plötzlicher Herztod (häufigste Todesursache in den ersten Stunden) • kardiogener Schock • akute Herzinsuffizienz/Lungenödem • Herzwandruptur, Papillarmuskelabriss • Herzwandaneurysma • Perikarditis (Dressler-Syndrom) • Thromboembolien",
dd:"Instabile Angina pectoris • Lungenembolie • Aortendissektion • Spannungspneumothorax • Perikarditis • akute Pankreatitis • Gallenkolik • Ulkusperforation • Ösophagusruptur",
b:"Troponin T/I ↑ (ab ca. 3 Std.) • CK, CK-MB ↑ (4–6 Std.) • GOT, LDH ↑ (später) • Leukozytose, BSG/CRP ↑ • EKG: ST-Hebung (STEMI), T-Negativierung, pathologisches Q",
nf:2,nfm:"Sofort 112 (Verdacht reicht!) • Oberkörper hochlagern, Patient nicht laufen lassen • beengende Kleidung öffnen, beruhigen, Fenster öffnen • Vitalzeichen überwachen, nicht allein lassen • keine i.m.-Spritzen (Lyse!) • bei Kreislaufstillstand sofort Reanimation 30:2, AED"},

{n:"Herzinsuffizienz",a:"Herzschwäche, Linksherz-/Rechtsherzinsuffizienz",k:"herz",
d:"Unfähigkeit des Herzens, den Körper ausreichend mit Blut (Sauerstoff) zu versorgen bzw. den venösen Rückstrom aufzunehmen. Einteilung nach NYHA I–IV.",
u:"KHK/Herzinfarkt • arterielle Hypertonie • Herzklappenfehler • Kardiomyopathien, Myokarditis • Herzrhythmusstörungen • Rechtsherz: meist Folge der Linksherzinsuffizienz, Cor pulmonale (COPD, Lungenembolie, pulmonale Hypertonie) • Pathophysiologie: Rückstau vor dem geschwächten Ventrikel, Vorwärtsversagen, Aktivierung von RAAS und Sympathikus",
s:"Linksherz (Rückstau in die Lunge): Belastungs-/Ruhedyspnoe, Orthopnoe (nachts mit erhöhtem Oberkörper), nächtlicher Husten, Asthma cardiale, feuchte Rasselgeräusche, Zyanose • Rechtsherz (Rückstau in den Körperkreislauf): Beinödeme (abends, symmetrisch, eindrückbar), gestaute Halsvenen, Leberstauung (Druckschmerz rechter Oberbauch), Aszites, Stauungsgastritis, Gewichtszunahme • Allgemein: Leistungsminderung, Müdigkeit, Nykturie, Tachykardie",
l:"Belastungsdyspnoe, Orthopnoe, Beinödeme, Nykturie",
ko:"Akutes Lungenödem • kardiogener Schock • Rhythmusstörungen, plötzlicher Herztod • Thromboembolien • Niereninsuffizienz (kardiorenales Syndrom) • Pleuraergüsse • Stauungsleber/Cirrhose cardiaque",
dd:"COPD/Asthma • Lungenembolie • Pneumonie • Ödeme anderer Ursache: Niereninsuffizienz, nephrotisches Syndrom, Leberzirrhose, Hypothyreose (Myxödem), Venenschwäche, Lymphödem, Medikamente (Kalziumantagonisten) • Anämie",
b:"NT-proBNP/BNP ↑ • Kreatinin, Harnstoff, Na/K (Diuretika!) • Blutbild (Anämie?) • TSH • Echokardiografie (Ejektionsfraktion), EKG, Röntgen-Thorax",
nf:1,nfm:"Akute Dekompensation mit Ruhedyspnoe/Lungenödem → 112, Oberkörper hoch, Beine tief (Herzbett), beruhigen."},

{n:"Akutes Lungenödem",a:"Asthma cardiale",k:"herz",
d:"Akute Flüssigkeitsansammlung im Lungengewebe/in den Alveolen, meist durch Linksherzversagen mit Rückstau in den Lungenkreislauf.",
u:"Kardial (häufig): akute Linksherzinsuffizienz (Herzinfarkt, hypertensive Krise, Rhythmusstörung, Mitralklappenfehler) • Nicht kardial: Überwässerung (Niereninsuffizienz, Infusion), toxisch (Reizgase), Höhenlungenödem, ARDS, Hypoalbuminämie",
s:"Schwerste Atemnot, Orthopnoe (Patient sitzt aufrecht) • Brodelndes Atemgeräusch („Kochen auf der Brust“), auf Distanz hörbar • schaumig-rötlicher Auswurf • Zyanose, Kaltschweißigkeit • Tachykardie, Todesangst, Unruhe • Husten",
l:"Schwerste Atemnot mit brodelndem Atemgeräusch und schaumigem Sputum",
ko:"Respiratorische Insuffizienz • Hypoxie, Kreislaufversagen • Tod",
dd:"Status asthmaticus (trockenes Giemen statt Rasseln) • Lungenembolie • Pneumonie • Anaphylaxie • Pneumothorax • Aspiration",
b:"BNP ↑ • Blutgase: pO2 ↓ • Troponin (Infarkt?) • Röntgen: Schmetterlingsödem, Kerley-B-Linien",
nf:2,nfm:"112 • Oberkörper hoch, Beine tief (Herzbett) • beengende Kleidung öffnen, Fenster öffnen, beruhigen • ggf. unblutiger Aderlass (Stauschlauch an 3 Extremitäten, alle 10–15 Min. rotieren) • Vitalzeichen überwachen"},

{n:"Arterielle Hypertonie",a:"Bluthochdruck",k:"herz",
d:"Dauerhaft erhöhter Blutdruck ≥ 140/90 mmHg (Praxismessung, mehrfach). Häufigste Herz-Kreislauf-Erkrankung, lange symptomlos („stiller Killer“).",
u:"Primär/essenziell (~90 %): genetisch, Übergewicht, Salz, Alkohol, Bewegungsmangel, Stress, Alter • Sekundär (~10 %): renal (Nierenarterienstenose, Glomerulonephritis), endokrin (Conn, Cushing, Phäochromozytom, Hyperthyreose), Aortenisthmusstenose, Schlafapnoe, Medikamente (Pille, NSAR, Kortison), Schwangerschaft",
s:"Oft symptomlos • Morgendlicher Hinterkopfschmerz • Schwindel, Ohrensausen, Nasenbluten • Herzklopfen, Belastungsdyspnoe • Gesichtsröte, Unruhe, Schlafstörungen • Sehstörungen",
l:"Meist symptomlos – Diagnose durch Messung (≥ 140/90 mmHg)",
ko:"Hypertensiver Notfall • Arteriosklerose → KHK, Herzinfarkt, pAVK • Linksherzhypertrophie, Herzinsuffizienz • Schlaganfall, Hirnblutung • hypertensive Nephropathie → Niereninsuffizienz • Retinopathie • Aortenaneurysma/-dissektion",
dd:"Weißkittelhypertonie • sekundäre Hypertonieformen (s. Ursachen) abklären • Messfehler (Manschette zu klein)",
b:"Kreatinin/GFR, Kalium (↓ bei Conn) • Urinstatus/Albumin • BZ, Lipide • TSH • ggf. Aldosteron-Renin-Quotient, Metanephrine, Kortisol • 24-Std.-Blutdruckmessung, EKG, Echo, Augenhintergrund",
nf:1,nfm:"Blutdruck > 180/120 mmHg MIT Organsymptomen (Brustschmerz, Atemnot, Lähmung, Sehstörung, Verwirrtheit) = hypertensiver Notfall → 112."},

{n:"Hypertensiver Notfall / hypertensive Krise",a:"Hochdruckkrise, hypertensive Entgleisung",k:"herz",
d:"Kritischer Blutdruckanstieg (meist > 180/120 mmHg). Hypertensive Dringlichkeit: ohne Organschäden. Hypertensiver Notfall: mit akuten Organschäden – lebensbedrohlich.",
u:"Unzureichend behandelte Hypertonie, abgesetzte Medikamente • Phäochromozytom • Präeklampsie • Nierenerkrankungen • Drogen (Kokain, Amphetamine) • Schmerzen, Stress, Alkoholentzug",
s:"Starker Kopfschmerz, Schwindel • Sehstörungen, Ohrensausen • Übelkeit, Erbrechen • Nasenbluten • Brustschmerz, Atemnot (Lungenödem) • neurologische Ausfälle, Verwirrtheit, Krämpfe (hypertensive Enzephalopathie)",
l:"RR > 180/120 mmHg mit Kopfschmerz, Seh- oder neurologischen Störungen",
ko:"Schlaganfall, Hirnblutung • Lungenödem • Herzinfarkt • Aortendissektion • akutes Nierenversagen • Eklampsie",
dd:"Schlaganfall mit reaktiver RR-Erhöhung • Subarachnoidalblutung • Angst-/Schmerzreaktion • Migräne",
b:"Kreatinin, Elektrolyte • Troponin • Urin (Eiweiß, Blut) • Blutbild",
nf:2,nfm:"112 • Oberkörper hoch lagern, beruhigen • Blutdruck regelmäßig kontrollieren • NICHT zu schnell senken (max. 25 % in der 1. Stunde) – das macht der Notarzt"},

{n:"Arterielle Hypotonie",a:"niedriger Blutdruck, orthostatische Dysregulation",k:"herz",
d:"Blutdruck dauerhaft < 100/60 mmHg mit Beschwerden. Orthostatische Hypotonie: Blutdruckabfall beim Aufstehen (≥ 20 mmHg systolisch in 3 Min.).",
u:"Primär/konstitutionell: junge, schlanke Frauen • Sekundär: Herzinsuffizienz, Herzrhythmusstörungen, Aortenstenose, Hypovolämie (Blutung, Durchfall, Exsikkose), Addison, Hypothyreose, Medikamente (Antihypertensiva, Diuretika, Psychopharmaka), Varikose, Polyneuropathie (Diabetes), Parkinson • Langes Liegen",
s:"Schwindel, Schwarzwerden vor Augen beim Aufstehen • Müdigkeit, Konzentrationsschwäche • kalte Hände/Füße • Kopfschmerzen • Ohrensausen • Synkope (Ohnmacht)",
l:"Schwindel/Schwarzsehen beim Aufstehen",
ko:"Synkope mit Sturz und Verletzung • Minderdurchblutung von Herz/Gehirn bei älteren Menschen",
dd:"Herzrhythmusstörungen • Aortenstenose • Hypoglykämie • Anämie • Epilepsie • vasovagale Synkope • Schock",
b:"Blutbild (Anämie) • Elektrolyte, Kreatinin • BZ • TSH, Kortisol (Addison) • Schellong-Test, Langzeit-EKG",
nf:0},

{n:"Vorhofflimmern",a:"Absolute Arrhythmie, AF",k:"herz",
d:"Häufigste anhaltende Herzrhythmusstörung: unkoordinierte, schnelle Vorhoferregung (350–600/min), unregelmäßige Überleitung auf die Kammern → absolute Arrhythmie.",
u:"Hypertonie • KHK, Herzinsuffizienz • Herzklappenfehler (v. a. Mitralklappe) • Hyperthyreose • Alkohol („Holiday heart“) • Alter • Schlafapnoe, Adipositas • Elektrolytstörungen • Lungenembolie",
s:"Unregelmäßiger, oft schneller Puls • Herzstolpern, Herzrasen • Pulsdefizit (Herzfrequenz > tastbarer Puls) • Leistungsminderung, Atemnot • Schwindel, Angst • Polyurie • häufig auch symptomlos",
l:"Völlig unregelmäßiger Puls mit Pulsdefizit",
ko:"Thrombenbildung im linken Vorhofohr → Embolie: Schlaganfall (!), Mesenterialinfarkt, akuter Extremitätenverschluss • Herzinsuffizienz (Tachymyopathie)",
dd:"Vorhofflattern • Extrasystolen • Sinustachykardie • andere Tachykardien",
b:"TSH (Hyperthyreose!) • Elektrolyte (K, Mg) • Kreatinin • BNP • EKG: fehlende P-Wellen, unregelmäßige RR-Abstände • Echo",
nf:1,nfm:"Bei Brustschmerz, Atemnot, Bewusstseinsstörung oder Schlaganfallzeichen → 112."},

{n:"Kammerflimmern / Herz-Kreislauf-Stillstand",a:"Plötzlicher Herztod, Asystolie, Kammerflattern",k:"herz",
d:"Ungeordnete, hochfrequente Erregung der Herzkammern ohne effektiven Auswurf → funktioneller Kreislaufstillstand. Ohne Reanimation tritt nach 3–5 Min. ein irreversibler Hirnschaden ein.",
u:"Herzinfarkt/KHK (häufigste Ursache) • Kardiomyopathie, Myokarditis • Elektrolytstörungen (Kalium) • Stromunfall • Medikamente/Drogen • Long-QT-Syndrom • Ertrinken, Unterkühlung • Lungenembolie, Spannungspneumothorax",
s:"Plötzliche Bewusstlosigkeit • keine normale Atmung (Schnappatmung!) • kein tastbarer Puls (Karotis) • Zyanose/grau-blasse Haut • weite, lichtstarre Pupillen (nach ca. 1 Min.) • ggf. Krampfanfall",
l:"Bewusstlos + keine normale Atmung",
ko:"Hypoxischer Hirnschaden • Tod",
dd:"Synkope • Krampfanfall • Hypoglykämie • Schlaganfall • Vergiftung",
b:"Keine Zeit für Labor – EKG/AED-Analyse",
nf:2,nfm:"Laut um Hilfe rufen → 112 → sofort Herzdruckmassage (Mitte Brustkorb, 5–6 cm tief, 100–120/min) • 30 Kompressionen : 2 Beatmungen • AED holen lassen und Anweisungen folgen • ohne Unterbrechung bis Rettungsdienst übernimmt"},

{n:"Infektiöse Endokarditis",a:"Bakterielle Herzinnenhautentzündung, Endocarditis lenta",k:"herz",
d:"Bakterielle (selten mykotische) Entzündung der Herzinnenhaut, v. a. der Herzklappen, mit Bildung von Vegetationen.",
u:"Streptokokken (Strep. viridans, „Endocarditis lenta“ – schleichend), Staphylococcus aureus (akut, i.v.-Drogenabhängige), Enterokokken • Eintrittspforten: Zahnbehandlung, Eingriffe, i.v.-Drogen, Katheter • Risiko: Herzklappenfehler, künstliche Klappen, frühere Endokarditis, angeborene Herzfehler",
s:"Fieber, Schüttelfrost, Nachtschweiß • Müdigkeit, Gewichtsverlust • neues/verändertes Herzgeräusch • Petechien, Splitterblutungen unter den Nägeln • Osler-Knötchen (schmerzhaft, Finger/Zehen), Janeway-Läsionen (schmerzlos, Handflächen) • Roth-Flecken (Netzhaut) • Splenomegalie • Trommelschlegelfinger (chronisch)",
l:"Fieber unklarer Ursache + neues Herzgeräusch",
ko:"Klappenzerstörung → akute Herzinsuffizienz • septische Embolien: Schlaganfall, Milz-/Niereninfarkt, Hirnabszess • Glomerulonephritis • Sepsis • Tod",
dd:"Rheumatisches Fieber • Lupus erythematodes (Libman-Sacks) • Sepsis anderer Ursache • Tumorfieber, Lymphom • Tuberkulose",
b:"Blutkulturen (mehrfach!) • BSG/CRP stark ↑, Leukozytose • Anämie • Hämaturie/Proteinurie • Echokardiografie (TEE): Vegetationen",
nf:1,nfm:"Akute Form mit Sepsiszeichen, Herzinsuffizienz oder Embolie → 112. Grundsätzlich sofort zum Arzt (Antibiotika i.v.)."},

{n:"Myokarditis",a:"Herzmuskelentzündung",k:"herz",
d:"Entzündung des Herzmuskels, meist viral, oft nach Atemwegs- oder Magen-Darm-Infekt.",
u:"Viren (Coxsackie B, Adeno-, Parvo B19, Influenza, SARS-CoV-2, HHV-6) • Bakterien (Diphtherie, Borrelien, Streptokokken) • Autoimmun (Lupus, Sarkoidose) • toxisch (Alkohol, Medikamente), selten nach Impfung • Risikofaktor: Sport während eines Infekts",
s:"Oft symptomarm • Müdigkeit, Leistungsknick • Herzstolpern, Tachykardie • Atemnot • Brustschmerz (bei Perimyokarditis) • Zeichen der Herzinsuffizienz",
l:"Leistungsknick und Herzrhythmusstörungen nach einem Infekt",
ko:"Rhythmusstörungen, plötzlicher Herztod (v. a. bei Sport!) • dilatative Kardiomyopathie • Herzinsuffizienz",
dd:"Herzinfarkt • Perikarditis • Kardiomyopathie • Hyperthyreose • Post-/Long-Covid",
b:"Troponin, CK ↑ • BSG/CRP ↑ • BNP ↑ • Virusserologie • EKG-Veränderungen • Echo, Kardio-MRT",
nf:1,nfm:"Bei Brustschmerz, Atemnot, Synkope → 112. Strikte körperliche Schonung, kein Sport."},

{n:"Perikarditis",a:"Herzbeutelentzündung, Perikarderguss",k:"herz",
d:"Entzündung des Herzbeutels (Perikard): trocken (fibrinös) oder feucht (mit Erguss).",
u:"Idiopathisch/viral (häufig: Coxsackie, Echo) • bakteriell, Tuberkulose • nach Herzinfarkt (Dressler) oder Herz-OP • Urämie (Niereninsuffizienz) • Autoimmun (Lupus, RA, rheumatisches Fieber) • Tumor/Bestrahlung • Hypothyreose",
s:"Trockene P.: stechender Brustschmerz, atem- und lageabhängig (besser im Sitzen mit Vorbeugen, schlimmer im Liegen/beim Einatmen), Perikardreiben • Feuchte P.: Schmerz nimmt ab, leise Herztöne, Atemnot, Halsvenenstauung • Fieber",
l:"Atem- und lageabhängiger Brustschmerz, besser beim Vorbeugen",
ko:"Perikardtamponade (Notfall: RR ↓, Halsvenenstauung, leise Herztöne = Beck-Trias, Pulsus paradoxus) • Pericarditis constrictiva („Panzerherz“)",
dd:"Herzinfarkt • Lungenembolie • Pleuritis • Pneumothorax • Aortendissektion",
b:"BSG/CRP ↑, Leukozytose • Troponin (Perimyokarditis) • Kreatinin (Urämie) • EKG: ST-Hebung in vielen Ableitungen • Echo (Erguss)",
nf:1,nfm:"Zeichen einer Perikardtamponade (Atemnot, RR-Abfall, gestaute Halsvenen) → 112, Oberkörper hoch."},

{n:"Aortenklappenstenose",a:"Aortenstenose",k:"herz",
d:"Verengung der Aortenklappe mit Druckbelastung des linken Ventrikels. Häufigster Herzklappenfehler im Alter.",
u:"Degenerativ-kalzifizierend (Alter > 65) • angeborene bikuspide Klappe • rheumatisches Fieber",
s:"Lange symptomlos • Trias: Belastungsdyspnoe, Angina pectoris, Synkopen (Schwindel bei Belastung) • rasche Ermüdbarkeit • lautes systolisches Austreibungsgeräusch (2. ICR rechts) mit Fortleitung in die Karotiden • Pulsus parvus et tardus",
l:"Belastungsabhängige Synkope, Angina pectoris und Dyspnoe bei älteren Menschen",
ko:"Linksherzinsuffizienz, Lungenödem • plötzlicher Herztod • Rhythmusstörungen • Endokarditis",
dd:"KHK • hypertrophe Kardiomyopathie • Mitralinsuffizienz • andere Synkopenursachen",
b:"BNP ↑ • Echokardiografie (Klappenöffnungsfläche, Gradient)",
nf:1,nfm:"Synkope, Ruheangina oder Lungenödem → 112."},

{n:"Mitralklappeninsuffizienz / Mitralstenose",a:"Mitralklappenfehler",k:"herz",
d:"Schlussunfähigkeit (Insuffizienz) oder Verengung (Stenose) der Mitralklappe mit Rückstau in Vorhof und Lunge.",
u:"Insuffizienz: degenerativ, Mitralklappenprolaps, Herzinfarkt (Papillarmuskel), Endokarditis, dilatierter linker Ventrikel • Stenose: fast immer Folge des rheumatischen Fiebers",
s:"Belastungsdyspnoe, nächtlicher Husten • Herzstolpern (Vorhofflimmern) • Leistungsminderung • Stenose: Facies mitralis (gerötete Wangen, livide Lippen), Hämoptysen • Insuffizienz: holosystolisches Geräusch an der Herzspitze",
l:"Belastungsdyspnoe + Vorhofflimmern",
ko:"Vorhofflimmern mit Thromboembolien (Schlaganfall) • Lungenödem • pulmonale Hypertonie, Rechtsherzinsuffizienz • Endokarditis",
dd:"Andere Herzklappenfehler • Herzinsuffizienz anderer Ursache • COPD",
b:"BNP ↑ • EKG (P mitrale, Vorhofflimmern) • Echokardiografie",
nf:1,nfm:"Akutes Lungenödem oder Schlaganfallzeichen → 112."},

{n:"Rheumatisches Fieber",a:"Streptokokkenrheumatismus",k:"herz",
d:"Autoimmune Zweiterkrankung ca. 1–3 Wochen nach einer Infektion mit β-hämolysierenden Streptokokken der Gruppe A (Angina, Scharlach) durch Kreuzreaktion der Antikörper.",
u:"Streptokokken-A-Infekt (Tonsillitis, Scharlach) • Antikörper reagieren mit körpereigenem Gewebe (Herz, Gelenke, Haut, ZNS) • Kinder 5–15 Jahre",
s:"Jones-Kriterien – Hauptkriterien: Karditis (Endo-, Myo-, Perikarditis), springende Polyarthritis der großen Gelenke, Chorea minor (Sydenham), Erythema anulare (marginatum), subkutane Rheumaknötchen • Nebenkriterien: Fieber, Arthralgien, BSG/CRP ↑, verlängerte PQ-Zeit",
l:"Wandernde Gelenkentzündung großer Gelenke 2–3 Wochen nach Angina",
ko:"Rheumatische Herzklappenfehler (v. a. Mitralstenose) • Herzinsuffizienz • Rezidive",
dd:"Reaktive Arthritis • juvenile idiopathische Arthritis • Lupus • Borreliose • Endokarditis",
b:"Antistreptolysin-O-Titer (ASL) ↑, Anti-DNase B ↑ • BSG/CRP ↑, Leukozytose • Rachenabstrich (Arzt)",
nf:0,bv:"Die auslösende Streptococcus-pyogenes-Infektion (Scharlach/Angina) fällt unter § 34 IfSG → § 24 IfSG Behandlungsverbot für den akuten Infekt."},

{n:"Kardiomyopathie",a:"Herzmuskelerkrankung (dilatativ, hypertroph, restriktiv)",k:"herz",
d:"Erkrankung des Herzmuskels mit mechanischer und/oder elektrischer Funktionsstörung. Formen: dilatativ (DCM, Erweiterung), hypertroph (HCM, Verdickung), restriktiv.",
u:"DCM: genetisch, nach Myokarditis, Alkohol, Chemotherapie, Schwangerschaft (peripartal) • HCM: meist genetisch (autosomal-dominant) • restriktiv: Amyloidose, Sarkoidose, Hämochromatose",
s:"Zeichen der Herzinsuffizienz (Dyspnoe, Ödeme, Müdigkeit) • Rhythmusstörungen, Palpitationen • Angina pectoris • Synkopen (v. a. HCM bei Belastung)",
l:"Herzinsuffizienz ohne KHK; Belastungssynkope beim jungen Sportler (HCM)",
ko:"Plötzlicher Herztod (HCM häufigste Ursache bei jungen Sportlern) • Herzinsuffizienz • Thromboembolien",
dd:"KHK • Herzklappenfehler • hypertensive Herzkrankheit • Myokarditis",
b:"BNP ↑ • Troponin • Ferritin/Transferrinsättigung (Hämochromatose) • Echo, Kardio-MRT, genetische Diagnostik",
nf:1,nfm:"Synkope, Brustschmerz, Atemnot → 112."},

{n:"Schock",a:"Kreislaufschock (hypovolämisch, kardiogen, septisch, anaphylaktisch, neurogen)",k:"herz",

l:"Fieber, Husten mit Auswurf, Atemnot, atemabhängiger Thoraxschmerz",
ko:"Sepsis • respiratorische Insuffizienz • Pleuraerguss, Pleuraempyem • Lungenabszess • Herz-Kreislauf-Versagen • Meningitis",
dd:"Bronchitis • Lungenembolie mit Infarktpneumonie • Lungenödem • Tuberkulose • Bronchialkarzinom (Retentionspneumonie) • Lungeninfarkt",
b:"Leukozytose mit Linksverschiebung (bakteriell), CRP/BSG ↑, PCT ↑ • Blutgase • Blutkultur, Sputum • Legionellen-/Pneumokokken-Antigen im Urin • Röntgen-Thorax • CRB-65-Score (Confusion, Atemfrequenz ≥ 30, RR < 90/60, Alter ≥ 65)",

ko:"Spannungspneumothorax (lebensbedrohlich) • Rezidiv • Hämatopneumothorax • Mediastinalemphysem",

nf:2,nfm:"112 • Oberkörper hoch, auf die verletzte Seite lagern (gesunde Seite kann besser atmen) • beruhigen, Vitalzeichen • bei offener Thoraxverletzung: steriles Tuch locker auflegen (nicht luftdicht verkleben)"},

{n:"Bronchialkarzinom",a:"Lungenkrebs, Lungenkarzinom (kleinzellig/nicht-kleinzellig)",k:"lunge",

l:"Hartnäckiger oder veränderter Raucherhusten, Hämoptysen, Gewichtsverlust",
ko:"Metastasen: Gehirn, Knochen, Leber, Nebennieren • Pleuraerguss (maligne) • Lungenblutung • Einflussstauung",

b:"BSG ↑, Anämie • Hyponatriämie (SIADH), Hyperkalzämie • Tumormarker (NSE, CYFRA 21-1, CEA) zur Verlaufskontrolle • Röntgen/CT, Bronchoskopie mit Biopsie",
nf:1,nfm:"Massive Hämoptyse oder akute Einflussstauung → 112."},

{n:"Pleuritis / Pleuraerguss",a:"Rippenfellentzündung, Brustfellentzündung",k:"lunge",

{n:"Hepatitis B",a:"Virushepatitis B, Serumhepatitis",k:"leber",

{n:"Akute Cholezystitis",a:"Gallenblasenentzündung",k:"leber",

{n:"Pankreaskarzinom",a:"Bauchspeicheldrüsenkrebs",k:"leber",

function norm(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"");}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
// Text mit " • " als Aufzählung darstellen
function fmt(s){
  if(!s) return "<p>–</p>";
  var parts=String(s).split(" • ");
  if(parts.length>1) return "<ul>"+parts.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>";
  return "<p>"+esc(s)+"</p>";
}
D.forEach(function(d){
  d.id=slug(d.n);
  d._s=norm([d.n,d.a,d.d,d.u,d.s,d.l,d.ko,d.dd,d.b,d.nfm,d.bv,(CATS[d.k]||"")].join(" "));
  d._n=norm(d.n+" "+(d.a||""));
});
D.sort(function(a,b){return a.n.localeCompare(b.n,"de");});
var byId={}; D.forEach(function(d){byId[d.id]=d;});

// ---------- Badges ----------
function badges(d,withCat){
  var h="";
  if(withCat) h+='<span class="badge b-cat">'+esc(CATS[d.k]||d.k)+'</span>';
  if(d.nf===2) h+='<span class="badge b-red">🚨 NOTFALL</span>';
  else if(d.nf===1) h+='<span class="badge b-amber">⚠️ kann Notfall werden</span>';
  if(d.bv) h+='<span class="badge b-violet">⛔ Behandlungsverbot</span>';
  return h;
}
function card(d){
  return '<button class="card" data-id="'+d.id+'"><h3>'+(favs[d.id]?"★ ":"")+esc(d.n)+'</h3>'+
    (d.a?'<div class="meta">'+esc(d.a)+'</div>':'')+
    '<div class="badges">'+badges(d,true)+'</div>'+
    (d.l?'<p class="ls">'+esc(d.l)+'</p>':'')+'</button>';
}
function bindCards(root){
  root.querySelectorAll(".card,[data-open]").forEach(function(el){
    el.addEventListener("click",function(){openD(el.dataset.id||el.dataset.open);});
  });
}

// ---------- Liste ----------
function filtered(){
  var terms=norm(state.q).split(/\s+/).filter(Boolean);
  var res=D.filter(function(d){
    if(state.cat && d.k!==state.cat) return false;
    if(state.not && !d.nf) return false;
    if(state.bv && !d.bv) return false;
    if(state.fav && !favs[d.id]) return false;
    for(var i=0;i<terms.length;i++) if(d._s.indexOf(terms[i])<0) return false;
    return true;
  });
  if(terms.length){
    res.sort(function(a,b){
      var sa=terms.every(function(t){return a._n.indexOf(t)>=0;})?0:1;
      var sb=terms.every(function(t){return b._n.indexOf(t)>=0;})?0:1;
      return sa-sb || a.n.localeCompare(b.n,"de");
    });
  }
  return res;
}
function renderList(){
  var r=filtered();
  var h='<p class="count">'+r.length+' von '+D.length+' Erkrankungen'+(state.q?' für „'+esc(state.q)+'“':'')+'</p>';
  if(!r.length) h+='<div class="empty">Nichts gefunden. Anderen Suchbegriff oder weniger Filter versuchen.</div>';
  else h+='<div class="list">'+r.map(card).join("")+'</div>';
  h+=disclaimer();
  $("main").innerHTML=h; bindCards($("main"));
}

// ---------- Detail ----------
var SECS=[
  ["d","1","Kurze Definition / Erklärung"],
  ["k","2","Kategorie / Organsystem"],
  ["u","3","Ursachen / Pathophysiologie"],
  ["s","4","Symptome / Leitsymptome"],
  ["ko","5","Komplikationen"],
  ["dd","6","Differentialdiagnosen"],

];
function openD(id,noPush){
  var d=byId[id]; if(!d) return;
  $("dTitle").textContent=d.n;
  $("dFav").textContent=favs[d.id]?"★":"☆";
  $("dFav").onclick=function(){ if(favs[d.id]) delete favs[d.id]; else favs[d.id]=1; saveFavs(); $("dFav").textContent=favs[d.id]?"★":"☆"; };
  var h="";
  if(d.a) h+='<p class="alias">Auch: '+esc(d.a)+'</p>';
  h+='<div class="badges" style="margin-bottom:6px">'+badges(d,false)+'</div>';
  if(d.nf) h+='<div class="alert '+(d.nf===2?"red":"amber")+'"><h4>'+(d.nf===2?"🚨 NOTFALL – sofort 112 / Notarzt":"⚠️ Kann zum Notfall werden")+'</h4>'+fmt(d.nfm||"Bei Verschlechterung sofort Notruf 112.")+'</div>';
  if(d.bv) h+='<div class="alert violet"><h4>⛔ Behandlungsverbot für Heilpraktiker</h4>'+fmt(d.bv)+'</div>';
  SECS.forEach(function(s){
    var v=s[0]==="k"?(CATS[d.k]||d.k):d[s[0]];
    h+='<div class="sec"><h4><span class="num">'+s[1]+'.</span> '+s[2]+'</h4>'+fmt(v)+
      (s[0]==="s"&&d.l?'<div class="ls-box">Leitsymptom(e): '+esc(d.l)+'</div>':'')+'</div>';
  });
  h+=disclaimer();
  $("dBody").innerHTML=h;
  $("detail").classList.add("open"); $("detail").scrollTop=0;
  document.body.style.overflow="hidden";
  if(!noPush){ try{history.pushState({d:id},"","#"+id);}catch(e){} }
}
function closeD(){ $("detail").classList.remove("open"); document.body.style.overflow=""; if(state.tab==="liste") renderList(); }
$("back").onclick=function(){ if(history.state&&history.state.d) history.back(); else closeD(); };
window.addEventListener("popstate",function(e){ if(e.state&&e.state.d) openD(e.state.d,true); else closeD(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && $("detail").classList.contains("open")) $("back").click(); });

function disclaimer(){
  return '<p class="disc">Lern- und Nachschlagehilfe zur Vorbereitung auf die Heilpraktikerprüfung – ersetzt kein Lehrbuch, keine ärztliche Diagnose und nicht den aktuellen Gesetzestext. Laborwerte sind Richtwerte (laborabhängig). Rechtsstand: IfSG, HeilprG, AMG, BtMG, ZHG, HebG – bei Zweifel den aktuellen Gesetzestext prüfen.</p>';
}

// ---------- Lernkarten ----------
var lern={cat:"",only:"",cur:null,shown:{}};
function pickCard(){
  var pool=D.filter(function(d){
    if(lern.cat&&d.k!==lern.cat) return false;
    if(lern.only==="nf"&&!d.nf) return false;
    if(lern.only==="bv"&&!d.bv) return false;
    if(lern.only==="fav"&&!favs[d.id]) return false;
    return true;
  });
  if(!pool.length){lern.cur=null;return;}
  var c; do{c=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&lern.cur&&c.id===lern.cur.id);
  lern.cur=c; lern.shown={};
}
function renderLern(){
  if(!lern.cur) pickCard();
  var catOpts='<option value="">Alle Organsysteme</option>'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(lern.cat===k?" selected":"")+'>'+esc(CATS[k])+'</option>';}).join("");
  var h='<div class="filters"><select class="cat" id="lCat">'+catOpts+'</select>'+
    '<select class="cat" id="lOnly"><option value="">Alle Karten</option><option value="nf"'+(lern.only==="nf"?" selected":"")+'>Nur Notfälle</option><option value="bv"'+(lern.only==="bv"?" selected":"")+'>Nur Behandlungsverbote</option><option value="fav"'+(lern.only==="fav"?" selected":"")+'>Nur Gemerkte</option></select></div>';
  var c=lern.cur;
  if(!c){h+='<div class="empty">Keine Karten für diese Auswahl.</div>';}
  else{
    h+='<div class="flash"><div class="meta" style="color:var(--muted);font-size:.85rem">'+esc(CATS[c.k])+'</div><h3>'+esc(c.n)+'</h3>'+
      '<p style="color:var(--muted);margin:4px 0 0">Was weißt du dazu? Tippe auf einen Punkt zum Aufdecken.</p><div class="revbtns">';
    var items=[["d","Definition"],["u","Ursachen"],["s","Symptome"],["l","Leitsymptom"],["ko","Komplikationen"],["dd","DD"],["b","Labor"],["nf","Notfall?"],["bv","Behandlungsverbot?"]];
    items.forEach(function(it){ h+='<button class="btn ghost" data-rev="'+it[0]+'"'+(lern.shown[it[0]]?' style="opacity:.55"':'')+'>'+it[1]+'</button>'; });
    h+='<button class="btn ghost" data-rev="all">Alles</button></div>';
    items.forEach(function(it){
      if(!lern.shown[it[0]]) return;
      var v;
      if(it[0]==="nf") v=c.nf===2?"JA – immer Notfall. "+(c.nfm||""):c.nf===1?"Kann zum Notfall werden. "+(c.nfm||""):"Kein typischer Notfall.";
      else if(it[0]==="bv") v=c.bv?"JA – "+c.bv:"Kein Behandlungsverbot nach IfSG (Sorgfaltspflicht beachten).";
      else v=c[it[0]];
      h+='<div class="sec"><h4>'+it[1]+'</h4>'+fmt(v)+'</div>';
    });
    h+='<div class="revbtns"><button class="btn" id="lNext">Nächste Karte →</button><button class="btn ghost" data-open="'+c.id+'">Ganze Seite öffnen</button></div></div>';
  }
  $("main").innerHTML=h;
  $("lCat").onchange=function(e){lern.cat=e.target.value;lern.cur=null;renderLern();};
  $("lOnly").onchange=function(e){lern.only=e.target.value;lern.cur=null;renderLern();};
  if($("lNext")) $("lNext").onclick=function(){pickCard();renderLern();};
  $("main").querySelectorAll("[data-rev]").forEach(function(b){b.onclick=function(){
    var r=b.dataset.rev; if(r==="all"){["d","u","s","l","ko","dd","b","nf","bv"].forEach(function(x){lern.shown[x]=1;});} else lern.shown[r]=1; renderLern();
  };});
  bindCards($("main"));
}

      g.r.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';}).join("")+'</table></div></div>';
  });

}
