<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Krankheiten Nachschlagewerk</title>
<meta name="description" content="Offline-Nachschlagewerk für Heilpraktiker: Definition, Organsystem, Ursachen, Symptome, Komplikationen, Differentialdiagnosen, Laborwerte, Notfälle und Behandlungsverbote.">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#efece5; --text:#1f2328; --muted:#5d6670;
  --line:#ddd8cc; --accent:#2f6f5e; --accent-weak:#e1eee9;
  --red:#b42318; --red-weak:#fde8e6; --amber:#9a5b00; --amber-weak:#fff3d6;
  --violet:#5b3a9e; --violet-weak:#eee8fa; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181b; --surface:#1d2125; --surface2:#262b30; --text:#e8eaed; --muted:#a2aab3;
    --line:#343a41; --accent:#6cc4a8; --accent-weak:#1f3530;
    --red:#ff7a6e; --red-weak:#3a1f1d; --amber:#f0b54a; --amber-weak:#352a14;
    --violet:#b79cf5; --violet-weak:#2b2340; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1d2125; --surface2:#262b30; --text:#e8eaed; --muted:#a2aab3;
  --line:#343a41; --accent:#6cc4a8; --accent-weak:#1f3530;
  --red:#ff7a6e; --red-weak:#3a1f1d; --amber:#f0b54a; --amber-weak:#352a14;
  --violet:#b79cf5; --violet-weak:#2b2340; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.titlebar h1{font-size:1.15rem;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;min-width:40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0d1a16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0d1a16}}
.search{display:flex;gap:8px;padding-bottom:10px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:1rem}
.search input:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
#listControls .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#listControls .filters::-webkit-scrollbar{display:none}
#listControls .filters>*{flex:0 0 auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.red[aria-pressed="true"]{background:var(--red-weak);border-color:var(--red);color:var(--red)}
.chip.violet[aria-pressed="true"]{background:var(--violet-weak);border-color:var(--violet);color:var(--violet)}
select.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.84rem;max-width:100%}
main{padding-top:14px;padding-bottom:60px}
.count{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 2px;font-size:1.02rem}
.card .meta{color:var(--muted);font-size:.82rem}
.card .ls{margin:6px 0 0;font-size:.9rem;color:var(--text);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.01em}
.b-red{background:var(--red-weak);color:var(--red)}
.b-amber{background:var(--amber-weak);color:var(--amber)}
.b-violet{background:var(--violet-weak);color:var(--violet)}
.b-cat{background:var(--surface2);color:var(--muted)}
/* Detail */
.detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.detail.open{display:block}
.dhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);z-index:2}
.dhead .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.dhead h2{margin:0;font-size:1.15rem;flex:1;line-height:1.25}
.dbody{padding-top:14px;padding-bottom:70px}
.alias{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.alert{border-radius:12px;padding:10px 14px;margin:10px 0;border:1.5px solid}
.alert h4{margin:0 0 4px;font-size:.95rem}
.alert p{margin:0;font-size:.93rem}
.alert.red{background:var(--red-weak);border-color:var(--red)}
.alert.red h4{color:var(--red)}
.alert.amber{background:var(--amber-weak);border-color:var(--amber)}
.alert.amber h4{color:var(--amber)}
.alert.violet{background:var(--violet-weak);border-color:var(--violet)}
.alert.violet h4{color:var(--violet)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sec h4{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.sec h4 .num{display:inline-block;min-width:1.4em}
.sec p{margin:0}
.sec ul{margin:0;padding-left:1.15em}
.sec li{margin:2px 0}
.ls-box{background:var(--accent-weak);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.panel h3{margin:0 0 8px;font-size:1.05rem}
.panel p,.panel li{font-size:.95rem}
.panel ul,.panel ol{padding-left:1.2em;margin:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.big112{font-size:1.6rem;font-weight:800;color:var(--red)}
.grp{margin:16px 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.flash h3{margin:0 0 4px;font-size:1.3rem}
.revbtns{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.disc{font-size:.8rem;color:var(--muted);margin-top:20px;line-height:1.45}
mark{background:var(--amber-weak);color:inherit;border-radius:3px;padding:0 1px}
.fav{border:none;background:none;font-size:1.3rem;cursor:pointer;padding:4px;line-height:1}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.titlebar h1{font-size:1rem}.iconbtn{padding:5px 8px;min-width:36px}.titlebar{padding-top:8px}.tabs{padding-bottom:8px}.search{padding-bottom:8px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <h1>🩺 Krankheiten-Nachschlagewerk</h1>
      <button class="iconbtn" id="fsMinus" title="Schrift kleiner" aria-label="Schrift kleiner">A−</button>
      <button class="iconbtn" id="fsPlus" title="Schrift größer" aria-label="Schrift größer">A+</button>
      <button class="iconbtn" id="themeBtn" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten">◐</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="liste" aria-selected="true">📚 Erkrankungen</button>
      <button class="tab" role="tab" data-tab="notfall" aria-selected="false">🚨 Notfälle</button>
      <button class="tab" role="tab" data-tab="verbot" aria-selected="false">⛔ Behandlungsverbote</button>
      <button class="tab" role="tab" data-tab="lern" aria-selected="false">🃏 Lernkarten</button>
      <button class="tab" role="tab" data-tab="labor" aria-selected="false">🧪 Laborwerte</button>
    </div>
    <div id="listControls">
      <div class="search"><input id="q" type="search" placeholder="Suche: Name, Symptom, Laborwert … z. B. „Brustschmerz“" autocomplete="off"></div>
      <div class="filters">
        <select class="cat" id="catSel" aria-label="Organsystem"></select>
        <button class="chip red" id="fNot" aria-pressed="false">🚨 Notfall</button>
        <button class="chip violet" id="fBv" aria-pressed="false">⛔ Behandlungsverbot</button>
        <button class="chip" id="fFav" aria-pressed="false">★ Gemerkt</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<section class="detail" id="detail" aria-modal="true" role="dialog">
  <div class="dhead"><div class="wrap">
    <button class="iconbtn" id="back" aria-label="Zurück">←</button>
    <h2 id="dTitle"></h2>
    <button class="fav" id="dFav" aria-label="Merken">☆</button>
  </div></div>
  <div class="wrap dbody" id="dBody"></div>
</section>

{n:"Herzinsuffizienz",a:"Herzschwäche, Linksherz-/Rechtsherzinsuffizienz",k:"herz",

{n:"Akutes Lungenödem",a:"Asthma cardiale",k:"herz",

{n:"Arterielle Hypertonie",a:"Bluthochdruck",k:"herz",

{n:"Hypertensiver Notfall / hypertensive Krise",a:"Hochdruckkrise, hypertensive Entgleisung",k:"herz",

{n:"Arterielle Hypotonie",a:"niedriger Blutdruck, orthostatische Dysregulation",k:"herz",

{n:"Infektiöse Endokarditis",a:"Bakterielle Herzinnenhautentzündung, Endocarditis lenta",k:"herz",

s:"Kinder meist symptomlos • Prodromalstadium: grippeähnlich, Appetitlosigkeit, Übelkeit, Abneigung gegen Fett/Alkohol/Nikotin, Druck im rechten Oberbauch, Fieber • ikterische Phase: Ikterus (Haut, Skleren), dunkler Urin, heller (acholischer) Stuhl, Juckreiz • Hepatomegalie, ggf. Splenomegalie",
l:"Ikterus mit dunklem Urin und hellem Stuhl nach Reise",
ko:"Selten fulminante Hepatitis (akutes Leberversagen, v. a. Ältere/Vorgeschädigte) • cholestatischer Verlauf • Rückfall • KEINE Chronifizierung",
dd:"Andere Virushepatitiden (B, C, E, EBV, CMV) • toxische/medikamentöse Hepatitis • Alkoholhepatitis • Gallenwegsverschluss • Hämolyse",
b:"GPT > GOT stark ↑ (bis > 1000 U/l) • Bilirubin ↑ • Anti-HAV-IgM positiv = frische Infektion; Anti-HAV-IgG = Immunität/Impfung • Quick (Leberfunktion)",
nf:0,bv:BV6+" • zusätzlich § 7 (Hepatitis-A-Virus) und § 34 (Hepatitis A)"},

{n:"Hepatitis B",a:"Virushepatitis B, Serumhepatitis",k:"leber",
d:"Leberentzündung durch das Hepatitis-B-Virus (DNA-Virus). Parenteral und sexuell übertragen. Bei Erwachsenen ca. 5–10 % chronischer Verlauf, bei Neugeborenen ca. 90 %.",
u:"Hepatitis-B-Virus (Hepadnavirus) • Übertragung: Blut (Nadelstich, i.v.-Drogen, Tätowierung, Piercing), sexuell, perinatal (Mutter → Kind) • Inkubationszeit 30–180 Tage (1–6 Monate) • Leberschaden durch die Immunreaktion",
s:"Ca. 2/3 symptomlos/anikterisch • Prodromalstadium: Müdigkeit, Appetitlosigkeit, Übelkeit, Gelenkschmerzen, Exanthem (Immunkomplexe), Fieber • ikterische Phase: Ikterus, dunkler Urin, heller Stuhl, Juckreiz, Lebervergrößerung, Druckschmerz rechter Oberbauch • Chronisch: oft symptomarm, Müdigkeit, Leistungsminderung",
l:"Müdigkeit, Ikterus, Oberbauchdruck – Risikoanamnese (Blut/Sexualkontakte)",
ko:"Fulminante Hepatitis (ca. 1 %) • chronische Hepatitis → Leberzirrhose → hepatozelluläres Karzinom • Superinfektion mit Hepatitis D • extrahepatisch: Panarteriitis nodosa, Glomerulonephritis",
dd:"Andere Virushepatitiden • Alkohol-/medikamentös-toxische Hepatitis • Autoimmunhepatitis • Gallenwegserkrankungen • Mononukleose",
b:"GPT, GOT stark ↑, Bilirubin ↑ • HBs-Ag (Infektion), HBe-Ag und HBV-DNA (Infektiosität), Anti-HBc-IgM (frische Infektion), Anti-HBc-IgG (durchgemachte Infektion), Anti-HBs (Immunität/Impfung – alleiniger Anti-HBs = Impfung) • HBs-Ag > 6 Monate = chronisch",
nf:0,bv:BV6+" • zusätzlich § 7 (Hepatitis-B-Virus) • gleichzeitig sexuell übertragbar"},

{n:"Hepatitis C",a:"Virushepatitis C",k:"leber",
d:"Leberentzündung durch das Hepatitis-C-Virus (RNA). Meist symptomarm, chronifiziert in ca. 50–80 %. Heute mit antiviralen Medikamenten in > 95 % heilbar. Keine Impfung.",
u:"Hepatitis-C-Virus (Flavivirus) • Übertragung überwiegend über Blut: i.v.-Drogen (gemeinsames Spritzbesteck), früher Bluttransfusionen, Tätowierung, Nadelstich • sexuell und perinatal selten • Inkubationszeit 2–26 Wochen",
s:"Akut meist symptomlos (ca. 75 %) • unspezifisch: Müdigkeit, Leistungsminderung, Oberbauchdruck, Gelenkbeschwerden • Ikterus selten • chronisch: jahrelang symptomarm, Müdigkeit",
l:"Unspezifische Müdigkeit mit erhöhten Leberwerten bei Risikoanamnese",
ko:"Chronische Hepatitis (50–80 %) → Leberzirrhose (ca. 20 % nach 20 Jahren) → hepatozelluläres Karzinom • extrahepatisch: Kryoglobulinämie, Glomerulonephritis, Porphyria cutanea tarda, Non-Hodgkin-Lymphom, Lichen ruber, Sjögren",
dd:"Andere Hepatitiden • Fettleber • Alkoholschaden • Autoimmunhepatitis • Hämochromatose",
b:"Transaminasen ↑ (oft nur mäßig, schwankend) • Anti-HCV-Antikörper (Suchtest) • HCV-RNA (PCR) beweist aktive Infektion • Genotypisierung",
nf:0,bv:BV6+" • zusätzlich § 7 (Hepatitis-C-Virus)"},

{n:"Hepatitis D und E",a:"Virushepatitis D (Delta), Virushepatitis E",k:"leber",
d:"Hepatitis D: defektes RNA-Virus, das nur zusammen mit Hepatitis B vorkommt (Simultan- oder Superinfektion) – schwerster Verlauf. Hepatitis E: meist selbstlimitierende Hepatitis, fäkal-oral bzw. über Schweinefleisch/Wild übertragen.",
u:"HDV: Blut, sexuell; nur bei HBs-Ag-Trägern • HEV: in Europa v. a. Genotyp 3 über rohes/ungenügend gegartes Schweinefleisch, Wild, Innereien (Zoonose); in Entwicklungsländern über Trinkwasser • Inkubation HEV 15–64 Tage",
s:"Wie andere akute Hepatitiden: Müdigkeit, Übelkeit, Ikterus, dunkler Urin, Oberbauchbeschwerden • HEV oft symptomlos",
l:"Akute Hepatitis; HDV verschlechtert eine bekannte Hepatitis B",
ko:"HDV: fulminante Hepatitis, rasche Zirrhose (Superinfektion chronifiziert in ~90 %) • HEV: fulminant bei Schwangeren (Letalität bis 20 %, Genotyp 1/2), chronisch bei Immunsupprimierten",
dd:"Andere Virushepatitiden • toxische Hepatitis • Autoimmunhepatitis",
b:"Transaminasen ↑, Bilirubin ↑ • Anti-HDV, HDV-RNA (nur bei HBs-Ag positiv) • Anti-HEV-IgM, HEV-RNA",
nf:0,bv:BV6+" • zusätzlich § 7 (Hepatitis-D-/-E-Virus) • Hepatitis E auch § 34"},

{n:"Fettleber",a:"Steatosis hepatis, NAFLD/MASLD, Fettleberhepatitis (NASH/MASH)",k:"leber",
d:"Einlagerung von Fett in > 5 % der Leberzellen. Alkoholisch (ALD) oder nicht-alkoholisch (NAFLD, heute MASLD = stoffwechselassoziiert). Entzündliche Form: Steatohepatitis.",
u:"Alkohol • Übergewicht, metabolisches Syndrom, Diabetes Typ 2, Fettstoffwechselstörung • Medikamente (Kortison, Methotrexat, Tamoxifen, Amiodaron) • Mangelernährung, Fasten • Schwangerschaftsfettleber (selten, akut)",
s:"Meist symptomlos • Druck-/Völlegefühl im rechten Oberbauch • Müdigkeit • vergrößerte, weiche, glatte Leber tastbar",
l:"Symptomlos, Zufallsbefund: vergrößerte Leber, erhöhte Leberwerte, metabolisches Syndrom",
ko:"Steatohepatitis → Leberfibrose → Leberzirrhose → hepatozelluläres Karzinom • erhöhtes Herz-Kreislauf-Risiko",
dd:"Virushepatitis • Hämochromatose • M. Wilson • Autoimmunhepatitis • medikamentös-toxischer Leberschaden",
b:"γ-GT ↑ (Alkohol), GPT/GOT leicht ↑ (GOT/GPT > 2 → Alkohol) • Triglyzeride, BZ, HbA1c • MCV ↑, CDT ↑ (Alkohol) • Ferritin • Sonografie (helle „weiße“ Leber), Fibroscan",
nf:0},

{n:"Leberzirrhose",a:"Schrumpfleber",k:"leber",
d:"Irreversibler Endzustand chronischer Lebererkrankungen: Zerstörung der Läppchenstruktur mit bindegewebigem Umbau und Bildung von Regeneratknoten → Leberinsuffizienz und Pfortaderhochdruck.",
u:"Alkohol (ca. 50 %) • chronische Virushepatitis B, C, D • Fettleber (MASLD) • Autoimmunhepatitis, PBC, PSC • Hämochromatose, M. Wilson, α1-Antitrypsin-Mangel • Rechtsherzinsuffizienz (Cirrhose cardiaque) • Medikamente/Toxine",
s:"Leberhautzeichen: Spider naevi, Palmarerythem, Lacklippen/-zunge, Weißnägel, Dupuytren-Kontraktur, Bauchglatze, Gynäkomastie, Hodenatrophie, Libidoverlust • Ikterus, Juckreiz • Müdigkeit, Leistungsminderung, Gewichtsverlust, Muskelschwund • Pfortaderhochdruck: Aszites, Splenomegalie, Caput medusae, Ösophagusvarizen, Hämorrhoiden • Blutungsneigung (Hämatome) • Ödeme • tastbar derbe, höckrige Leber (später klein) • Foetor hepaticus",
l:"Leberhautzeichen + Aszites + Ikterus",
ko:"Ösophagusvarizenblutung • hepatische Enzephalopathie, Leberkoma • Aszites mit spontan bakterieller Peritonitis • hepatorenales Syndrom • hepatozelluläres Karzinom • Gerinnungsstörung • Infektionen",
dd:"Herzinsuffizienz (Aszites, Ödeme) • nephrotisches Syndrom • Peritonealkarzinose • Budd-Chiari-Syndrom",
b:"Albumin ↓, Quick ↓/INR ↑, Cholinesterase ↓ (Syntheseleistung) • Bilirubin ↑ • Thrombozyten ↓ (Hypersplenismus) • Transaminasen (normal bis mäßig ↑), γ-GT ↑ • Ammoniak ↑ • Na ↓ • AFP (HCC-Screening) • Child-Pugh-Klassifikation • Sonografie, Fibroscan",
nf:1,nfm:"Bluterbrechen/Teerstuhl, zunehmende Verwirrtheit/Schläfrigkeit (Enzephalopathie), Fieber mit Aszites → 112."},

{n:"Hepatische Enzephalopathie / Leberkoma",a:"Coma hepaticum",k:"leber",
d:"Potenziell reversible Funktionsstörung des Gehirns durch mangelnde Entgiftungsleistung der Leber (v. a. Ammoniak) bei schwerer Lebererkrankung, Stadien I–IV.",
u:"Leberzirrhose, akutes Leberversagen • Auslöser: GI-Blutung (Eiweißlast), eiweißreiche Kost, Infektionen, Obstipation, Diuretika/Elektrolytstörung, Sedativa, Alkohol, Exsikkose",
s:"Stadium I: Konzentrationsstörung, Verlangsamung, verwaschene Sprache, Schlafumkehr • II: Schläfrigkeit, Flattertremor (Asterixis), Schriftveränderung, Desorientierung • III: Somnolenz, Verwirrtheit • IV: Koma • Foetor hepaticus (süßlich-erdiger Mundgeruch)",
l:"Verwirrtheit/Schläfrigkeit + Flattertremor bei Leberkranken",
ko:"Koma, Hirnödem • Aspiration • Tod",
dd:"Alkoholintoxikation, Delir • Hypoglykämie • Subduralhämatom (Sturz, Gerinnungsstörung!) • Elektrolytstörung • Wernicke-Enzephalopathie • Sepsis",
b:"Ammoniak ↑ • Leberwerte, Quick ↓ • Elektrolyte (K ↓, Na ↓) • BZ • Infektparameter • EEG",
nf:2,nfm:"112 • stabile Seitenlage bei Bewusstseinstrübung • BZ messen • Vitalzeichen • nichts essen/trinken"},

{n:"Leberzellkarzinom",a:"Hepatozelluläres Karzinom (HCC), Leberkrebs",k:"leber",

s:"Oft lange symptomlos • Verschlechterung einer bekannten Zirrhose • Oberbauchschmerzen, tastbare Resistenz • Gewichtsverlust, Appetitlosigkeit • Ikterus, Aszites • B-Symptome",
l:"Rasche Verschlechterung einer Leberzirrhose mit Gewichtsverlust",
ko:"Tumorruptur mit Blutung • Pfortaderthrombose • Leberversagen • Metastasen",
dd:"Lebermetastasen • Leberadenom, Hämangiom, FNH • Leberabszess • Cholangiokarzinom",
b:"AFP ↑ (alpha-Fetoprotein) • Leberwerte • Sonografie alle 6 Monate bei Zirrhose, CT/MRT",
nf:0},

{n:"Cholelithiasis / Gallenkolik",a:"Gallensteine, Gallensteinleiden",k:"leber",
d:"Steine in der Gallenblase (Cholezystolithiasis) oder den Gallengängen (Choledocholithiasis). Gallenkolik: krampfartiger Schmerz durch Steineinklemmung.",
u:"Cholesterinsteine (80 %): Übersättigung der Galle mit Cholesterin • Pigmentsteine: Hämolyse, Zirrhose • 6 F: female, fat, fertile, forty, fair, family • Schwangerschaft, Pille, Diabetes, rasche Gewichtsabnahme, Fasten, M. Crohn",
s:"Meist symptomlos (stumme Steine, ~75 %) • unspezifisch: Völlegefühl, Blähungen, Fettunverträglichkeit, Druck im rechten Oberbauch • Gallenkolik: plötzliche heftige, krampfartige Schmerzen im rechten Oberbauch/Epigastrium, oft nachts oder nach fettem Essen, Ausstrahlung in die rechte Schulter/den Rücken (Head-Zone), Übelkeit, Erbrechen, Unruhe, Dauer 15 Min. bis Stunden",
l:"Kolikartiger Schmerz im rechten Oberbauch mit Ausstrahlung in die rechte Schulter nach fettem Essen",
ko:"Akute Cholezystitis • Choledocholithiasis → Verschlussikterus, Cholangitis • biliäre Pankreatitis • Gallenblasenhydrops, -empyem, -perforation • Gallensteinileus • Porzellangallenblase, Gallenblasenkarzinom",

b:"Im Anfall meist unauffällig; bei Gangverschluss: Bilirubin (direkt) ↑, AP ↑, γ-GT ↑ • Lipase (biliäre Pankreatitis) • Leukozyten/CRP (Entzündung) • Sonografie (Methode der Wahl)",
nf:1,nfm:"Kolik mit Fieber, Schüttelfrost, Ikterus (Cholangitis) oder starke Dauerschmerzen → Klinik/112. Nichts essen."},

{n:"Akute Cholezystitis",a:"Gallenblasenentzündung",k:"leber",
d:"Akute Entzündung der Gallenblase, in > 90 % durch Gallensteine (Verschluss des Ductus cysticus).",
u:"Steinverschluss des Ductus cysticus → Stau, chemische Reizung → bakterielle Infektion (E. coli, Enterokokken, Klebsiellen) • steinlos (akalkulös): Intensivpatienten, Sepsis, Trauma",
s:"Anhaltende (> 6 Std.) Schmerzen im rechten Oberbauch • Fieber • Übelkeit, Erbrechen • Murphy-Zeichen positiv (schmerzbedingter Inspirationsstopp bei Palpation unter dem rechten Rippenbogen) • lokale Abwehrspannung • tastbare Gallenblase • leichter Ikterus möglich",
l:"Rechter Oberbauchschmerz + Fieber + positives Murphy-Zeichen",

dd:"Gallenkolik • Cholangitis • Pankreatitis • Hepatitis • Ulkus(-perforation) • Appendizitis • Pyelonephritis rechts • Pneumonie • Herzinfarkt",
b:"Leukozytose, CRP ↑ • Bilirubin, AP, γ-GT ggf. ↑ • Lipase • Sonografie (verdickte, dreigeschichtete Wand, Steine)",
nf:2,nfm:"Klinikeinweisung (Antibiotika, OP) • nichts essen • Knierolle • bei Schock/Peritonitis 112"},

{n:"Cholangitis",a:"Gallengangsentzündung",k:"leber",
d:"Bakterielle Entzündung der Gallenwege, meist bei Abflussbehinderung. Akute eitrige Cholangitis ist lebensbedrohlich.",

ko:"Urosepsis-ähnliche biliäre Sepsis, septischer Schock • Leberabszesse • Pankreatitis",
dd:"Cholezystitis • Hepatitis • Leberabszess • Pankreatitis • Pyelonephritis",
b:"Leukozytose, CRP/PCT ↑ • Bilirubin (direkt), AP, γ-GT ↑ • Transaminasen ↑ • Blutkulturen • Sonografie, ERCP",
nf:2,nfm:"112/Klinik – Antibiotika und Gallenwegsdrainage (ERCP) dringend • Sepsisüberwachung"},

{n:"Akute Pankreatitis",a:"Akute Bauchspeicheldrüsenentzündung",k:"leber",
d:"Akute Entzündung der Bauchspeicheldrüse durch Selbstverdauung (Autodigestion) mit aktivierten Pankreasenzymen. Ödematöse (80 %) oder nekrotisierende Form.",
u:"Gallensteine (biliär, ~40 %) • Alkohol (~30 %) • Hypertriglyzeridämie, Hyperkalzämie (Hyperparathyreoidismus) • nach ERCP • Medikamente (Azathioprin, Diuretika, Valproat) • Infektionen (Mumps), Trauma • idiopathisch",
s:"Plötzlicher heftiger Oberbauchschmerz, gürtelförmig in den Rücken ausstrahlend • Übelkeit, Erbrechen • „Gummibauch“ (prall-elastische Bauchdecke, keine brettharte Abwehrspannung) • Meteorismus, paralytischer (Sub-)Ileus • Fieber • Gesichtsrötung (Flush) • Schock • Ikterus (biliär) • Hautzeichen bei Nekrose: Grey-Turner (Flanken), Cullen (Nabel) – bläuliche Verfärbung • Pleuraerguss links",
l:"Gürtelförmiger Oberbauchschmerz mit Ausstrahlung in den Rücken + Lipase ↑",
ko:"Schock, Multiorganversagen (ARDS, Nierenversagen) • Pankreasnekrose, infizierte Nekrose, Abszess • Pseudozysten • Blutung • Sepsis • DIC • Hypokalzämie (Tetanie) • Diabetes",
dd:"Ulkusperforation • Gallenkolik/Cholezystitis • Herzinfarkt (Hinterwand) • Mesenterialinfarkt • Aortenaneurysma/-dissektion • Ileus • Nierenkolik",
b:"Lipase ≥ 3-fach ↑ (spezifischer als Amylase) • Leukozytose, CRP ↑ (CRP > 150 mg/l → schwerer Verlauf) • BZ ↑, Kalzium ↓ (Prognose ungünstig) • LDH ↑ • Bilirubin, AP, γ-GT (biliär) • Triglyzeride • Kreatinin, Hkt • Sonografie, CT",
nf:2,nfm:"112 • Nahrungskarenz, nichts trinken • Knierolle • Schockbekämpfung • Vitalzeichen"},

{n:"Chronische Pankreatitis",a:"Chronische Bauchspeicheldrüsenentzündung",k:"leber",
d:"Fortschreitende, irreversible Entzündung des Pankreas mit Fibrose und Funktionsverlust (exokrin und endokrin).",
u:"Alkohol (~80 %) • Rauchen • genetisch, Mukoviszidose • Hyperparathyreoidismus, Hypertriglyzeridämie • Autoimmunpankreatitis • idiopathisch",
s:"Rezidivierende/dauernde gürtelförmige Oberbauchschmerzen, nach dem Essen und Alkohol • Exokrine Insuffizienz (spät, bei > 90 % Verlust): Fettstühle (voluminös, glänzend, übelriechend), Blähungen, Gewichtsverlust, Mangel an fettlöslichen Vitaminen (A, D, E, K) • Endokrine Insuffizienz: pankreopriver Diabetes",

b:"Pankreas-Elastase im Stuhl ↓ • Stuhlfett ↑ • BZ/HbA1c • Lipase im Schub ↑ (später evtl. normal) • Vitamin A, D, E, K ↓ • Sonografie, CT (Verkalkungen), Endosonografie",
nf:0},

{n:"Pankreaskarzinom",a:"Bauchspeicheldrüsenkrebs",k:"leber",

l:"Schmerzloser Ikterus + Gewichtsverlust beim älteren Menschen",
ko:"Metastasen (Leber, Peritoneum) • Thromboembolien • Duodenalstenose • Kachexie",
dd:"Chronische Pankreatitis • Choledocholithiasis • Gallengangs-/Papillenkarzinom • Hepatitis",
b:"CA 19-9 ↑ (Verlaufsmarker) • Bilirubin (direkt), AP, γ-GT ↑ • BZ ↑ • Sonografie, CT, Endosonografie mit Biopsie",
nf:0},

{n:"Hämochromatose",a:"Eisenspeicherkrankheit, Bronzediabetes",k:"leber",

l:"Leberzirrhose + Diabetes + Hautbräunung + Gelenkschmerzen",
ko:"Leberzirrhose, hepatozelluläres Karzinom • Herzinsuffizienz • Diabetes • Arthropathie • Hypogonadismus",
dd:"Andere Ursachen erhöhten Ferritins (Entzündung, Fettleber, Alkohol) • Leberzirrhose anderer Genese • Rheumatoide Arthritis • M. Addison (Hyperpigmentierung)",

{n:"Morbus Wilson",a:"Kupferspeicherkrankheit, hepatolentikuläre Degeneration",k:"leber",

);

d:"Bakterielle Infektion der unteren Harnwege (Harnröhre, Blase). Frauen deutlich häufiger betroffen (kurze Harnröhre).",
u:"E. coli (~80 %), Proteus, Klebsiellen, Enterokokken, Staph. saprophyticus • aufsteigende Infektion • Risikofaktoren: weibliches Geschlecht, Geschlechtsverkehr („Honeymoon-Zystitis“), Schwangerschaft, Diabetes, Harnabflussstörung (Prostata, Steine), Katheter, Östrogenmangel nach Menopause, geringe Trinkmenge, Unterkühlung",
s:"Brennen beim Wasserlassen (Dysurie, Algurie) • häufiger Harndrang mit kleinen Mengen (Pollakisurie) • imperativer Harndrang • Schmerzen über der Blase • trüber, übelriechender Urin, ggf. Blut (Hämaturie) • KEIN hohes Fieber, kein Flankenschmerz (sonst Pyelonephritis)",
l:"Brennen beim Wasserlassen + häufiger Harndrang ohne Fieber",
ko:"Aufsteigende Pyelonephritis • Urosepsis • Rezidive • in der Schwangerschaft: Frühgeburt • Männer: Prostatitis, Epididymitis",
dd:"Urethritis durch STI (Chlamydien, Gonokokken!) • Vaginitis • Reizblase • Blasenstein, Blasentumor • interstitielle Zystitis • Prostatitis",
b:"Urin-Stix: Leukozyten +, Nitrit + (nicht alle Erreger), Blut ± • Urinkultur (Mittelstrahlurin, Keimzahl ≥ 10⁵/ml) • bei Komplikationen Blutbild, CRP, Kreatinin",
nf:0},

{n:"Pyelonephritis",a:"Nierenbeckenentzündung",k:"niere",
d:"Bakterielle Entzündung von Nierenbecken und Nierengewebe (Interstitium), meist aufsteigend aus den unteren Harnwegen. Akut oder chronisch.",
u:"Aufsteigender Harnwegsinfekt (E. coli) • Harnabflussstörungen (Steine, Prostatavergrößerung, Schwangerschaft, Fehlbildungen, vesikoureteraler Reflux) • Diabetes, Immunsuppression • Katheter • Analgetikaabusus (chronisch)",
s:"Akut: hohes Fieber, Schüttelfrost, ausgeprägtes Krankheitsgefühl • einseitiger Flankenschmerz, klopfschmerzhaftes Nierenlager • Übelkeit, Erbrechen • oft zusätzlich Dysurie, Pollakisurie • Chronisch: uncharakteristisch: Müdigkeit, Kopfschmerz, dumpfer Rückenschmerz, Hypertonie, Polyurie",
l:"Fieber mit Schüttelfrost + Flankenschmerz + klopfschmerzhaftes Nierenlager",
ko:"Urosepsis (lebensbedrohlich) • Nierenabszess, paranephritischer Abszess • chronische Pyelonephritis → Schrumpfniere, Niereninsuffizienz, renale Hypertonie • in der Schwangerschaft: Frühgeburt",
dd:"Nierenkolik • Appendizitis, Cholezystitis • Lumbago/Bandscheibe • Adnexitis • Pankreatitis • basale Pneumonie",
b:"Leukozytose, CRP/BSG ↑, PCT bei Sepsis • Urin: Leukozyten, Leukozytenzylinder (beweisen Nierenbeteiligung!), Nitrit, Bakterien, Hämaturie • Urinkultur, Blutkulturen • Kreatinin • Sonografie (Stau?)",
nf:1,nfm:"Sepsiszeichen (Verwirrtheit, RR-Abfall, Tachykardie, schnelle Atmung) oder Stauungsniere → 112/Klinik. Immer ärztliche Antibiotikatherapie."},

{n:"Glomerulonephritis",a:"Akute/chronische Nierenkörperchenentzündung, Poststreptokokken-GN, IgA-Nephropathie",k:"niere",
d:"Immunologisch vermittelte, meist beidseitige Entzündung der Nierenkörperchen (Glomeruli). Leitbild: nephritisches Syndrom.",
u:"Immunkomplexe oder Autoantikörper • Poststreptokokken-GN (1–3 Wochen nach Streptokokken-Angina/Hautinfekt, v. a. Kinder) • IgA-Nephropathie (häufigste GN, Hämaturie kurz nach Infekt) • rapid-progressive GN (Goodpasture, ANCA-Vaskulitis) • Lupus, Endokarditis, Hepatitis B/C",
s:"Nephritisches Syndrom: Hämaturie (bräunlicher, „fleischwasserfarbener“ Urin), Proteinurie (< 3,5 g/Tag), Hypertonie, Ödeme (Lidödeme morgens), Oligurie • Kopfschmerzen, Müdigkeit • Flankenschmerz (Kapselspannung) • oft auch symptomlos (Zufallsbefund)",
l:"Fleischwasserfarbener Urin + Lidödeme + Hypertonie nach einem Infekt",
ko:"Akutes Nierenversagen (rapid-progressive Form) • chronische Niereninsuffizienz bis Dialysepflicht • hypertensive Krise • Lungenödem • Lungenblutung (Goodpasture)",
dd:"Nephrotisches Syndrom • Harnwegsinfekt • Nierenstein, Nierentumor (Hämaturie) • Zystennieren",
b:"Urin: Erythrozyten-Zylinder und dysmorphe Erythrozyten (Akanthozyten) beweisen glomeruläre Blutung, Proteinurie • Kreatinin, Harnstoff ↑ • ASL-Titer ↑ (Poststreptokokken), Komplement C3 ↓ • ANCA, Anti-GBM, ANA • Nierenbiopsie",
nf:1,nfm:"Rasche Abnahme der Urinmenge, Atemnot (Lungenödem), sehr hoher Blutdruck → 112."},

{n:"Nephrotisches Syndrom",a:"Nephrose",k:"niere",
d:"Symptomenkomplex bei Schädigung der glomerulären Filterbarriere mit großem Eiweißverlust über den Urin.",
u:"Erwachsene: diabetische Nephropathie, membranöse Glomerulonephritis, fokal-segmentale Glomerulosklerose, Amyloidose, Lupus, Medikamente (NSAR), Tumoren, Hepatitis B/C • Kinder: Minimal-Change-Glomerulonephritis (häufigste Ursache)",
s:"Tetrade: Proteinurie > 3,5 g/Tag (schäumender Urin), Hypoproteinämie/Hypalbuminämie, generalisierte Ödeme (Lider, Beine, Aszites, Pleuraerguss – Anasarka), Hyperlipidämie • Gewichtszunahme • Müdigkeit",
l:"Massive Ödeme + schäumender Urin",
ko:"Thrombosen/Embolien (Verlust von Antithrombin III, Nierenvenenthrombose) • Infektionen (Verlust von Immunglobulinen) • Arteriosklerose • Niereninsuffizienz",
dd:"Herzinsuffizienz • Leberzirrhose • Eiweißmangel durch Mangelernährung oder Malabsorption • Myxödem",
b:"Urin: Eiweiß > 3,5 g/24 Std., Fettkörnchenzylinder • Albumin ↓, Gesamteiweiß ↓ • Cholesterin, Triglyzeride ↑ • Elektrophorese: Albumin ↓, α2-Globulin ↑ • IgG ↓ • Kreatinin • Nierenbiopsie",
nf:0},

{n:"Akutes Nierenversagen",a:"Akute Nierenschädigung (AKI)",k:"niere",
d:"Rasche (Stunden bis Tage), prinzipiell reversible Abnahme der Nierenfunktion mit Anstieg der harnpflichtigen Substanzen, oft mit Oligurie/Anurie.",
u:"Prärenal (~60 %): Minderdurchblutung – Schock, Exsikkose, Blutung, Herzinsuffizienz, Sepsis, Diuretika/ACE-Hemmer/NSAR • Renal (intrarenal): akute Tubulusnekrose (Ischämie, Kontrastmittel, Aminoglykoside), Glomerulonephritis, Rhabdomyolyse (Myoglobin), Hämolyse • Postrenal: Harnabflussbehinderung – Prostatavergrößerung, Steine beidseits, Tumoren",
s:"Oligurie (< 500 ml/Tag) oder Anurie (< 100 ml/Tag) – bei ca. 1/3 normale Urinmenge • Überwässerung: Ödeme, Lungenödem, Hypertonie • Urämie: Übelkeit, Erbrechen, Müdigkeit, Verwirrtheit, Juckreiz, Foetor uraemicus • Herzrhythmusstörungen (Hyperkaliämie)",
l:"Plötzlicher Rückgang der Urinmenge + steigendes Kreatinin",
ko:"Hyperkaliämie → Kammerflimmern, Herzstillstand • Lungenödem • metabolische Azidose • urämische Perikarditis, Enzephalopathie • Infektionen • Übergang in chronische Niereninsuffizienz",
dd:"Chronische Niereninsuffizienz (kleine Nieren, Anämie, renale Osteopathie) • Harnverhalt (Blase prall!)",
b:"Kreatinin, Harnstoff ↑ • Kalium ↑ (!) • metabolische Azidose (Bikarbonat ↓) • Phosphat ↑, Kalzium ↓ • Urinstatus, Urin-Natrium • CK/Myoglobin (Rhabdomyolyse) • Sonografie (Stau? Blase?)",
nf:2,nfm:"112/Klinik • Vitalzeichen, Trinkmenge/Urinmenge dokumentieren • Ursache: Harnverhalt? (Blase tasten) • Herzrhythmus überwachen (Kalium!)"},

{n:"Chronische Niereninsuffizienz",a:"Chronische Nierenkrankheit (CKD), Urämie, terminale Niereninsuffizienz",k:"niere",
d:"Irreversible, fortschreitende Abnahme der Nierenfunktion über > 3 Monate (GFR < 60 ml/min). Stadien G1–G5; G5 = terminale Niereninsuffizienz (Dialyse/Transplantation).",
u:"Diabetische Nephropathie (häufigste Ursache) • hypertensive Nephropathie (Nephrosklerose) • chronische Glomerulonephritis • Zystennieren • chronische Pyelonephritis, Analgetika-Nephropathie • Harnabflussstörung",
s:"Lange symptomlos (Kreatinin steigt erst ab ~50 % Funktionsverlust) • Leistungsminderung, Müdigkeit • Polyurie, Nykturie (später Oligurie) • renale Anämie (Blässe, Erythropoetinmangel) • Hypertonie • Ödeme, Lungenödem • Café-au-lait-Hautkolorit, Juckreiz • Urämie: Übelkeit, Erbrechen, Foetor uraemicus (Harngeruch), Perikarditis, Polyneuropathie, Restless legs, Enzephalopathie, Krämpfe • renale Osteopathie (Knochenschmerzen)",
l:"Müdigkeit, Blässe, Juckreiz, Hypertonie und Nykturie bei steigendem Kreatinin",
ko:"Hyperkaliämie (Herzrhythmusstörungen) • Überwässerung, Lungenödem • urämische Perikarditis • renale Anämie • sekundärer Hyperparathyreoidismus, renale Osteopathie • metabolische Azidose • Arteriosklerose, Herzinfarkt • Infektanfälligkeit",
dd:"Akutes Nierenversagen • prärenale Ursachen (Exsikkose)",
b:"Kreatinin, Harnstoff ↑, GFR ↓ • Kalium ↑, Phosphat ↑, Kalzium ↓, Parathormon ↑ • normochrome normozytäre Anämie • Bikarbonat ↓ • Urin: Proteinurie/Albuminurie • Harnsäure ↑ • Sonografie (kleine Nieren)",
nf:1,nfm:"Schwere Atemnot (Überwässerung), Herzrhythmusstörungen, Bewusstseinstrübung, Krämpfe → 112."},

{n:"Nierensteine / Nierenkolik",a:"Urolithiasis, Nephrolithiasis, Harnleiterstein",k:"niere",
d:"Konkremente in den ableitenden Harnwegen. Nierenkolik: krampfartige Schmerzen durch Steinwanderung/Einklemmung im Harnleiter.",
u:"Steinarten: Kalziumoxalat (~75 %), Harnsäure (Gicht, Zellzerfall), Kalziumphosphat, Struvit/Infektsteine (Proteus), Zystin (genetisch) • Risikofaktoren: geringe Trinkmenge, Hitze, eiweiß-/purinreiche und salzreiche Ernährung, Übergewicht, Hyperparathyreoidismus, Gicht, Immobilisation, Harnabflussstörung, HWI, M. Crohn",
s:"Wellenförmige, heftigste krampfartige Schmerzen in Flanke/Rücken, Ausstrahlung je nach Steinlage in Unterbauch, Leiste, Hoden/Schamlippen • Patient bewegungsunruhig (läuft umher, krümmt sich – im Gegensatz zur Peritonitis) • Übelkeit, Erbrechen, Schweißausbruch • Hämaturie (Mikro- oder Makro-) • Harndrang, Pollakisurie bei blasennahem Stein • reflektorischer Subileus",
l:"Wellenartige Vernichtungsschmerzen in der Flanke mit Ausstrahlung in die Leiste + Bewegungsdrang + Hämaturie",
ko:"Harnstau → Stauungsniere, Nierenfunktionsverlust • Urosepsis (Stein + Fieber = Notfall!) • Pyelonephritis • Rezidive (~50 %)",
dd:"Appendizitis • Gallenkolik • Bauchaortenaneurysma (ältere Männer!) • Extrauteringravidität, Ovarialtorsion • Pyelonephritis • Hodentorsion • Lumbago • Mesenterialinfarkt",
b:"Urin: Erythrozyten (Hämaturie), ggf. Leukozyten • Kreatinin • Kalzium, Harnsäure, Parathormon • Leukozyten/CRP (Infektion?) • Sonografie (Stau), CT • Steinanalyse",
nf:1,nfm:"Kolik mit Fieber/Schüttelfrost (infizierte Stauungsniere, Urosepsis) oder Anurie → 112. Starke Kolik → ärztliche Schmerztherapie."},

{n:"Zystennieren",a:"Polyzystische Nierenerkrankung (ADPKD)",k:"niere",
d:"Erbliche Erkrankung mit zahlreichen, langsam wachsenden Zysten in beiden Nieren → fortschreitender Funktionsverlust. (Einfache Nierenzysten sind dagegen harmlos.)",
u:"Autosomal-dominant (PKD1/PKD2-Gen), Manifestation meist ab 30.–40. Lebensjahr • autosomal-rezessive Form bei Kindern (selten)",
s:"Flankenschmerz, Druckgefühl, Bauchumfangzunahme • vergrößerte, höckrige Nieren tastbar • Hypertonie (frühes Zeichen) • Hämaturie • Harnwegsinfekte, Nierensteine • Zysten auch in Leber, Pankreas",
l:"Hypertonie + große höckrige Nieren + familiäre Belastung",
ko:"Chronische Niereninsuffizienz (Dialyse um 50.–60. Lj.) • Zysteninfektion, Zystenblutung • Hirnbasisaneurysmen → Subarachnoidalblutung • Herzklappenfehler",
dd:"Einfache Nierenzysten • Nierentumor • Hydronephrose",
b:"Kreatinin, GFR • Urinstatus (Hämaturie) • Sonografie/MRT (Methode der Wahl) • Gentest",
nf:0},

{n:"Nierenzellkarzinom",a:"Hypernephrom, Nierenkrebs",k:"niere",
d:"Häufigster bösartiger Nierentumor beim Erwachsenen, ausgehend vom Tubulusepithel (meist klarzellig). Bei Kindern: Nephroblastom (Wilms-Tumor).",
u:"Rauchen • Adipositas, Hypertonie • Dialyse (erworbene Zystennieren) • Von-Hippel-Lindau-Syndrom • Analgetikaabusus, Trichlorethylen",
s:"Häufig Zufallsbefund (Sonografie) • klassische Trias (spät, selten vollständig): schmerzlose Makrohämaturie, Flankenschmerz, tastbarer Tumor • B-Symptome, Anämie • Varikozele links (Kompression V. renalis) • paraneoplastisch: Polyglobulie (Erythropoetin), Hyperkalzämie, Hypertonie",
l:"Schmerzlose Makrohämaturie beim älteren Raucher",
ko:"Metastasen (Lunge, Knochen, Leber, Gehirn) • Tumorthrombus in V. renalis/V. cava",
dd:"Nierenzyste • Nierenstein • Blasentumor (Hämaturie) • Angiomyolipom • Glomerulonephritis",
b:"Urin: Hämaturie • BSG ↑ • Anämie oder Polyglobulie • Kalzium ↑ • Sonografie, CT",
nf:0},

{n:"Benigne Prostatahyperplasie (BPH)",a:"Gutartige Prostatavergrößerung, Prostataadenom",k:"niere",
d:"Gutartige Vergrößerung der Prostata (Übergangszone) bei älteren Männern mit Behinderung des Harnabflusses (Benignes Prostatasyndrom).",
u:"Hormonell (Dihydrotestosteron, Verschiebung Östrogen/Testosteron) • Alter (> 50 % der Männer > 60 J.)",
s:"Obstruktiv: abgeschwächter Harnstrahl, verzögerter Miktionsbeginn, Nachträufeln, Restharngefühl, Pressen • Irritativ: Pollakisurie, Nykturie, imperativer Harndrang, Dranginkontinenz • Stadien nach Alken: I Reizstadium, II Restharn, III Dekompensation (Überlaufblase, Harnstau)",
l:"Abgeschwächter Harnstrahl, Nykturie, Restharngefühl beim älteren Mann",
ko:"Akuter Harnverhalt (Notfall) • Restharn → rezidivierende HWI, Blasensteine • Harnstau → Hydronephrose, Niereninsuffizienz • Überlaufinkontinenz • Blasendivertikel",
dd:"Prostatakarzinom • Prostatitis • Harnröhrenstriktur • neurogene Blase (Diabetes, MS, Parkinson) • Blasentumor • Herzinsuffizienz (Nykturie)",
b:"PSA (Karzinomausschluss) • Kreatinin (Harnstau?) • Urinstatus • rektale Untersuchung: vergrößert, glatt, prallelastisch, Sulcus erhalten • Sonografie (Restharn), Uroflowmetrie",
nf:1,nfm:"Akuter Harnverhalt (schmerzhaft gefüllte Blase, kein Wasserlassen möglich) → Notfall, Arzt/Klinik zur Katheterisierung."},

{n:"Prostatakarzinom",a:"Prostatakrebs",k:"niere",
d:"Bösartiger Tumor der Prostata (Adenokarzinom, meist periphere Zone). Häufigster Krebs des Mannes.",
u:"Alter (Hauptrisikofaktor) • familiäre Belastung, genetisch (BRCA2) • Androgene (wachstumsfördernd) • ethnische Faktoren, Ernährung",
s:"Lange symptomlos (Lage peripher, fern der Harnröhre) • spät: Miktionsbeschwerden wie BPH, Hämaturie, Hämatospermie • Knochenschmerzen (osteoplastische Metastasen, v. a. Wirbelsäule/Becken), pathologische Frakturen • Gewichtsverlust, Anämie • Lymphödem der Beine",
l:"Früh symptomlos – später Kreuzschmerzen (Knochenmetastasen) beim älteren Mann",
ko:"Knochenmetastasen (Wirbelsäule → Querschnitt), Lymphknotenmetastasen • Harnstau • Anämie",
dd:"BPH • Prostatitis • Bandscheibenvorfall, Osteoporose (Rückenschmerz) • Plasmozytom",
b:"PSA ↑ (> 4 ng/ml abklärungsbedürftig, Dynamik wichtig) • AP ↑ (Knochenmetastasen) • rektale Untersuchung: derber, höckriger, „steinharter“ Knoten • MRT, Stanzbiopsie, Knochenszintigrafie",
nf:0},

{n:"Prostatitis",a:"Prostataentzündung",k:"niere",

u:"Akut: aufsteigende Infektion (E. coli, Enterokokken), Katheter, Eingriffe; bei jüngeren Männern STI (Chlamydien, Gonokokken) • chronisch: rezidivierende HWI, unklar",
s:"Akut: hohes Fieber, Schüttelfrost • Schmerzen im Damm, Rektum, Unterbauch, Leiste • Dysurie, Pollakisurie, Harnverhalt • schmerzhafter Stuhlgang • Chronisch: dumpfer Beckenschmerz, Schmerzen bei Ejakulation, Miktionsbeschwerden",
l:"Fieber + Dammschmerz + Miktionsbeschwerden, sehr druckschmerzhafte Prostata",
ko:"Prostataabszess • Urosepsis • Harnverhalt • Epididymitis • Chronifizierung",
dd:"Zystitis • BPH • Prostatakarzinom • Epididymitis • STI-Urethritis • Analerkrankungen",
b:"Leukozytose, CRP ↑, PSA ↑ (vorübergehend) • Urinstatus, Urinkultur • STI-Diagnostik (ärztlich) • rektale Untersuchung (keine Prostatamassage bei akuter Form – Sepsisgefahr!)",
nf:1,nfm:"Akute Prostatitis mit hohem Fieber/Harnverhalt → Klinik.",bv:"Bei sexuell übertragener Ursache (Chlamydien, Gonokokken) → "+BVSTI},

{n:"Hodentorsion",a:"Samenstrangtorsion",k:"niere",
d:"Verdrehung des Hodens um den Samenstrang → Unterbrechung der Blutversorgung. Urologischer Notfall: nach 4–6 Stunden irreversible Hodenschädigung.",
u:"Anlagebedingt übermäßige Beweglichkeit des Hodens • Häufigkeitsgipfel: Neugeborene und Pubertät (12–18 J.) • Auslöser: Schlaf, Sport, Kälte, Trauma",
s:"Plötzlicher, heftiger, einseitiger Hodenschmerz (oft aus dem Schlaf), Ausstrahlung in Leiste und Unterbauch • Übelkeit, Erbrechen • Hoden geschwollen, hochstehend, quer liegend • Prehn-Zeichen negativ (Anheben des Hodens bessert den Schmerz NICHT) • fehlender Kremasterreflex • Kinder klagen oft nur über Bauchschmerzen",
l:"Plötzlicher stärkster Hodenschmerz beim Jugendlichen, Prehn-Zeichen negativ",
ko:"Hodennekrose, Verlust des Hodens • Infertilität",
dd:"Epididymitis (Prehn positiv, langsamer Beginn, Fieber) • Hydatidentorsion • Orchitis (Mumps) • Hodentrauma • eingeklemmte Leistenhernie • Hodentumor • Nierenkolik",
b:"Keine Zeit verlieren! • Doppler-Sonografie (fehlende Durchblutung) • im Zweifel operative Freilegung",
nf:2,nfm:"Sofort Klinik/Urologie bzw. 112 – OP innerhalb von 4–6 Std. • nichts essen/trinken (OP) • kein Abwarten, kein Kühlen als Therapieersatz"},

{n:"Akuter Harnverhalt",a:"Ischuria, Harnsperre",k:"niere",
d:"Unfähigkeit, die volle Harnblase spontan zu entleeren.",
u:"Prostatavergrößerung (BPH, häufigste Ursache), Prostatakarzinom, Prostatitis • Harnröhrenstriktur, Blasenstein, Blutkoagel • Medikamente (Anticholinergika, Antidepressiva, Opioide, Antihistaminika, Alkohol) • neurogen (Bandscheibenvorfall/Cauda-equina, MS, Diabetes) • postoperativ, Kälte",
s:"Starker, schmerzhafter Harndrang ohne Entleerung • prall gefüllte, tastbare, druckschmerzhafte Blase (bis zum Nabel) • Unruhe, Schweißausbruch • Überlaufinkontinenz (ständiges Harnträufeln)",
l:"Schmerzhaft volle Blase, kein Wasserlassen möglich",
ko:"Blasenüberdehnung • Harnstau → postrenales Nierenversagen • HWI",
dd:"Anurie (leere Blase!) bei Nierenversagen • Blasentumor • Bauchtumoren",
b:"Sonografie (Blasenfüllung, Restharn) • Kreatinin, Kalium • Urinstatus • PSA (später)",
nf:2,nfm:"Sofortige ärztliche Entlastung (Katheter) • bei Rückenschmerz + Taubheit Reithosenbereich: Cauda-equina → 112"},

{n:"Harninkontinenz",a:"Blasenschwäche (Belastungs-, Drang-, Überlauf-, Reflexinkontinenz)",k:"niere",
d:"Unfreiwilliger Urinverlust. Formen: Belastungs-(Stress-)inkontinenz, Dranginkontinenz (überaktive Blase), Mischinkontinenz, Überlaufinkontinenz, Reflexinkontinenz (neurogen).",
u:"Belastung: Beckenbodenschwäche (Geburten, Östrogenmangel, Übergewicht, nach Prostata-OP) • Drang: überaktiver Detrusor, HWI, Blasenstein/-tumor, neurologisch (Demenz, Parkinson, Schlaganfall) • Überlauf: Abflusshindernis (BPH), Detrusorschwäche (Diabetes) • Reflex: Querschnittslähmung",
s:"Belastung: Urinverlust bei Husten, Niesen, Lachen, Heben, ohne Harndrang • Drang: plötzlicher starker Harndrang, Urinverlust vor Erreichen der Toilette, Pollakisurie, Nykturie • Überlauf: ständiges Harnträufeln bei voller Blase",
l:"Unwillkürlicher Urinverlust bei Belastung oder mit Harndrang",
ko:"Hautschäden, Infektionen • sozialer Rückzug, Depression • Stürze (nächtlicher Harndrang)",
dd:"HWI • Diabetes (Polyurie) • Diuretika • Fistel • neurologische Erkrankungen • Blasentumor",
b:"Urinstatus/-kultur • BZ • Kreatinin • Restharnsonografie, Miktionstagebuch, Urodynamik",
nf:0},

{n:"Hodentumor",a:"Hodenkrebs, Seminom, Nicht-Seminom",k:"niere",
d:"Bösartiger Tumor des Hodens, meist Keimzelltumor (Seminom oder Nicht-Seminom). Häufigster bösartiger Tumor bei Männern zwischen 20 und 40 Jahren, sehr gute Heilungschancen.",
u:"Hodenhochstand (Maldescensus testis) in der Kindheit • Hodentumor in der Familie oder auf der Gegenseite • Infertilität, Klinefelter-Syndrom",
s:"Schmerzlose, derbe, langsam zunehmende Hodenvergrößerung oder Knoten • Schweregefühl • Gynäkomastie (hCG) • bei Metastasen: Rückenschmerzen (retroperitoneale Lymphknoten), Husten",
l:"Schmerzlose Verhärtung oder Vergrößerung eines Hodens bei jungen Männern",
ko:"Metastasen (retroperitoneale Lymphknoten, Lunge) • Infertilität",
dd:"Epididymitis, Orchitis • Hydrozele, Varikozele, Spermatozele • Hodentorsion • Leistenhernie",
b:"Tumormarker: AFP, β-hCG, LDH • Sonografie • Hodenfreilegung (keine Biopsie durch das Skrotum)",
nf:0},

{n:"Epididymitis",a:"Nebenhodenentzündung",k:"niere",

{n:"Reaktive Arthritis",a:"Postinfektiöse Arthritis, Reiter-Syndrom",k:"bewegung",

{n:"Bandscheibenvorfall",a:"Diskusprolaps, Nucleus-pulposus-Prolaps, Ischias, Lumboischialgie",k:"bewegung",

dd:"Unspezifischer Rückenschmerz, ISG-Blockade • Spinalkanalstenose • Spondylodiszitis • Tumor/Metastasen • Osteoporotische Fraktur • Herpes zoster (vor Bläschen) • Nierenkolik, Aortenaneurysma • Hüftarthrose • Polyneuropathie",

nf:1,nfm:"Warnzeichen (red flags): Blasen-/Mastdarmstörung, Taubheit im Reithosenbereich, zunehmende Lähmung → sofort Klinik/112 (Cauda-equina-Syndrom)."},

{n:"Osteomyelitis / Septische Arthritis",a:"Knochenmarkentzündung, bakterielle Gelenkentzündung, Spondylodiszitis",k:"bewegung",

{n:"Karpaltunnelsyndrom",a:"KTS, Brachialgia paraesthetica nocturna",k:"bewegung",

{n:"Psoriasis-Arthritis",a:"Arthritis psoriatica",k:"bewegung",

nf:0},

{n:"Schlaganfall (Apoplex)",a:"Hirninfarkt, Insult, Stroke, Hirnblutung",k:"nerven",
d:"Plötzlich auftretende neurologische Ausfälle durch Durchblutungsstörung des Gehirns: ischämischer Hirninfarkt (~85 %) oder Hirnblutung (~15 %). „Time is brain“ – pro Minute sterben ca. 2 Mio. Nervenzellen.",
u:"Ischämisch: Arteriosklerose der hirnversorgenden Arterien (Karotisstenose), kardiale Embolie (Vorhofflimmern!), Mikroangiopathie (lakunär, Hypertonie/Diabetes), Dissektion • Blutung: Hypertonie, Gefäßmissbildung, Antikoagulanzien, Amyloidangiopathie • Risikofaktoren: Hypertonie (wichtigster), Vorhofflimmern, Diabetes, Rauchen, Hyperlipidämie, Alter, Übergewicht, Pille + Rauchen",
s:"Plötzlich einsetzend: halbseitige Lähmung (Hemiparese) und/oder Gefühlsstörung, hängender Mundwinkel • Sprachstörung (Aphasie), verwaschene Sprache (Dysarthrie) • Sehstörung (Gesichtsfeldausfall, Doppelbilder) • Schwindel, Gangunsicherheit, Schluckstörung • Bewusstseinsstörung • Blutung: zusätzlich starker Kopfschmerz, Erbrechen • FAST-Test: Face (Lächeln), Arms (beide Arme heben), Speech (Satz nachsprechen), Time (sofort 112)",
l:"Plötzliche Halbseitenlähmung, Sprachstörung, hängender Mundwinkel (FAST)",
ko:"Bleibende Behinderung, Pflegebedürftigkeit • Hirnödem, Einklemmung • Aspirationspneumonie (Schluckstörung) • Thrombose, Dekubitus • Epilepsie • Depression, Demenz • Rezidiv • Tod",
dd:"Hypoglykämie (immer BZ messen!) • TIA • Migräne mit Aura • epileptischer Anfall mit Todd'scher Parese • Hirntumor • Subduralhämatom • Fazialisparese (peripher) • Intoxikation • Konversionsstörung",
b:"BZ (Ausschluss Hypoglykämie!) • Gerinnung, Blutbild, Elektrolyte, Kreatinin • CT/MRT sofort (Blutung oder Infarkt?) • EKG (Vorhofflimmern), Duplex der Halsgefäße",
nf:2,nfm:"112 sofort (Lyse nur innerhalb 4,5 Std.!) • Uhrzeit des Symptombeginns notieren • Oberkörper 30° hoch, bewusstlos: stabile Seitenlage auf die gelähmte Seite • BZ messen • nichts essen/trinken (Schluckstörung) • Blutdruck NICHT senken • Vitalzeichen, beruhigen"},

{n:"Transitorische ischämische Attacke (TIA)",a:"TIA, Mini-Schlaganfall, Amaurosis fugax",k:"nerven",
d:"Vorübergehende neurologische Ausfälle durch Durchblutungsstörung des Gehirns, die sich vollständig zurückbilden (meist < 1 Std.) ohne Infarktnachweis in der Bildgebung. Warnsignal für Schlaganfall!",
u:"Wie ischämischer Schlaganfall: Mikroembolien aus Karotisplaques oder dem Herzen (Vorhofflimmern), Arteriosklerose",
s:"Wie Schlaganfall, aber vorübergehend: Halbseitensymptome, Sprachstörung, Gesichtsfeldausfall • Amaurosis fugax: plötzliche einseitige vorübergehende Erblindung („Vorhang fällt“) bei Karotisstenose",
l:"Vorübergehende Schlaganfallsymptome, die sich vollständig zurückbilden",
ko:"Schlaganfall (ca. 10 % in den ersten Tagen!)",
dd:"Schlaganfall (Symptome noch vorhanden = Schlaganfall) • Migräne mit Aura • fokaler Krampfanfall • Hypoglykämie • Synkope",
b:"Wie Schlaganfall: BZ, Gerinnung, Lipide • Duplex Karotiden, EKG/Langzeit-EKG, MRT",
nf:2,nfm:"Auch wenn die Symptome verschwunden sind: sofort 112/Stroke Unit – hohes Schlaganfallrisiko"},

{n:"Subarachnoidalblutung (SAB)",a:"Hirnaneurysmablutung",k:"nerven",
d:"Blutung in den mit Liquor gefüllten Subarachnoidalraum, meist durch Ruptur eines Hirnbasisaneurysmas.",
u:"Rupturiertes Aneurysma (~85 %) • Gefäßmissbildung (AV-Malformation), Trauma • Risikofaktoren: Hypertonie, Rauchen, Alkohol, familiär, Zystennieren • Auslöser: Pressen, körperliche Anstrengung, Geschlechtsverkehr",
s:"Plötzlicher, schlagartiger, nie dagewesener „Vernichtungskopfschmerz“ (Donnerschlagkopfschmerz) • Nackensteifigkeit (Meningismus) • Übelkeit, Erbrechen • Lichtscheu • Bewusstseinsstörung bis Koma • Krampfanfälle • ggf. Hirnnervenausfälle (Okulomotoriusparese) • Warnblutung Tage vorher möglich (Kopfschmerz)",
l:"Schlagartiger, stärkster Kopfschmerz des Lebens + Nackensteife",
ko:"Nachblutung (hohe Letalität) • Vasospasmen → Hirninfarkt • Hydrozephalus • Hyponatriämie • Tod (~30–40 %)",
dd:"Meningitis (Fieber, langsamerer Beginn) • Migräne • Hirnblutung • hypertensive Krise • Sinusvenenthrombose • Clusterkopfschmerz",
b:"CT (in den ersten Std. sehr sensitiv) • Lumbalpunktion bei negativem CT: blutiger/xanthochromer Liquor • Angiografie (Aneurysma)",
nf:2,nfm:"112 • Oberkörper 30° hoch, absolute Ruhe, keine Anstrengung, nicht pressen • abdunkeln • bewusstlos: stabile Seitenlage • Vitalzeichen"},

{n:"Epidurales / subdurales Hämatom",a:"Hirnblutung nach Trauma, Schädel-Hirn-Trauma",k:"nerven",
d:"Epidural: arterielle Blutung (meist A. meningea media) zwischen Schädelknochen und harter Hirnhaut. Subdural: venöse Blutung (Brückenvenen) zwischen harter Hirnhaut und Arachnoidea – akut oder chronisch.",
u:"Epidural: Schädelfraktur (Schläfenbereich), junge Menschen • Akut subdural: schweres Schädel-Hirn-Trauma • Chronisch subdural: Bagatelltrauma bei älteren Menschen, Alkoholikern, unter Antikoagulation (Wochen später!)",
s:"Epidural: Bewusstlosigkeit → freies Intervall (Patient wach, wirkt gesund) → erneute Eintrübung binnen Stunden, gleichseitig weite lichtstarre Pupille (Anisokorie), gegenseitige Halbseitenlähmung, Bradykardie, Hypertonie (Cushing-Reflex) • Akut subdural: sofort bewusstlos, schwerer Verlauf • Chronisch subdural: schleichend über Wochen Kopfschmerz, Verwirrtheit, Wesensänderung, Gangstörung, Halbseitensymptome (wie Demenz!)",
l:"Kopfverletzung + freies Intervall + erneute Eintrübung mit Anisokorie (epidural); schleichende Verwirrtheit beim Älteren nach Sturz (chronisch subdural)",
ko:"Hirndruck, Einklemmung (Atemstillstand) • bleibende neurologische Schäden • Tod",
dd:"Schlaganfall • Hirnkontusion • Demenz (chronisch subdural!) • Intoxikation • Hypoglykämie",
b:"CT sofort • Gerinnung (Antikoagulanzien?)",
nf:2,nfm:"112 • Oberkörper 30° hoch (bei stabilem Kreislauf) • HWS-Verletzung bedenken • bewusstlos: stabile Seitenlage • Bewusstsein und Pupillen engmaschig kontrollieren • nach jeder Kopfverletzung auf Warnzeichen achten"},

{n:"Epilepsie",a:"Krampfleiden, Anfallsleiden, Grand Mal, Absence",k:"nerven",
d:"Chronische Erkrankung des Gehirns mit Neigung zu wiederholten, unprovozierten epileptischen Anfällen (abnorme, synchrone Entladungen von Nervenzellen). Fokal oder generalisiert.",
u:"Genetisch (idiopathisch) • strukturell: Narben nach Schlaganfall, Trauma, Tumor, Enzephalitis, Fehlbildungen, frühkindliche Hirnschäden • Gelegenheitsanfälle (provoziert): Fieber (Fieberkrampf bei Kleinkindern), Schlafentzug, Alkoholentzug, Hypoglykämie, Elektrolytstörung, Drogen, Flackerlicht",
s:"Generalisiert tonisch-klonischer Anfall (Grand Mal): ggf. Aura, Initialschrei, Bewusstlosigkeit, Sturz, tonische Phase (Streckkrampf, Zyanose), dann klonische Phase (rhythmische Zuckungen), Zungenbiss (seitlich), Einnässen, Speichelfluss • danach Nachschlaf, Verwirrtheit, Muskelkater, Kopfschmerz • Absence (Kinder): kurze Bewusstseinspause (Sekunden), starrer Blick, Lidflattern • fokal: Zuckungen einer Körperhälfte, Missempfindungen, Automatismen (Schmatzen, Nesteln), Bewusstsein erhalten oder gestört",
l:"Anfallsweise Bewusstlosigkeit mit Zuckungen, Zungenbiss, Einnässen, Nachschlaf",
ko:"Status epilepticus • Verletzungen (Sturz, Zungenbiss, Schulterluxation, Wirbelfraktur) • Aspiration • SUDEP (plötzlicher Tod) • Unfälle (Fahrverbot!) • soziale Folgen",
dd:"Synkope (kurz, wenige Zuckungen, rasche Reorientierung) • psychogener Anfall (Augen geschlossen, kein Zungenbiss, wechselnde Muster) • TIA • Hypoglykämie • Migräne • Narkolepsie",
b:"BZ, Elektrolyte (Na, Ca, Mg), Leber-/Nierenwerte • Alkohol/Drogen • CK, Prolaktin ↑ nach Anfall • EEG, MRT",
nf:1,nfm:"Im Anfall: Verletzungen vermeiden (Gegenstände wegräumen, Kopf polstern), NICHT festhalten, nichts zwischen die Zähne • Uhrzeit notieren • danach stabile Seitenlage • 112 bei: Anfall > 5 Min., Serie ohne Wiedererlangen des Bewusstseins, erster Anfall, Verletzung, Schwangerschaft, Atemstörung"},

{n:"Status epilepticus",a:"Anfallsstatus",k:"nerven",

{n:"Migräne",a:"Migräne mit/ohne Aura",k:"nerven",
d:"Anfallsartiger, meist einseitiger, pulsierender Kopfschmerz (4–72 Std.) mit Begleitsymptomen, mit oder ohne vorausgehende Aura.",
u:"Neurovaskuläre Störung (Aktivierung des trigeminovaskulären Systems, CGRP) • genetische Disposition, Frauen 3:1 • Trigger: Stress und Entspannung danach (Wochenend-Migräne), Schlafmangel/-überschuss, Hormonschwankungen (Menstruation), Alkohol (Rotwein), Hunger, Wetter, Licht, Lärm, bestimmte Nahrungsmittel",

{n:"Multiple Sklerose (MS)",a:"Encephalomyelitis disseminata",k:"nerven",

{n:"Morbus Parkinson",a:"Parkinson-Krankheit, Schüttellähmung, idiopathisches Parkinson-Syndrom",k:"nerven",

{n:"Demenz / Alzheimer-Krankheit",a:"Morbus Alzheimer, vaskuläre Demenz, Lewy-Körper-Demenz",k:"nerven",

{n:"Mumps",a:"Parotitis epidemica, Ziegenpeter",k:"infekt",

u:"Mumpsvirus • Tröpfchen- und Schmierinfektion (Speichel) • Inkubation 16–18 Tage (12–25) • ansteckend 7 Tage vor bis 9 Tage nach Parotisschwellung • ca. 30–40 % inapparent",
s:"Fieber, Kopfschmerz, Abgeschlagenheit • ein- oder (meist) beidseitige, schmerzhafte, teigige Schwellung der Ohrspeicheldrüse – abstehende Ohrläppchen („Hamsterbacken“) • Schmerzen beim Kauen und Schlucken, Ohrenschmerzen • Rötung der Ausführungsgangmündung (Stensen-Gang) an der Wangenschleimhaut • auch Unterkiefer- und Unterzungenspeicheldrüse",
l:"Schmerzhafte, meist beidseitige Ohrspeicheldrüsenschwellung mit abstehenden Ohrläppchen",
ko:"Orchitis (nach der Pubertät ~25 %, selten Sterilität) • Oophoritis • Meningitis (meist gutartig), Enzephalitis • Pankreatitis • Innenohrschwerhörigkeit/Taubheit (meist einseitig) • Abort im 1. Trimenon",
dd:"Bakterielle Parotitis • Speichelstein • Lymphadenitis colli • Parotistumor • Sjögren-Syndrom • andere Viren (EBV, Influenza, Coxsackie)",
b:"Amylase ↑ (Speicheldrüse), Lipase ↑ bei Pankreatitis • Mumps-IgM, PCR (Speichel, Rachenabstrich)",
nf:0,bv:BV6+" • zusätzlich § 7 (Mumpsvirus) und § 34 (Mumps)"},

{n:"Röteln",a:"Rubella, Rubeola",k:"infekt",
d:"Meist harmlose Virusinfektion (Rötelnvirus) mit feinfleckigem Exanthem und Lymphknotenschwellungen. Gefährlich in der Schwangerschaft (Rötelnembryopathie).",
u:"Rötelnvirus (Togavirus) • Tröpfcheninfektion • Inkubation 14–21 Tage • ansteckend 1 Woche vor bis 1 Woche nach Exanthembeginn • ~50 % inapparent • diaplazentare Übertragung",
s:"Leichtes Fieber, Schnupfen, Kopfschmerzen • Lymphknotenschwellung nuchal und retroaurikulär (hinter den Ohren, schmerzhaft – typisch!) • feinfleckiges, hellrotes, nicht konfluierendes Exanthem, beginnt im Gesicht und breitet sich über Rumpf und Extremitäten aus, verschwindet nach 1–3 Tagen • Arthralgien (v. a. junge Frauen) • Splenomegalie",
l:"Nuchale und retroaurikuläre Lymphknotenschwellung + feinfleckiges, nicht konfluierendes Exanthem",
ko:"Rötelnembryopathie (Gregg-Syndrom, v. a. im 1. Trimenon): Taubheit, Katarakt, Herzfehler (Gregg-Trias), geistige Behinderung, Abort • Arthritis • Thrombozytopenie • Enzephalitis (selten)",
dd:"Masern • Scharlach • Ringelröteln • Dreitagefieber • Mononukleose • Arzneimittelexanthem • Enteroviren",
b:"Röteln-IgM, IgG (Immunstatus in der Schwangerschaft), PCR • Leukopenie mit relativer Lymphozytose, Plasmazellen",
nf:0,bv:BV6+" • zusätzlich § 7 (Rubellavirus) und § 34 (Röteln) • Schwangere: sofort ärztlich abklären"},

{n:"Windpocken",a:"Varizellen, Wasserpocken, Spitze Blattern",k:"infekt",
d:"Hochansteckende Erstinfektion mit dem Varizella-Zoster-Virus (VZV, Herpesvirus) mit juckendem, bläschenförmigem Exanthem. Das Virus persistiert lebenslang und kann als Gürtelrose reaktivieren.",
u:"Varizella-Zoster-Virus • aerogen („Wind“-pocken) und Kontakt mit Bläscheninhalt (auch von Zoster-Patienten) • Inkubation 8–28 Tage (meist 14–16) • ansteckend 1–2 Tage vor Exanthem bis zur vollständigen Verkrustung (ca. 5–7 Tage)",
s:"Leichtes Fieber, Abgeschlagenheit • stark juckendes Exanthem in Schüben: rote Flecken → Papeln → Bläschen (wasserklar, „Tautropfen“) → Pusteln → Krusten • „Sternenhimmel“ (Heubner): alle Stadien gleichzeitig nebeneinander • beginnt an Rumpf und Gesicht, behaarte Kopfhaut und Schleimhäute mitbetroffen • Abheilung meist ohne Narben (außer Kratzen)",
l:"Juckendes Exanthem mit allen Stadien gleichzeitig (Sternenhimmel), inkl. behaarter Kopfhaut",
ko:"Bakterielle Superinfektion (Narben) • Pneumonie (v. a. Erwachsene, Schwangere, Raucher) • Zerebellitis (Ataxie), Enzephalitis • Reye-Syndrom (ASS bei Kindern!) • Schwangerschaft: konnatales Varizellensyndrom; perinatal: neonatale Varizellen (lebensbedrohlich) • Immunsuppression: schwere generalisierte Verläufe • später Herpes zoster",
dd:"Herpes simplex (generalisiert) • Hand-Fuß-Mund-Krankheit • Insektenstiche, Strophulus • Impetigo • Pocken (alle Stadien gleich!) • Mpox",
b:"Klinisch • VZV-PCR aus Bläscheninhalt • VZV-IgM/IgG",
nf:0,bv:BV6+" • zusätzlich § 7 (Varizella-Zoster-Virus) und § 34 (Windpocken)"},

{n:"Scharlach",a:"Scarlatina, Streptokokken-Angina",k:"infekt",
d:"Infektion mit β-hämolysierenden Streptokokken der Gruppe A (Streptococcus pyogenes), die ein erythrogenes Toxin bilden → Angina + typisches Exanthem. Mehrfache Erkrankung möglich (verschiedene Toxine).",
u:"Streptococcus pyogenes (Gruppe A) • Tröpfcheninfektion, selten Lebensmittel • Inkubation 2–4 Tage • Kinder 3–10 J. • ansteckend bis 24 Std. nach Beginn der Antibiotikatherapie (unbehandelt bis 3 Wochen)",
s:"Plötzlicher Beginn mit hohem Fieber, Schüttelfrost, Erbrechen • Tonsillopharyngitis (Angina): hochrote Tonsillen mit Belägen, Halsschmerzen, Schluckbeschwerden • Enanthem am Gaumen • Zunge: anfangs weiß belegt, dann Himbeer-/Erdbeerzunge (rot mit hervortretenden Papillen) • feinfleckiges, samtartig raues Exanthem („Sandpapier“), beginnt in Leisten und Achseln, Beugeseiten betont • periorale Blässe (Milchbart) bei geröteten Wangen • Pastia-Linien (Rötung in den Beugefalten) • nach 1–3 Wochen groblamelläre Schuppung an Handflächen und Fußsohlen",
l:"Angina + Himbeerzunge + feinfleckiges „Sandpapier“-Exanthem mit perioraler Blässe",
ko:"Lokal: Otitis media, Sinusitis, Peritonsillarabszess • toxischer Scharlach, Sepsis, Streptokokken-Toxic-Shock-Syndrom • Folgekrankheiten (1–5 Wochen später): rheumatisches Fieber, akute Glomerulonephritis, Chorea minor",
dd:"Virale Pharyngitis • Mononukleose (Pfeiffersches Drüsenfieber) • Diphtherie • Masern, Röteln • Kawasaki-Syndrom • Staphylokokken-Scharlach • Arzneimittelexanthem",
b:"Rachenabstrich: Streptokokken-Schnelltest, Kultur (Arzt) • Leukozytose mit Linksverschiebung, CRP ↑, Eosinophilie • ASL-Titer ↑ (später) • Urinstatus nach 2–3 Wochen (Glomerulonephritis)",
nf:0,bv:BV34+" („Scharlach oder sonstige Streptococcus-pyogenes-Infektionen“)"},

{n:"Keuchhusten",a:"Pertussis, Stickhusten",k:"infekt",
d:"Langwierige bakterielle Atemwegsinfektion durch Bordetella pertussis (Toxinbildner) mit typischen stakkatoartigen Hustenanfällen. Für Säuglinge lebensgefährlich.",
u:"Bordetella pertussis (selten parapertussis) • Tröpfcheninfektion, hochansteckend • Inkubation 7–20 Tage • keine lebenslange Immunität (auch nach Impfung) → Erwachsene als Infektionsquelle für Säuglinge",
s:"Stadium catarrhale (1–2 Wochen): Schnupfen, leichter Husten, kaum Fieber – am ansteckendsten • Stadium convulsivum (4–6 Wochen): anfallsartige, stakkatoartige Hustenattacken (v. a. nachts), Herausstrecken der Zunge, Zyanose, anschließend juchzendes inspiratorisches Ziehen („Reprise“), Hervorwürgen von zähem, glasigem Schleim, Erbrechen • zwischen den Anfällen beschwerdefrei • Stadium decrementi (6–10 Wochen): Abklingen • Säuglinge: Atemstillstände (Apnoen) statt Husten! • Erwachsene: oft nur langwieriger Husten",
l:"Stakkatoartige Hustenanfälle mit inspiratorischem Ziehen (Reprise) und Erbrechen",
ko:"Säuglinge: Apnoen, plötzlicher Tod • Pneumonie (häufigste Todesursache) • Otitis media • Enzephalopathie, Krampfanfälle (Hypoxie) • Hernien, Rippenfrakturen, Bindehautblutungen, Rektumprolaps durch Husten",
dd:"Bronchitis, Asthma • Fremdkörperaspiration • Mukoviszidose • Mykoplasmen, Adenoviren, RSV • Tuberkulose",
b:"Lymphozytose (ausgeprägt, Leukozytose bis 30.000/µl) • PCR aus Nasopharyngealabstrich (frühe Phase) • Antikörper (spätere Phase)",
nf:1,nfm:"Säuglinge mit Atempausen/Zyanose → 112.",
bv:BV6+" • zusätzlich § 7 (Bordetella pertussis/parapertussis) und § 34 (Keuchhusten)"},

{n:"Diphtherie",a:"Echter Krupp, Rachendiphtherie",k:"infekt",
d:"Lebensbedrohliche Infektion durch toxinbildende Corynebacterium diphtheriae mit Bildung von Pseudomembranen im Rachen und toxischer Schädigung von Herz und Nerven.",
u:"Corynebacterium diphtheriae (Diphtherietoxin) • Tröpfchen-, Kontakt-, Schmierinfektion • Inkubation 2–5 Tage • fehlender/unvollständiger Impfschutz",
s:"Rachendiphtherie: Halsschmerzen, mäßiges Fieber, ausgeprägtes Krankheitsgefühl • grau-weiße bis gelblich-bräunliche, festhaftende Pseudomembranen auf Tonsillen, über die Tonsillen hinausreichend, Blutung bei Ablösungsversuch • süßlich-fauliger Mundgeruch (Geruch nach Mäusen/Leim) • „Cäsarenhals“ (massive Lymphknotenschwellung und Ödem) • Kehlkopfdiphtherie (echter Krupp): bellender Husten, Heiserkeit bis Aphonie, inspiratorischer Stridor, Erstickungsgefahr • Nasendiphtherie (Säuglinge): blutig-seröser Schnupfen • Hautdiphtherie",
l:"Grau-weiße, festhaftende, blutende Pseudomembranen über die Tonsillen hinaus + süßlicher Mundgeruch",
ko:"Ersticken (Kehlkopfdiphtherie) • Myokarditis (Rhythmusstörungen, plötzlicher Herztod) • Polyneuritis (Gaumensegellähmung, Augenmuskel-, Atemlähmung) • Nierenschädigung • Tod",
dd:"Streptokokken-Angina • Mononukleose • Angina Plaut-Vincenti • Agranulozytose • Pseudokrupp, Epiglottitis",
b:"Rachenabstrich mit Kultur und Toxinnachweis (Arzt) • Leukozytose • EKG",
nf:2,nfm:"112 • Atemwege sichern, Oberkörper hoch • sofort Antitoxin und Antibiotika (Arzt) • Isolierung",
bv:BV6+" • zusätzlich § 7 (toxinbildendes C. diphtheriae) und § 34 (Diphtherie)"},

{n:"Ringelröteln",a:"Erythema infectiosum, Fünfte Krankheit, Parvovirus-B19-Infektion",k:"infekt",

b:"Parvovirus-B19-IgM/IgG, PCR • Retikulozyten ↓, Anämie",
nf:0},

{n:"Infektiöse Mononukleose",a:"Pfeiffersches Drüsenfieber, Kusskrankheit, EBV-Infektion",k:"infekt",

l:"Fieber + Angina + generalisierte Lymphknotenschwellung + Splenomegalie bei Jugendlichen",
ko:"Milzruptur (keine Kontaktsportarten für 4–6 Wochen!) • Atemwegsverlegung durch Tonsillenschwellung • Hepatitis • Meningoenzephalitis, Guillain-Barré • hämolytische Anämie, Thrombozytopenie • Myokarditis • chronisches Erschöpfungssyndrom • Assoziation mit Lymphomen (Burkitt, Hodgkin), Nasopharynxkarzinom, MS",
dd:"Streptokokken-Angina • Diphtherie • CMV, Toxoplasmose, akute HIV-Infektion („Mono-like“) • akute Leukämie • Lymphom • Röteln",
b:"Leukozytose mit Lymphozytose und atypischen, „pfeifferschen“ Lymphozyten (Virozyten) • Transaminasen ↑ • Mononukleose-Schnelltest (Paul-Bunnell), EBV-VCA-IgM, -IgG, EBNA-IgG (spät)",
nf:1,nfm:"Plötzliche linksseitige Oberbauchschmerzen mit Schock (Milzruptur) oder Atemnot (Tonsillenschwellung) → 112."},

{n:"Epiglottitis",a:"Kehldeckelentzündung, supraglottische Laryngitis",k:"infekt",
d:"Lebensbedrohliche, akute bakterielle Entzündung des Kehldeckels (Epiglottis) mit rascher Schwellung und Gefahr der Atemwegsverlegung. Früher v. a. Kleinkinder (2–6 J.), seit der Hib-Impfung selten.",
u:"Haemophilus influenzae Typ b (Hib) • bei Erwachsenen auch Streptokokken, Staphylokokken • fehlende Hib-Impfung",
s:"Rascher Beginn innerhalb von Stunden • hohes Fieber, schweres Krankheitsbild • starke Halsschmerzen, Schluckbeschwerden → Speichelfluss aus dem Mund (kann nicht schlucken) • kloßige Sprache („heiße Kartoffel“), kaum Husten (kein bellender Husten!) • inspiratorischer Stridor • Kind sitzt aufrecht, vorgeneigt, mit offenem Mund, ängstlich",
l:"Hochfieberndes Kind sitzt vorgebeugt, speichelt, kloßige Sprache, inspiratorischer Stridor",
ko:"Akute Atemwegsverlegung, Ersticken • Sepsis, Meningitis • Tod",
dd:"Pseudokrupp (langsamer, bellender Husten, weniger krank) • Fremdkörperaspiration • Peritonsillarabszess • Diphtherie • allergisches Glottisödem",
b:"Keine Diagnostik vor Ort, die das Kind aufregt! • Klinik: Leukozytose, CRP ↑, Blutkultur",
nf:2,nfm:"112 mit Hinweis auf Epiglottitis-Verdacht • Kind NICHT in den Rachen schauen, NICHT hinlegen, nicht aufregen • aufrecht auf dem Schoß der Eltern lassen • ggf. kühle Luft • Arzt-/Notarztbegleitung",
bv:"Haemophilus influenzae (invasiv) ist nach § 7 IfSG meldepflichtig; Hib-Meningitis in § 34 IfSG → Behandlungsverbot § 24 IfSG – unabhängig davon: Notfall!"}
);

{n:"Bakterielle Meningitis / Meningokokken",a:"Hirnhautentzündung, Meningokokken-Sepsis, Waterhouse-Friderichsen-Syndrom",k:"infekt",
