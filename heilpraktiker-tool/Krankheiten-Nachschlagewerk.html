dd:"Virale Meningitis (milder) • Subarachnoidalblutung • Enzephalitis • Migräne • Tetanus • Meningismus bei Pneumonie/Sepsis • HWS-Syndrom",
b:"Liquor: trüb, Zellzahl ↑↑ (Granulozyten, > 1000/µl), Eiweiß ↑, Glukose ↓, Laktat ↑ • Blutkulturen (vor Antibiose!) • Leukozytose, CRP/PCT ↑ • Gerinnung (DIC)",
nf:2,nfm:"112 sofort – jede Minute zählt (Antibiotika so schnell wie möglich) • Eigenschutz (Mundschutz) • Oberkörper leicht hoch, abdunkeln • Schockbekämpfung • Kontaktpersonen erhalten Chemoprophylaxe (Gesundheitsamt)",
bv:BV6+" (Meningokokken-Meningitis/-Sepsis) • zusätzlich § 7 (Neisseria meningitidis, Haemophilus influenzae, Listerien) und § 34 (Meningokokken-Infektion, Hib-Meningitis)"},

{n:"Enzephalitis / Virale Meningitis",a:"Gehirnentzündung, Herpes-Enzephalitis, aseptische Meningitis",k:"infekt",
d:"Entzündung des Gehirns (Enzephalitis) bzw. der Hirnhäute (virale Meningitis), meist viral. Herpes-simplex-Enzephalitis ist die häufigste schwere sporadische Form.",
u:"Viren: Herpes simplex, VZV, Enteroviren (Coxsackie, ECHO), FSME, Masern, Mumps, HIV, West-Nil, Tollwut • Bakterien: Borrelien, Listerien, Mykoplasmen, Tuberkulose • autoimmun (Anti-NMDA-Rezeptor) • Parasiten (Toxoplasmose bei AIDS)",
s:"Virale Meningitis: Fieber, Kopfschmerz, Meningismus, meist gutartig • Enzephalitis: Fieber, Kopfschmerz, Bewusstseinsstörung, Verwirrtheit, Wesensänderung, Halluzinationen, Krampfanfälle, Sprachstörung (Herpes: Temporallappen), Lähmungen",
l:"Fieber + Kopfschmerz + Verwirrtheit/Wesensänderung/Krampfanfall",
ko:"Hirnödem • bleibende neurologische Schäden (Gedächtnis, Epilepsie) • Tod (unbehandelte HSV-Enzephalitis bis 70 %)",
dd:"Bakterielle Meningitis • Hirnabszess • Schlaganfall, Hirnblutung • Delir, Intoxikation • septische Enzephalopathie • Psychose",
b:"Liquor: klar, lymphozytäre Pleozytose (< 1000/µl), Eiweiß leicht ↑, Glukose normal • PCR (HSV, VZV, Enteroviren) • MRT, EEG",
nf:2,nfm:"112 – Verdacht reicht für sofortige Klinik (Aciclovir schon bei Verdacht)",
bv:"Je nach Erreger § 7 IfSG (z. B. FSME, Masern, Mumps, VZV, Listerien, Enteroviren nicht immer) → Behandlungsverbot § 24 IfSG; unabhängig davon Notfall"},

{n:"Tetanus",a:"Wundstarrkrampf",k:"infekt",
d:"Lebensbedrohliche Infektionskrankheit durch das Neurotoxin (Tetanospasmin) von Clostridium tetani → Krämpfe der Skelettmuskulatur. Nicht von Mensch zu Mensch übertragbar.",
u:"Clostridium tetani (Sporen in Erde, Staub, Tierkot) • Eintrittspforte: auch kleinste, verschmutzte Wunden, Holzsplitter, Biss-, Stichwunden, Verbrennungen, Nabel (Neugeborene) • anaerobe Bedingungen • Inkubation 3 Tage–3 Wochen • fehlender Impfschutz (Auffrischung alle 10 Jahre!)",
s:"Prodromi: Unruhe, Schwitzen, Muskelziehen an der Wunde • Trismus (Kieferklemme) – oft erstes Zeichen • Risus sardonicus (starres „Teufelsgrinsen“) • Opisthotonus (Überstreckung des Rückens) • brettharte Bauch- und Rückenmuskulatur • schmerzhafte generalisierte Krampfanfälle bei vollem Bewusstsein, ausgelöst durch geringste Reize (Licht, Geräusche, Berührung) • Schluckstörung • vegetative Entgleisung (Schwitzen, Tachykardie, Blutdruckschwankungen, Fieber)",
l:"Kieferklemme (Trismus) + Risus sardonicus + Krämpfe bei vollem Bewusstsein nach Verletzung",
ko:"Atemlähmung (Glottis-, Zwerchfellkrampf) – häufigste Todesursache • Aspiration, Pneumonie • Wirbelfrakturen • Herzrhythmusstörungen • Letalität 10–20 % (ohne Intensivtherapie höher)",
dd:"Tollwut • Strychnin-Vergiftung • Meningitis • Tetanie (Hypokalzämie) • Epilepsie • Dystone Reaktion (Neuroleptika, Metoclopramid) • Kieferabszess",
b:"Klinische Diagnose • Erregernachweis aus der Wunde selten erfolgreich",
nf:2,nfm:"112 • Reizabschirmung (abdunkeln, Ruhe) • Atemwege sichern • Prophylaxe: bei jeder Verletzung Impfstatus prüfen → ggf. Simultanimpfung durch den Arzt",
bv:"Tetanus ist nicht nach IfSG meldepflichtig, aber lebensbedrohlicher Notfall → ausschließlich ärztliche/intensivmedizinische Behandlung"},

{n:"Tollwut",a:"Rabies, Lyssa",k:"infekt",
d:"Virale Enzephalitis durch das Rabiesvirus, übertragen durch Speichel infizierter Tiere. Nach Ausbruch fast immer tödlich – nur die sofortige Postexpositionsprophylaxe schützt.",
u:"Rabiesvirus (Lyssavirus) • Biss, Kratzen, Belecken verletzter Haut/Schleimhaut durch infizierte Tiere (Hund – weltweit, Fledermäuse, Füchse; Deutschland gilt als frei von terrestrischer Tollwut, Fledermaustollwut kommt vor) • Inkubation 3–8 Wochen (Tage bis Jahre), je nach Entfernung der Bissstelle zum ZNS",
s:"Prodromalstadium: Brennen, Jucken, Schmerzen an der Bissstelle, Fieber, Kopfschmerz, Übelkeit • Exzitationsstadium (rasende Wut): Hydrophobie (Schlundkrämpfe beim Anblick/Hören von Wasser), Aerophobie, Speichelfluss (kann nicht schlucken), Unruhe, Aggressivität, Halluzinationen, Krämpfe • Paralytisches Stadium (stille Wut): aufsteigende Lähmungen, Koma, Tod durch Atemlähmung",
l:"Hydrophobie, Schlundkrämpfe und Erregung Wochen nach einem Tierbiss",
ko:"Tod (nahezu 100 % nach Symptombeginn)",
dd:"Tetanus • Enzephalitis anderer Ursache • Guillain-Barré (paralytische Form) • Delirium tremens • Vergiftung",
b:"PCR aus Speichel, Liquor, Hautbiopsie (Nacken) • Antikörper",
nf:2,nfm:"Nach JEDEM Biss/Kontakt mit tollwutverdächtigem Tier: Wunde sofort 15 Min. mit Seife/Wasser spülen, desinfizieren → sofort Arzt (Postexpositionsprophylaxe: Impfung + Immunglobulin) • bei Symptomen 112",
bv:BV6+" • Tollwutverdacht ist bereits bei Verletzung durch ein tollwutverdächtiges Tier meldepflichtig (§ 6 Abs. 1 Nr. 4) • zusätzlich § 7 (Rabiesvirus)"},

{n:"Botulismus",a:"Lebensmittel-/Wurstvergiftung durch Botulinumtoxin",k:"infekt",
d:"Lebensbedrohliche Vergiftung durch das Neurotoxin von Clostridium botulinum (stärkstes bekanntes Gift) → Hemmung der Acetylcholinfreisetzung → absteigende schlaffe Lähmungen.",
u:"Lebensmittelbotulismus: selbst eingemachte, ungenügend erhitzte Konserven (Bohnen, Fleisch, Fisch), vakuumverpackte Ware, bombierte Dosen • Säuglingsbotulismus: Honig (< 1 Jahr kein Honig!) • Wundbotulismus (Drogenabhängige) • Inkubation 12–36 Std. (Stunden bis Tage)",
s:"Kein Fieber, Bewusstsein erhalten • Augensymptome zuerst: Doppelbilder, verschwommenes Sehen, Ptosis, weite lichtstarre Pupillen, Akkommodationsstörung • Mundtrockenheit, Schluck- und Sprechstörungen • absteigende, symmetrische, schlaffe Lähmungen (Kopf → Arme → Rumpf → Beine) • Atemlähmung • Obstipation, Harnverhalt • ggf. anfangs Übelkeit, Erbrechen, Durchfall • Säugling: Trinkschwäche, Obstipation, „floppy infant“",
l:"Doppelbilder, Ptosis, Mundtrockenheit, Schluckstörung und absteigende Lähmung ohne Fieber nach Konservenverzehr",
ko:"Atemlähmung (Tod) • Aspirationspneumonie • monatelange Erholung",
dd:"Myasthenia gravis • Guillain-Barré (aufsteigend) • Schlaganfall im Hirnstamm • Atropin-/Pilzvergiftung • Diphtherie • Zeckenparalyse",
b:"Toxinnachweis in Serum, Stuhl, Mageninhalt, Lebensmittelresten (Tierversuch/Labor) • EMG",
nf:2,nfm:"112 • Atemüberwachung, ggf. Beatmung • Lebensmittelreste sicherstellen • Antitoxin so früh wie möglich (Arzt)",
bv:BV6+" • zusätzlich § 7 (Clostridium botulinum/Toxinnachweis)"},

{n:"Salmonellose (Enteritis)",a:"Salmonellen-Gastroenteritis, Lebensmittelvergiftung",k:"infekt",
d:"Akute Darminfektion durch Enteritis-Salmonellen (v. a. S. Enteritidis, S. Typhimurium). Häufige bakterielle Lebensmittelinfektion. (Typhus/Paratyphus siehe eigener Eintrag.)",
u:"Salmonella enterica (Enteritis-Serovare) • kontaminierte Lebensmittel: rohe/nicht durchgegarte Eier und Eierspeisen (Tiramisu, Mayonnaise), Geflügel, Hackfleisch, Rohmilch • Unterbrechung der Kühlkette • Inkubation 6–72 Std. (meist 12–36) • Dauerausscheider möglich",
s:"Plötzlicher Beginn • wässrige Durchfälle (selten blutig) • Übelkeit, Erbrechen • krampfartige Bauchschmerzen • Fieber, Kopfschmerzen • Dauer meist wenige Tage",
l:"Akuter Brechdurchfall mit Fieber 12–36 Std. nach Eier-/Geflügelspeise",
ko:"Exsikkose (v. a. Säuglinge, Ältere), Elektrolytentgleisung, Nierenversagen • Bakteriämie, Sepsis (Immunschwache) • Osteomyelitis, Endokarditis, Abszesse • reaktive Arthritis • Dauerausscheidung",
dd:"Andere bakterielle Gastroenteritiden (Campylobacter, Shigellen, Yersinien, EHEC) • Noro-/Rotavirus • Staphylokokken-Toxin (Inkubation 1–6 Std.) • Typhus • Appendizitis • chronisch-entzündliche Darmerkrankung",
b:"Stuhlkultur/PCR • Blutkultur bei Fieber • Elektrolyte, Kreatinin",
nf:1,nfm:"Starke Austrocknung (Säuglinge, Ältere), Kreislaufschwäche, blutige Durchfälle mit hohem Fieber → Arzt/112.",
bv:BVGE+" • Salmonellen = § 7 IfSG • Tätigkeitsverbot im Lebensmittelbereich (§ 42)"},

{n:"Typhus / Paratyphus",a:"Typhus abdominalis, Bauchtyphus",k:"infekt",
d:"Systemische Infektion durch Salmonella Typhi (Typhus) bzw. S. Paratyphi A, B, C (Paratyphus, milder). Meist aus Endemiegebieten (Südasien, Afrika) eingeschleppt.",
u:"Salmonella Typhi/Paratyphi • nur Mensch als Reservoir • fäkal-oral: kontaminiertes Wasser und Lebensmittel, Dauerausscheider (Gallenblase) • Inkubation 7–21 Tage (Typhus), 1–10 Tage (Paratyphus)",
s:"1. Woche: langsamer, treppenförmiger Fieberanstieg auf 40 °C, Kopfschmerzen, Benommenheit (typhos = Nebel), Bauchschmerzen, Obstipation (!), Husten • 2.–3. Woche: Fieberkontinua (40 °C), relative Bradykardie (Puls trotz Fieber langsam!), Roseolen (blassrote Flecken an der Bauchhaut), grau-gelb belegte Zunge mit freien Rändern („Typhuszunge“), Splenomegalie, Bewusstseinstrübung, dann erbsbreiartige Durchfälle",
l:"Treppenförmig ansteigendes Fieber + relative Bradykardie + Roseolen + Benommenheit nach Tropenreise",
ko:"Darmblutung, Darmperforation (3. Woche) • Peritonitis • Myokarditis • Osteomyelitis • Dauerausscheider (Gallenblase) • Tod (unbehandelt 10–20 %)",
dd:"Malaria (!) • Dengue • Sepsis • Brucellose • Tuberkulose • Rickettsiosen • Hepatitis • Lymphome",
b:"Blutkulturen (1. Woche), Stuhl- und Urinkultur (ab 2. Woche) • Leukopenie mit Linksverschiebung, Aneosinophilie (!) • Transaminasen ↑",
nf:1,nfm:"Hohes Fieber nach Tropenreise immer sofort ärztlich abklären (Malaria/Typhus!). Bauchschmerzen mit Abwehrspannung (Perforation) → 112.",
bv:BV6+" • zusätzlich § 7 (Salmonella Typhi/Paratyphi) und § 34 (Typhus, Paratyphus)"},

{n:"Shigellose",a:"Bakterielle Ruhr, Shigellenruhr",k:"infekt",
d:"Akute Darminfektion durch Shigellen mit blutig-schleimigen Durchfällen (Dysenterie). Sehr niedrige Infektionsdosis (10–100 Keime).",
u:"Shigella dysenteriae, flexneri, boydii, sonnei • fäkal-oral: Schmierinfektion (Gemeinschaftseinrichtungen), kontaminiertes Wasser und Lebensmittel, sexuell (MSM) • Reisen • Inkubation 1–4 Tage",
s:"Hohes Fieber • wässrige, dann blutig-schleimige Durchfälle (kleine Mengen, häufig) • schmerzhafter Stuhldrang (Tenesmen) • krampfartige Bauchschmerzen • Übelkeit, Erbrechen • Exsikkose",
l:"Blutig-schleimige Durchfälle mit Tenesmen und hohem Fieber",
ko:"Exsikkose, Schock • HUS (Shiga-Toxin, S. dysenteriae Typ 1) • Darmperforation, toxisches Megakolon • reaktive Arthritis • Krampfanfälle bei Kindern",
dd:"Amöbenruhr • Campylobacter, Salmonellen, EHEC • Colitis ulcerosa • ischämische Kolitis",
b:"Stuhlkultur/PCR • Leukozytose, CRP ↑ • Elektrolyte, Kreatinin",
nf:1,nfm:"Starke Austrocknung, Schock, Blutarmut, Urinmenge ↓ (HUS) → 112.",
bv:BV7+" (Shigellen) • zusätzlich § 34 (Shigellose) und § 6 Abs. 1 Nr. 2"},

{n:"EHEC-Infektion / HUS",a:"Enterohämorrhagische E. coli, hämolytisch-urämisches Syndrom",k:"infekt",
d:"Darminfektion durch Shiga-Toxin-bildende E. coli (EHEC/STEC). Gefürchtete Komplikation: hämolytisch-urämisches Syndrom (HUS) mit akutem Nierenversagen, v. a. bei Kindern.",
u:"EHEC (z. B. O157:H7, O104:H4) • Reservoir: Wiederkäuer (Rinder) • rohes/ungenügend gegartes Rindfleisch (Hackfleisch, Burger), Rohmilch, kontaminiertes Gemüse/Sprossen, Tierkontakt (Streichelzoo), Mensch zu Mensch • sehr niedrige Infektionsdosis • Inkubation 2–10 Tage",
s:"Wässrige, dann oft blutige Durchfälle • krampfartige Bauchschmerzen • Übelkeit, Erbrechen • meist wenig Fieber • HUS (5–10 Tage später, v. a. Kinder < 5 J.): Trias aus hämolytischer Anämie (Blässe, Ikterus), Thrombozytopenie (Petechien), akutem Nierenversagen (Oligurie/Anurie, Ödeme, Hypertonie) • neurologisch: Krampfanfälle, Bewusstseinsstörung",
l:"Blutige Durchfälle ohne hohes Fieber – danach Blässe, Petechien und abnehmende Urinmenge (HUS)",
ko:"HUS mit dialysepflichtigem Nierenversagen • chronische Niereninsuffizienz • neurologische Schäden, Schlaganfall • Tod",
dd:"Andere infektiöse Kolitiden • Colitis ulcerosa • ischämische Kolitis • Invagination (Kinder) • TTP",
b:"Stuhl: Shiga-Toxin-Nachweis, PCR, Kultur • HUS: Hb ↓, Fragmentozyten, LDH ↑, Haptoglobin ↓, Thrombozyten ↓, Kreatinin/Harnstoff ↑ • Coombs-Test negativ",
nf:1,nfm:"Blässe, verminderte Urinmenge, Petechien, Krampfanfall → 112 (HUS). Keine Motilitätshemmer (Loperamid)!",
bv:BV6+" (enteropathisches HUS) • zusätzlich § 7 (EHEC) und § 34 (Enteritis durch EHEC)"},

{n:"Norovirus-Gastroenteritis",a:"Noro, Magen-Darm-Grippe, Winter-Erbrechen",k:"infekt",
d:"Häufigste Ursache viraler Gastroenteritis bei Erwachsenen; hochansteckend, Ausbrüche in Gemeinschaftseinrichtungen, Kliniken, Kreuzfahrtschiffen.",
u:"Norovirus (Calicivirus) • fäkal-oral, aerogen (Erbrochenes-Aerosole), Schmierinfektion, kontaminierte Lebensmittel • extrem niedrige Infektionsdosis (10–100 Viren) • umweltresistent • Inkubation 6–50 Std. • Saisonalität: Oktober–März",
s:"Plötzlicher Beginn • schwallartiges, heftiges Erbrechen • starke wässrige Durchfälle • Übelkeit, Bauchkrämpfe • Kopf-, Muskelschmerzen, Mattigkeit • leichtes oder kein Fieber • Dauer 12–48 Std.",
l:"Plötzliches schwallartiges Erbrechen und Durchfall, kurz und heftig, oft mehrere Fälle gleichzeitig",
ko:"Exsikkose, Elektrolytstörung (Säuglinge, Ältere) • Kreislaufkollaps • Nierenversagen",
dd:"Rotavirus • bakterielle Lebensmittelvergiftung (Staph. aureus, Bacillus cereus) • Salmonellen • Appendizitis",
b:"Norovirus-PCR/Antigen im Stuhl • Elektrolyte, Kreatinin",
nf:1,nfm:"Starke Austrocknung bei Säuglingen/Älteren, Kreislaufschwäche, Verwirrtheit → Arzt/112.",
bv:BVGE+" • Norovirus = § 7 IfSG"},

{n:"Rotavirus-Gastroenteritis",a:"Rotavirus-Infektion",k:"infekt",
d:"Häufigste Ursache schwerer Durchfallerkrankungen bei Säuglingen und Kleinkindern (6 Monate–2 Jahre). Impfung (Schluckimpfung) empfohlen.",
u:"Rotavirus (Reovirus) • fäkal-oral, Schmierinfektion • sehr ansteckend • Inkubation 1–3 Tage • Saisonalität: Winter/Frühjahr",
s:"Wässrige Durchfälle (übelriechend) • Erbrechen • Fieber • Bauchschmerzen • Dauer 2–6 Tage • Atemwegssymptome möglich",
l:"Wässriger Brechdurchfall mit Fieber bei Säuglingen und Kleinkindern",
ko:"Dehydratation (eingesunkene Fontanelle, trockene Schleimhäute, stehende Hautfalten, Apathie, wenig nasse Windeln) • Elektrolytentgleisung • Krampfanfälle",
dd:"Norovirus, Adenovirus • bakterielle Enteritis • Harnwegsinfekt, Otitis (Säuglinge erbrechen bei Infekten) • Invagination",
b:"Rotavirus-Antigen im Stuhl • Elektrolyte, BZ",
nf:1,nfm:"Säugling mit Zeichen der Austrocknung oder Apathie → sofort Arzt/Klinik.",
bv:BVGE+" • Rotavirus = § 7 IfSG"},

{n:"Campylobacter-Enteritis",a:"Campylobacteriose",k:"infekt",
d:"Häufigste meldepflichtige bakterielle Darminfektion in Deutschland.",
u:"Campylobacter jejuni/coli • Geflügelfleisch (ungenügend gegart, Kreuzkontamination über Schneidebrett), Rohmilch, Trinkwasser, Haustiere • Inkubation 2–5 Tage",
s:"Fieber, Kopf- und Gliederschmerzen (oft vor dem Durchfall) • wässrige, teils blutige Durchfälle • krampfartige, z. T. heftige Bauchschmerzen (DD Appendizitis!) • Dauer bis 7 Tage",
l:"Fieber und kolikartige Bauchschmerzen mit (blutigem) Durchfall nach Geflügel",
ko:"Guillain-Barré-Syndrom (Wochen später!) • reaktive Arthritis • Exsikkose • Bakteriämie",
dd:"Salmonellen, Shigellen, Yersinien, EHEC • Appendizitis • chronisch-entzündliche Darmerkrankung",
b:"Stuhlkultur/PCR • Leukozytose, CRP ↑",
nf:0,bv:BVGE+" • Campylobacter = § 7 IfSG"},

{n:"Listeriose",a:"Listerien-Infektion",k:"infekt",
d:"Infektion durch Listeria monocytogenes; für Gesunde meist harmlos, gefährlich für Schwangere (Fetus!), Neugeborene, Ältere und Immunsupprimierte.",
u:"Listeria monocytogenes (vermehrt sich auch im Kühlschrank!) • Rohmilchkäse, Weichkäse, Räucherfisch (Lachs), rohes Fleisch, Wurst, abgepackte Salate • diaplazentar • Inkubation bis 70 Tage",
s:"Gesunde: grippeähnlich, Fieber, Muskelschmerzen, ggf. Durchfall • Schwangere: grippeähnliche Symptome, Harnwegsinfekt-artig → Infektion des Kindes • Immunschwache/Ältere: Sepsis, Meningitis/Meningoenzephalitis (Rhombenzephalitis: Hirnnervenausfälle) • Neugeborene: Sepsis, Atemnot, Meningitis, Granulomatosis infantiseptica",
l:"Grippeähnliche Symptome bei Schwangeren bzw. Meningitis bei Älteren/Immunschwachen nach Rohmilchkäse",
ko:"Abort, Totgeburt, Frühgeburt, neonatale Listeriose (hohe Letalität) • Meningoenzephalitis, Sepsis • Tod",
dd:"Grippaler Infekt, Influenza • andere Meningitiden • Sepsis",
b:"Blutkultur, Liquorkultur, PCR • Plazenta/Fruchtwasser",
nf:1,nfm:"Fieber in der Schwangerschaft immer ärztlich abklären. Meningitiszeichen → 112.",
bv:BV7+" (Listeria monocytogenes)"},

{n:"Legionellose",a:"Legionärskrankheit, Pontiac-Fieber",k:"infekt",
d:"Infektion durch Legionellen über kontaminierte Wasseraerosole: schwere atypische Pneumonie (Legionärskrankheit) oder grippeähnliches Pontiac-Fieber.",
u:"Legionella pneumophila • warmes stehendes Wasser 25–55 °C: Duschen, Warmwasseranlagen, Klimaanlagen, Whirlpools, Kühltürme • Inhalation von Aerosolen (keine Mensch-zu-Mensch-Übertragung!) • Risikofaktoren: Alter, Rauchen, Immunschwäche, Diabetes • Inkubation 2–10 Tage",
s:"Legionärskrankheit: hohes Fieber, Schüttelfrost, trockener Husten, Atemnot, Thoraxschmerzen • Kopfschmerzen, Verwirrtheit • Durchfall, Bauchschmerzen • relative Bradykardie • Pontiac-Fieber: grippeähnlich, ohne Pneumonie, selbstlimitierend",
l:"Schwere Pneumonie mit Durchfall und Verwirrtheit nach Hotel-/Reiseaufenthalt",
ko:"Respiratorische Insuffizienz • Nierenversagen • Multiorganversagen • Tod (10–15 %)",
dd:"Andere Pneumonien (Pneumokokken, Mykoplasmen) • Influenza, COVID-19 • Q-Fieber, Ornithose",
b:"Legionellen-Antigen im Urin (Schnelltest) • PCR, Kultur aus Sputum/BAL • Hyponatriämie, CK ↑, Transaminasen ↑, Hämaturie • Röntgen",
nf:1,nfm:"Atemnot, Verwirrtheit → 112.",
bv:BV7+" (Legionella spp.)"},

{n:"Cholera",a:"Vibrio-cholerae-Infektion",k:"infekt",
d:"Schwere Durchfallerkrankung durch das Toxin von Vibrio cholerae mit massivem Flüssigkeitsverlust. In Deutschland nur importiert.",
u:"Vibrio cholerae (O1, O139) • kontaminiertes Trinkwasser, Meeresfrüchte • schlechte Hygiene (Flüchtlingslager, Katastrophengebiete) • Inkubation Stunden bis 5 Tage",
s:"Oft mild oder symptomlos • schwer: plötzlich massive, schmerzlose, wässrige „Reiswasserstühle“ (bis 20 l/Tag) • Erbrechen • kein Fieber • rasche Exsikkose: Wadenkrämpfe, stehende Hautfalten, eingesunkene Augen („Facies cholerica“), Waschfrauenhände, heisere Stimme (Vox cholerica), Anurie • Schock, Untertemperatur",
l:"Massive reiswasserartige Durchfälle ohne Fieber mit rascher Austrocknung",
ko:"Hypovolämischer Schock • akutes Nierenversagen • Hypokaliämie, Azidose • Tod (unbehandelt bis 50 %, behandelt < 1 %)",
dd:"ETEC (Reisediarrhö) • andere schwere Gastroenteritiden • Pilzvergiftung",
b:"Stuhlkultur, Mikroskopie (Vibrionen) • Elektrolyte, Kreatinin, Azidose",
nf:2,nfm:"112 • Flüssigkeit und Elektrolyte (orale Rehydratationslösung, solange möglich) • Schockbekämpfung",
bv:BV6+" • zusätzlich § 7 (Vibrio cholerae) und § 34 (Cholera)"},

{n:"Poliomyelitis",a:"Kinderlähmung, Polio",k:"infekt",
d:"Infektion mit Polioviren, die in seltenen Fällen die motorischen Vorderhornzellen des Rückenmarks zerstört → schlaffe Lähmungen. Durch Impfung in Europa eliminiert.",
u:"Poliovirus Typ 1–3 (Enterovirus) • fäkal-oral, Tröpfchen • Inkubation 3–35 Tage • > 90 % inapparent • Impfpolio (früher Schluckimpfung)",
s:"Abortive Form: Fieber, Halsschmerzen, Übelkeit, Durchfall • nichtparalytisch: aseptische Meningitis • paralytisch (< 1 %): nach kurzer Besserung (Dromedarkurve) asymmetrische, schlaffe Lähmungen (meist Beine) ohne Sensibilitätsstörung, Muskelschmerzen, Reflexverlust • bulbär: Schluck-, Atemlähmung",
l:"Asymmetrische schlaffe Lähmungen ohne Gefühlsstörung nach fieberhaftem Infekt",
ko:"Bleibende Lähmungen, Muskelatrophie, Skelettdeformitäten • Atemlähmung • Post-Polio-Syndrom (Jahrzehnte später)",
dd:"Guillain-Barré (symmetrisch, sensibel) • andere Enteroviren (EV-D68, EV-A71) • Botulismus • Querschnittsmyelitis",
b:"Virusnachweis im Stuhl, Rachenabstrich, Liquor (PCR) • Liquor: lymphozytäre Pleozytose",
nf:2,nfm:"112 • Atemüberwachung",
bv:BV6+" (jede akute schlaffe Lähmung gilt als Verdacht!) • zusätzlich § 7 (Poliovirus) und § 34 (Poliomyelitis)"},

{n:"Sepsis",a:"Blutvergiftung, septischer Schock, Urosepsis",k:"infekt",
d:"Lebensbedrohliche Organfunktionsstörung durch eine fehlregulierte Immunantwort des Körpers auf eine Infektion. Septischer Schock: zusätzlich Kreislaufversagen.",
u:"Ausgangsherd: Pneumonie (häufigste), Harnwege (Urosepsis), Bauchraum (Peritonitis, Cholangitis), Haut/Weichteile, Katheter, Endokarditis, Meningitis • Erreger: Bakterien (E. coli, Staph. aureus, Pneumokokken, Meningokokken), Pilze • Risikofaktoren: Alter, Immunschwäche, Diabetes, Splenektomie, Chemotherapie, Katheter",
s:"Fieber oder Untertemperatur, Schüttelfrost • Tachykardie • Tachypnoe (Atemfrequenz ≥ 22/min) • Blutdruckabfall (systolisch ≤ 100 mmHg) • Verwirrtheit, Bewusstseinsveränderung (qSOFA: 2 von 3 → Verdacht) • marmorierte, kalte oder warme gerötete Haut • verminderte Urinmenge • schweres Krankheitsgefühl („so krank war ich noch nie“) • Petechien (Meningokokken)",
l:"Infekt + schneller Puls + schnelle Atmung + Verwirrtheit/Blutdruckabfall",
ko:"Septischer Schock • Multiorganversagen (ARDS, Nierenversagen, Leberversagen) • DIC • Tod (septischer Schock ~40 %) • Langzeitfolgen (Post-Sepsis-Syndrom)",
dd:"Andere Schockformen • Lungenembolie • Pankreatitis • Thyreotoxische Krise • Hitzschlag • Anaphylaxie",
b:"Laktat ↑ (> 2 mmol/l) • Leukozytose oder Leukopenie, CRP und PCT ↑↑ • Thrombozyten ↓, Gerinnung (DIC) • Kreatinin, Bilirubin ↑ • Blutkulturen (vor Antibiose)",
nf:2,nfm:"112 („Verdacht auf Sepsis“) • jede Stunde Verzögerung der Antibiose erhöht die Sterblichkeit • Schocklage (bei Atemnot Oberkörper hoch) • Vitalzeichen • Wärmeerhalt"},

{n:"Pest",a:"Beulenpest, Lungenpest",k:"infekt",
d:"Hochgefährliche bakterielle Zoonose durch Yersinia pestis. Heute v. a. in Teilen Afrikas (Madagaskar, Kongo), Asiens, Amerikas.",
u:"Yersinia pestis • Reservoir: Nagetiere (Ratten) • Übertragung durch Rattenflöhe (Beulenpest), Tröpfchen (Lungenpest – von Mensch zu Mensch!) • Inkubation 2–7 Tage (Lungenpest 1–3)",
s:"Beulenpest: hohes Fieber, Schüttelfrost, extrem schmerzhafte, geschwollene Lymphknoten (Bubonen, v. a. Leiste), die einschmelzen können • Pestsepsis: Schock, Hautblutungen, Nekrosen („Schwarzer Tod“) • Lungenpest: schwere Pneumonie mit blutigem Auswurf, Atemnot",
l:"Hohes Fieber + extrem schmerzhafte Lymphknotenbeulen nach Aufenthalt in Endemiegebiet",
ko:"Sepsis, DIC, Schock • Lungenpest • Tod (unbehandelt Lungenpest ~100 %)",
dd:"Tularämie • Lymphadenitis anderer Ursache • Katzenkratzkrankheit • Sepsis",
b:"Erregernachweis aus Bubonenpunktat, Blut, Sputum (Speziallabor)",
nf:2,nfm:"112 mit Infektionsverdacht • Isolation, Eigenschutz (Atemschutz)",
bv:BV6+" • zusätzlich § 7 (Yersinia pestis) und § 34 (Pest)"},

{n:"Milzbrand",a:"Anthrax",k:"infekt",
d:"Zoonose durch Bacillus anthracis (Sporenbildner). Haut-, Lungen-, Darm- oder Injektionsmilzbrand. Potenzieller Bioterror-Erreger.",
u:"Bacillus anthracis (Sporen jahrzehntelang im Boden überlebensfähig) • Kontakt mit infizierten Tieren/Tierprodukten (Felle, Wolle, Häute), Inhalation von Sporen, kontaminiertes Fleisch, verunreinigtes Heroin • keine Mensch-zu-Mensch-Übertragung • Inkubation Stunden bis 7 Tage (Lunge bis 60 Tage)",
s:"Hautmilzbrand (~95 %): juckende Papel → Bläschen → schmerzloses Geschwür mit schwarzem Schorf (Pustula maligna), ausgeprägtes Ödem • Lungenmilzbrand: grippeähnlich, dann schwerste Atemnot, Schock (mediastinale Lymphknoten) • Darmmilzbrand: Übelkeit, blutiges Erbrechen/Durchfall",
l:"Schmerzloses Hautgeschwür mit schwarzem Schorf und Ödem nach Kontakt mit Tierprodukten",
ko:"Sepsis, Meningitis • Tod (Lungenmilzbrand unbehandelt nahezu 100 %)",
dd:"Insektenstich • Furunkel, Ekthyma • Orf • Pest, Tularämie • Pneumonie",
b:"Erregernachweis (Abstrich, Blut) im Speziallabor",
nf:2,nfm:"112/Gesundheitsamt • Isolation, Eigenschutz",
bv:BV6+" • zusätzlich § 7 (Bacillus anthracis)"}
);

D.push(
{n:"HIV-Infektion / AIDS",a:"Humanes Immundefizienz-Virus, erworbenes Immundefektsyndrom",k:"sti",
d:"Chronische Infektion mit dem HI-Virus (Retrovirus), das CD4-Helferzellen zerstört → fortschreitender Immundefekt. AIDS = Endstadium mit opportunistischen Infektionen und Tumoren. Unter Therapie (ART) normale Lebenserwartung; unter Nachweisgrenze nicht ansteckend (U = U).",
u:"HIV-1 (weltweit), HIV-2 (Westafrika) • Übertragung: ungeschützter Geschlechtsverkehr (häufigste), Blut (gemeinsame Spritzen, Nadelstich), Mutter → Kind (Schwangerschaft, Geburt, Stillen) • nicht über Alltagskontakte, Speichel, Insekten • Inkubation akute Infektion 2–6 Wochen",
s:"Akute HIV-Infektion (2–6 Wochen): Mononukleose-ähnlich – Fieber, Lymphknotenschwellung, Pharyngitis, makulopapulöses Exanthem, Gliederschmerzen, Durchfall • Latenzphase (Jahre): symptomlos, ggf. generalisierte Lymphadenopathie • Symptomatische Phase: Nachtschweiß, Gewichtsverlust, Durchfall, Fieber, Mundsoor, orale Haarleukoplakie, Herpes zoster, rezidivierende Infekte • AIDS (CD4 < 200/µl): Pneumocystis-Pneumonie, zerebrale Toxoplasmose, Soorösophagitis, CMV-Retinitis, Tuberkulose, Kryptokokken-Meningitis, Kaposi-Sarkom, Lymphome, HIV-Enzephalopathie, Wasting-Syndrom",
l:"Unklare Lymphknotenschwellung, Gewichtsverlust, Mundsoor und opportunistische Infektionen",
ko:"Opportunistische Infektionen und Tumoren • HIV-assoziierte Demenz • Tod (unbehandelt) • Nebenwirkungen der ART",
dd:"Mononukleose, CMV, Toxoplasmose • Lymphom • Tuberkulose • andere Immundefekte • Tumorkachexie",
b:"HIV-Suchtest (Antikörper + p24-Antigen, 4. Generation; diagnostisches Fenster ~6 Wochen) • Bestätigungstest (Immunoblot), Viruslast (PCR) • CD4-Zellzahl ↓, CD4/CD8-Quotient ↓ • Lymphopenie",
nf:0,bv:"§ 24 IfSG i. V. m. § 7 Abs. 3 IfSG (HIV – nichtnamentliche Labormeldung) und STI → Behandlung und Testung nur durch Ärzte"},

{n:"Syphilis",a:"Lues, harter Schanker",k:"sti",
d:"Chronische, stadienhaft verlaufende Infektionskrankheit durch Treponema pallidum, sexuell übertragbar. Gut mit Penicillin behandelbar.",
u:"Treponema pallidum (Spirochäte) • sexuell (Schleimhautkontakt), diaplazentar (Lues connata), selten Blut • Inkubation ~3 Wochen (10–90 Tage) • ansteckend v. a. im Stadium I und II",
s:"Stadium I (Primäraffekt, ~3 Wochen nach Infektion): schmerzloses, derbes Geschwür (Ulcus durum, harter Schanker) an der Eintrittsstelle (Genitale, Anus, Mund), schmerzlose regionale Lymphknotenschwellung, heilt spontan in 4–6 Wochen • Stadium II (Generalisation, 2–3 Monate): Fieber, Abgeschlagenheit, generalisierte Lymphknotenschwellung, nicht juckendes Exanthem (Roseola syphilitica) auch an Handflächen und Fußsohlen (!), Condylomata lata (nässende Papeln), Plaques muqueuses (Mund), mottenfraßartiger Haarausfall • Latenzphase (Jahre, symptomlos) • Stadium III (Tertiär, Jahre–Jahrzehnte): Gummen (Granulome in Haut, Knochen, Organen), kardiovaskuläre Syphilis (Mesaortitis, Aortenaneurysma) • Stadium IV (Neurosyphilis): Tabes dorsalis (Hinterstrang: Gangataxie, einschießende Schmerzen, Argyll-Robertson-Pupille), progressive Paralyse (Demenz, Psychose)",
l:"Schmerzloses, hartes Genitalgeschwür (I) bzw. Exanthem inkl. Handflächen/Fußsohlen (II)",
ko:"Neurosyphilis • Aortenaneurysma • Lues connata (Abort, Totgeburt; Hutchinson-Trias: Tonnenzähne, Keratitis, Innenohrschwerhörigkeit; Sattelnase, Säbelscheidentibia) • erhöhtes HIV-Übertragungsrisiko",
dd:"Herpes genitalis (schmerzhaft) • Ulcus molle (schmerzhaft, weich) • Lymphogranuloma venereum • Morbus Behçet • Pityriasis rosea, Arzneimittelexanthem (Stadium II) • Psoriasis",
b:"TPHA/TPPA (Suchtest, bleibt lebenslang positiv) • VDRL/RPR (Aktivität, Verlaufskontrolle) • FTA-ABS, Treponema-IgM (frische/behandlungsbedürftige Infektion) • Dunkelfeldmikroskopie, PCR aus Primäraffekt • Liquor bei Neurosyphilis • HIV-Test",
nf:0,bv:"§ 24 IfSG i. V. m. § 7 Abs. 3 (Treponema pallidum) und STI → Behandlungsverbot"},

{n:"Gonorrhoe",a:"Tripper",k:"sti",
d:"Sexuell übertragbare Infektion durch Neisseria gonorrhoeae (Gonokokken) mit eitriger Entzündung von Harnröhre, Gebärmutterhals, Rektum, Rachen oder Auge.",
u:"Neisseria gonorrhoeae • sexuell (vaginal, anal, oral), perinatal (Neugeborenen-Konjunktivitis) • Inkubation 2–7 Tage • zunehmende Antibiotikaresistenzen",
s:"Mann: eitriger, gelb-grünlicher Ausfluss aus der Harnröhre („Bonjour-Tropfen“ morgens), Brennen und Schmerzen beim Wasserlassen • Frau: oft symptomarm (~50 %), Ausfluss, Brennen beim Wasserlassen, Zwischenblutungen, Unterbauchschmerzen • Rektal: Juckreiz, Ausfluss, Schmerzen • Pharyngeal: meist symptomlos, Halsschmerzen • Neugeborene: eitrige Konjunktivitis (Gonoblennorrhoe) → Erblindungsgefahr",
l:"Eitriger Ausfluss aus der Harnröhre mit Brennen beim Wasserlassen",
ko:"Mann: Epididymitis, Prostatitis, Harnröhrenstriktur, Infertilität • Frau: aufsteigende Infektion (PID, Adnexitis, Salpingitis) → Sterilität, Extrauteringravidität, chronische Unterbauchschmerzen • disseminierte Gonokokkeninfektion (Arthritis, Hautläsionen, Endokarditis) • Konjunktivitis, Erblindung (Neugeborene)",
dd:"Chlamydien-Urethritis (oft Koinfektion) • Trichomoniasis • Harnwegsinfekt • Mykoplasmen-Urethritis",
b:"NAAT/PCR (Urin, Abstriche – Arzt) • Mikroskopie (gramnegative Diplokokken in Granulozyten) • Kultur mit Resistenztestung • Test auf weitere STI (Chlamydien, HIV, Syphilis)",
nf:0,bv:BVSTI+" • zusätzlich § 7 Abs. 3 IfSG (Neisseria gonorrhoeae, nichtnamentlich)"},

{n:"Chlamydien-Infektion",a:"Chlamydia trachomatis (Serovare D–K), Lymphogranuloma venereum (L1–L3)",k:"sti",
d:"Häufigste bakterielle sexuell übertragbare Infektion in Europa. Oft symptomlos – wichtigste vermeidbare Ursache weiblicher Unfruchtbarkeit.",
u:"Chlamydia trachomatis (obligat intrazellulär) • sexuell, perinatal • Inkubation 1–3 Wochen • Risiko: junge Frauen < 25 J. (Screening empfohlen), wechselnde Partner",
s:"Frau: meist symptomlos (~70 %), ggf. Ausfluss, Zervizitis, Brennen beim Wasserlassen, Zwischen-/Kontaktblutungen, Unterbauchschmerzen • Mann: Urethritis mit glasigem, spärlichem Ausfluss, Brennen beim Wasserlassen, oft symptomlos • Rektal, Konjunktivitis (Schwimmbad-Konjunktivitis) • Neugeborene: Konjunktivitis, Pneumonie • LGV (L1–L3): schmerzlose Papel, dann schmerzhafte Leistenlymphknoten (Bubonen), Proktitis",
l:"Oft symptomlos; ggf. Brennen beim Wasserlassen und Ausfluss",
ko:"Frau: aufsteigende Infektion (Adnexitis/PID) → Tubensterilität, Extrauteringravidität, chronische Unterbauchschmerzen, Perihepatitis (Fitz-Hugh-Curtis) • Mann: Epididymitis, Prostatitis • reaktive Arthritis (Reiter-Syndrom) • Frühgeburt",
dd:"Gonorrhoe • Harnwegsinfekt • Trichomoniasis • Mykoplasmen • bakterielle Vaginose",
b:"NAAT/PCR (Erststrahlurin, Abstrich – Arzt) • Test auf weitere STI",
nf:0,bv:BVSTI+" • LGV (Serovare L1–L3) zusätzlich § 7 Abs. 3"},

{n:"Herpes genitalis",a:"Genitalherpes, HSV-2-Infektion",k:"sti",
d:"Sexuell übertragene Infektion mit Herpes-simplex-Virus Typ 2 (zunehmend auch Typ 1) mit schmerzhaften Bläschen im Genitalbereich und Rezidiven.",
u:"HSV-2 (auch HSV-1 durch Oralverkehr) • Schleimhautkontakt, auch bei symptomlosen Trägern • Inkubation 2–12 Tage • Persistenz in sakralen Ganglien, Reaktivierung durch Stress, Menstruation, Immunschwäche",
s:"Erstinfektion: gruppierte, sehr schmerzhafte Bläschen und Erosionen an Vulva, Vagina, Zervix bzw. Penis, Anus • Brennen, Juckreiz, Dysurie (Harnverhalt möglich) • Fieber, Kopf- und Gliederschmerzen • schmerzhafte Leistenlymphknoten • Rezidive meist milder, Prodromi (Kribbeln)",
l:"Schmerzhafte, gruppierte Bläschen im Genitalbereich",
ko:"Herpes neonatorum (lebensbedrohlich bei Geburt während florider Infektion!) • Meningitis, Harnverhalt (Radikulitis) • erhöhtes HIV-Risiko • psychische Belastung durch Rezidive",
dd:"Syphilis (schmerzlos) • Ulcus molle • Candida-Vulvitis • Zoster • Morbus Behçet • Trauma",
b:"HSV-PCR aus Bläschengrund (Arzt) • Serologie",
nf:0,bv:BVSTI},

{n:"Condylomata acuminata / HPV",a:"Feigwarzen, Genitalwarzen, Humane Papillomviren",k:"sti",
d:"Gutartige Warzen im Genital- und Analbereich durch Niedrigrisiko-HPV (Typ 6, 11). Hochrisiko-HPV (16, 18 u. a.) verursachen Zervix-, Anal-, Penis- und Oropharynxkarzinome.",
u:"Humane Papillomviren • sexueller Haut-/Schleimhautkontakt (auch Kondom schützt nicht vollständig) • Inkubation Wochen bis Monate • Impfung (9-valent) für Mädchen und Jungen 9–14 J.",
s:"Kleine, weißliche bis hautfarbene oder bräunliche Papeln, später blumenkohl- oder hahnenkammartige Wucherungen an Vulva, Vagina, Penis (Vorhaut, Eichel), Harnröhre, Anus, Damm • meist schmerzlos, ggf. Juckreiz, Brennen, Blutung, Fluor • Hochrisiko-HPV: meist symptomlos (Pap-Abstrich)",
l:"Blumenkohlartige Warzen im Genital-/Analbereich",
ko:"Zervixkarzinom (Hochrisiko-HPV) und Vorstufen (CIN) • Analkarzinom, Penis-, Vulva-, Oropharynxkarzinom • Rezidive • Riesenkondylome (Buschke-Löwenstein)",
dd:"Condylomata lata (Syphilis II) • Mollusca contagiosa • Fibrome, Hautanhängsel • Hirsuties papillaris penis (Perlenkranz) • Karzinom",
b:"Klinisch, Essigsäuretest • HPV-Test, Pap-Abstrich (Zervix) • Biopsie bei Malignitätsverdacht • Test auf andere STI",
nf:0,bv:BVSTI},

{n:"Trichomoniasis",a:"Trichomonaden-Infektion",k:"sti",
d:"Sexuell übertragene Infektion durch den Parasiten (Flagellat) Trichomonas vaginalis.",
u:"Trichomonas vaginalis • sexuell • Inkubation 4–28 Tage",
s:"Frau: reichlicher, gelb-grünlicher, schaumiger, übelriechender Ausfluss, Juckreiz und Brennen an Vulva und Vagina, Dysurie, Kolpitis mit Erdbeerzervix (punktförmige Rötungen) • Mann: meist symptomlos, ggf. Urethritis",
l:"Gelb-grünlicher, schaumiger, übelriechender Ausfluss",
ko:"Frühgeburt, vorzeitiger Blasensprung • erhöhtes HIV-Risiko • Prostatitis",

{n:"Mpox",a:"Affenpocken, Monkeypox",k:"sti",
d:"Virale Zoonose (Orthopockenvirus) mit Fieber und pockenähnlichem Hautausschlag; seit 2022 weltweite Ausbrüche, v. a. durch sexuelle Kontakte.",
u:"Mpox-Virus (Orthopoxvirus, Klade I und II) • enger Haut-/Schleimhautkontakt mit Läsionen, sexueller Kontakt, Tröpfchen bei engem Kontakt, kontaminierte Textilien, Tierkontakt (Afrika) • Inkubation 5–21 Tage",
s:"Fieber, Kopf-, Muskel-, Rückenschmerzen, Abgeschlagenheit • ausgeprägte Lymphknotenschwellung (DD Windpocken) • Hautläsionen: Flecken → Papeln → Bläschen → Pusteln (genabelt) → Krusten, alle im gleichen Stadium (Unterschied zu Windpocken) • Genital-, Anal-, Mundbereich, Gesicht, Handflächen, Fußsohlen • Proktitis mit Schmerzen",
l:"Fieber + Lymphknotenschwellung + gleichförmige pustulöse Hautläsionen (oft genital/anal)",

b:"PCR aus Läsionsmaterial (Arzt)",

);

D.push(
{n:"Malaria",a:"Wechselfieber, Malaria tropica/tertiana/quartana",k:"infekt",
d:"Durch Anopheles-Mücken übertragene Infektion mit Plasmodien (Einzeller), die Leberzellen und Erythrozyten befallen. Malaria tropica (P. falciparum) ist lebensbedrohlich.",
u:"Plasmodium falciparum (M. tropica), P. vivax/ovale (M. tertiana, Rezidive durch Hypnozoiten in der Leber), P. malariae (M. quartana), P. knowlesi • Stich der weiblichen Anophelesmücke (dämmerungs-/nachtaktiv) in Tropen und Subtropen • selten Transfusion, diaplazentar • Inkubation: tropica 7–15 Tage, tertiana 12–18 Tage (bis Monate/Jahre), quartana 18–40 Tage",
s:"Fieber (jedes Fieber nach Tropenaufenthalt ist bis zum Beweis des Gegenteils Malaria!) • Schüttelfrost, Schweißausbrüche • Kopf-, Glieder-, Rückenschmerzen • Übelkeit, Erbrechen, Durchfall • Splenomegalie, Hepatomegalie • Anämie, Ikterus • Fieberrhythmus: tertiana jeden 3. Tag (48-Std.-Rhythmus), quartana jeden 4. Tag (72-Std.), tropica unregelmäßig • Komplizierte Malaria tropica: Bewusstseinsstörung, Krampfanfälle (zerebrale Malaria), Atemnot, Nierenversagen, Schock, Hypoglykämie",
l:"Fieber mit Schüttelfrost nach Aufenthalt in Malariagebiet",
ko:"Zerebrale Malaria, Koma • schwere Anämie, Hämolyse („Schwarzwasserfieber“) • akutes Nierenversagen • Lungenödem/ARDS • Hypoglykämie • Schock, DIC • Milzruptur • Tod (unbehandelte M. tropica)",
dd:"Influenza (!) • Dengue • Typhus • Sepsis • Hepatitis • Leptospirose • Meningitis • Amöbenleberabszess",
b:"Dicker Tropfen und Blutausstrich (Plasmodien in Erythrozyten) – sofort, ggf. wiederholt • Malaria-Schnelltest • Thrombozytopenie (fast immer), Anämie, LDH ↑, Bilirubin ↑, Haptoglobin ↓ • BZ, Kreatinin, Laktat",
nf:2,nfm:"Fieber nach Tropenreise → noch am selben Tag ärztliche Abklärung (Notaufnahme) • bei Bewusstseinsstörung, Atemnot, Krampfanfall → 112",
bv:"§ 24 IfSG i. V. m. § 7 Abs. 3 IfSG (Plasmodium spp., nichtnamentliche Labormeldung) → Behandlungsverbot"},

{n:"Dengue-Fieber",a:"Dengue, Knochenbrecherfieber",k:"infekt",
d:"Durch Aedes-Mücken übertragene Virusinfektion in den Tropen/Subtropen; häufigste importierte Viruserkrankung bei Reisenden. Schwere Form: Dengue mit Warnzeichen/hämorrhagisches Fieber.",
u:"Dengue-Virus (Flavivirus, 4 Serotypen) • Stich der tagaktiven Aedes-Mücke (Gelbfiebermücke, Tigermücke) • Zweitinfektion mit anderem Serotyp → Risiko schwerer Verlauf • Inkubation 3–14 Tage",
s:"Plötzliches hohes Fieber (oft biphasisch) • starke Kopfschmerzen, Schmerzen hinter den Augen • heftige Muskel-, Gelenk- und Knochenschmerzen („Knochenbrecherfieber“) • makulopapulöses Exanthem (oft beim zweiten Fieberanstieg, „Inseln von Weiß im Meer von Rot“) • Übelkeit, Erbrechen • Warnzeichen: Bauchschmerzen, anhaltendes Erbrechen, Schleimhautblutungen, Unruhe/Lethargie, Lebervergrößerung, Flüssigkeitsansammlungen",
l:"Hohes Fieber + Retroorbitalschmerz + starke Gliederschmerzen nach Tropenreise",
ko:"Schweres Dengue: Plasmaleck, Schock (Dengue-Schock-Syndrom), Blutungen, Organversagen",
dd:"Malaria (!) • Chikungunya, Zika • Influenza, COVID-19 • Typhus • Leptospirose • Masern, Röteln",
b:"NS1-Antigen, PCR (frühe Phase), Dengue-IgM/IgG • Leukopenie, Thrombozytopenie, Hkt ↑ (Plasmaleck) • Transaminasen ↑",
nf:1,nfm:"Warnzeichen (Bauchschmerz, Erbrechen, Blutungen, Lethargie) oder Schock → 112. Kein ASS/Ibuprofen (Blutungsgefahr).",
bv:"§ 24 IfSG i. V. m. § 7 (Dengue-Virus) und § 6 (virusbedingtes hämorrhagisches Fieber) → Behandlungsverbot"},

{n:"Virusbedingtes hämorrhagisches Fieber",a:"Ebola, Marburg, Lassa, Krim-Kongo-Fieber, Gelbfieber",k:"infekt",
d:"Gruppe schwerer Virusinfektionen mit Fieber, Blutungsneigung und Multiorganversagen; hohe Letalität. Hochkontagiös (Ebola, Marburg, Lassa) – Behandlung nur in Sonderisolierstationen.",
u:"Ebola-, Marburg-Virus (Filoviren: Kontakt mit Körperflüssigkeiten, Fledermäuse, Affen) • Lassa-Virus (Ausscheidungen von Nagetieren, Westafrika) • Krim-Kongo-Virus (Zecken) • Gelbfieber (Aedes-Mücke, Impfung!) • Dengue (schwer) • Inkubation 2–21 Tage",
s:"Plötzliches hohes Fieber, starkes Krankheitsgefühl, Kopf- und Muskelschmerzen • Halsschmerzen, Erbrechen, Durchfall, Bauchschmerzen • Exanthem • Blutungen: Haut (Petechien), Schleimhäute, Magen-Darm, Einstichstellen • Schock, Organversagen • Gelbfieber: zusätzlich Ikterus, Nierenversagen, „schwarzes Erbrechen“",
l:"Fieber + Blutungen nach Aufenthalt in Endemiegebiet oder Kontakt zu Erkrankten",
ko:"Hämorrhagischer Schock, DIC, Multiorganversagen • Tod (Ebola bis 90 %)",
dd:"Malaria (!) • Typhus • Meningokokkensepsis • Leptospirose • Dengue • Rickettsiosen",
b:"Nur in Speziallabor (BSL-4): PCR • Thrombozytopenie, Leukopenie, Transaminasen ↑, Gerinnungsstörung",
nf:2,nfm:"112 mit Hinweis auf Verdacht • Patient isolieren, kein Körperkontakt, Eigenschutz • Gesundheitsamt sofort informieren",
bv:BV6+" • zusätzlich § 7 (Ebola-, Marburg-, Lassa-, Gelbfieber-, Krim-Kongo-, Dengue-Virus) und § 34 (virusbedingtes hämorrhagisches Fieber)"},

{n:"FSME",a:"Frühsommer-Meningoenzephalitis, Zeckenenzephalitis",k:"infekt",
d:"Durch Zecken übertragene Virusinfektion, die zu Hirnhaut-, Gehirn- und Rückenmarkentzündung führen kann. Risikogebiete v. a. Süddeutschland (Bayern, Baden-Württemberg), Österreich, Osteuropa. Impfung möglich.",
u:"FSME-Virus (Flavivirus) • Stich der Schildzecke (Ixodes ricinus, „Holzbock“) – Übertragung sofort beim Stich • selten Rohmilch von Ziegen/Schafen • Inkubation 7–14 Tage • 70–95 % symptomlos",
s:"Zweiphasiger Verlauf: 1. Phase: grippeähnlich (Fieber, Kopf-, Gliederschmerzen) für einige Tage • fieberfreies Intervall (~1 Woche) • 2. Phase (~10–30 %): erneutes Fieber und Meningitis (Kopfschmerz, Nackensteife), Meningoenzephalitis (Bewusstseinsstörung, Lähmungen, Sprachstörung, Krampfanfälle) oder Meningoenzephalomyelitis (schlaffe Lähmungen, v. a. Schulter/Arme, Atemlähmung)",
l:"Zweigipfliges Fieber mit Meningitis/Enzephalitis nach Zeckenstich im Risikogebiet",
ko:"Bleibende Lähmungen, Konzentrationsstörung, Epilepsie • Atemlähmung • Tod (~1 %, bei Älteren höher)",
dd:"Borreliose (Neuroborreliose) • andere virale Meningitiden • bakterielle Meningitis • Influenza (1. Phase)",
b:"FSME-IgM und -IgG im Serum und Liquor • Liquor: lymphozytäre Pleozytose • Leukopenie in Phase 1",
nf:1,nfm:"Meningitis-/Enzephalitiszeichen (Kopfschmerz, Nackensteife, Verwirrtheit, Lähmung) → 112.",
bv:BV7+" (FSME-Virus)"},

{n:"Lyme-Borreliose",a:"Zecken-Borreliose, Lyme-Krankheit, Erythema migrans",k:"infekt",
d:"Häufigste durch Zecken übertragene Infektionskrankheit in Europa, verursacht durch Borrelia burgdorferi sensu lato. Bundesweit vorkommend (keine Impfung).",
u:"Borrelia burgdorferi s. l. (Spirochäten) • Stich der Schildzecke (Ixodes ricinus) – Übertragungsrisiko steigt mit Saugdauer (> 12–24 Std.) → Zecke rasch entfernen • Inkubation Erythema migrans 3–30 Tage",
s:"Frühe lokalisierte Infektion: Erythema migrans – sich ringförmig ausbreitende Rötung (> 5 cm) um die Stichstelle mit zentraler Abblassung, Tage bis Wochen nach dem Stich; grippeähnliche Symptome • Borrelien-Lymphozytom (Ohrläppchen, Brustwarze, bläulich-rote Schwellung, Kinder) • Frühe disseminierte Infektion (Wochen–Monate): Neuroborreliose (Bannwarth-Syndrom: brennende, nächtliche radikuläre Schmerzen, Fazialisparese – auch beidseitig, Meningitis), Karditis (AV-Block), multiple Erythema migrans • Späte Infektion (Monate–Jahre): Lyme-Arthritis (Kniegelenk, mono-/oligoartikulär, schubweise), Acrodermatitis chronica atrophicans (blau-rote, später pergamentartig dünne Haut an Extremitäten), chronische Neuroborreliose",
l:"Sich ausbreitende ringförmige Rötung (Erythema migrans) nach Zeckenstich",
ko:"Neuroborreliose mit bleibenden Schäden • AV-Block III° • chronische Arthritis • Acrodermatitis",
dd:"Insektenstichreaktion (< 5 cm, rasch rückläufig) • Erysipel • Tinea corporis • FSME • andere Arthritiden • Fazialisparese anderer Ursache • Bandscheibenvorfall (radikuläre Schmerzen)",
b:"Erythema migrans: klinische Diagnose, KEINE Serologie nötig • Borrelien-IgM/IgG (ELISA + Immunoblot) – Antikörper können nach Infektion lange persistieren • Liquor: Pleozytose, intrathekale Antikörperbildung (Neuroborreliose) • Gelenkpunktat-PCR • EKG",
nf:0,bv:"Nicht bundesweit meldepflichtig (kein § 7 IfSG), aber in mehreren Bundesländern (z. B. Bayern, Sachsen, Brandenburg, Berlin) nach Landesverordnung meldepflichtig → dort gilt nach überwiegender Auffassung ebenfalls Behandlungsverbot. Antibiotikatherapie ist ohnehin ärztlich. Prüfungsrelevant: landesrechtliche Regelung beachten!"},

{n:"Toxoplasmose",a:"Toxoplasma-gondii-Infektion",k:"infekt",
d:"Weltweit verbreitete parasitäre Infektion durch den Einzeller Toxoplasma gondii (Endwirt: Katze). Bei Gesunden meist harmlos; gefährlich bei Erstinfektion in der Schwangerschaft und bei Immunschwäche.",
u:"Toxoplasma gondii • Aufnahme von Oozysten aus Katzenkot (Katzenklo, Gartenarbeit, ungewaschenes Gemüse) oder Gewebszysten in rohem/ungenügend gegartem Fleisch (Schwein, Lamm, Mett) • diaplazentar bei Erstinfektion in der Schwangerschaft • Reaktivierung bei Immunschwäche (AIDS)",
s:"Gesunde: meist symptomlos (> 80 %) oder Lymphknotenschwellung (v. a. Nacken), leichtes Fieber, Müdigkeit (Mononukleose-ähnlich) • Konnatale Toxoplasmose: Abort, Hydrozephalus, intrazerebrale Verkalkungen, Retinochorioiditis (klassische Trias), geistige Behinderung, Spätschäden am Auge • Immunschwäche: zerebrale Toxoplasmose (Kopfschmerz, Fieber, Krampfanfälle, Herdsymptome)",
l:"Meist symptomlos; Nackenlymphknotenschwellung – Gefahr für das Ungeborene",
ko:"Fetale Schädigung, Abort • Retinochorioiditis (Erblindung) • zerebrale Toxoplasmose bei AIDS",
dd:"Mononukleose, CMV • Lymphom • HIV • andere Ursachen von Lymphknotenschwellungen",
b:"Toxoplasma-IgG/IgM, Aviditätstest (Zeitpunkt der Infektion) • PCR (Fruchtwasser, Liquor) • CT/MRT (zerebral)",
nf:0,bv:"Konnatale Toxoplasmose: § 7 Abs. 3 IfSG → Behandlungsverbot (§ 24) • Schwangere mit Verdacht immer an Arzt verweisen"},

{n:"Echinokokkose",a:"Hundebandwurm (zystisch), Fuchsbandwurm (alveolär)",k:"infekt",
d:"Infektion des Menschen (Fehlzwischenwirt) mit den Larven des Hunde- (Echinococcus granulosus) oder Fuchsbandwurms (E. multilocularis) → Zysten bzw. tumorartiges Wachstum v. a. in der Leber.",
u:"E. granulosus: Aufnahme von Eiern aus Hundekot (Mittelmeerraum, Osteuropa) • E. multilocularis: Eier aus Fuchs-/Hunde-/Katzenkot, ungewaschene Waldbeeren, Pilze, Fallobst (Süddeutschland, Schwäbische Alb) • Inkubation Monate bis Jahre (alveolär 5–15 Jahre)",
s:"Lange symptomlos • zystisch: Druckgefühl rechter Oberbauch, Lebervergrößerung, Ikterus, Lungenzysten (Husten, Hämoptyse) • alveolär: infiltratives, tumorähnliches Wachstum in der Leber, Oberbauchschmerz, Ikterus, Gewichtsverlust, Metastasierung (Lunge, Gehirn)",
l:"Raumforderung der Leber mit Oberbauchbeschwerden, Kontakt zu Hunden/Füchsen",
ko:"Zystenruptur → anaphylaktischer Schock, Streuung • Cholangitis, Leberversagen • alveolär: unbehandelt hohe Letalität",
dd:"Leberzysten, Leberabszess • Leberzellkarzinom, Metastasen • Hämangiom",
b:"Echinococcus-Serologie • Eosinophilie • Leberwerte (Cholestase) • Sonografie, CT/MRT",
nf:0,bv:"§ 24 IfSG i. V. m. § 7 Abs. 3 (Echinococcus spp., nichtnamentlich) → Behandlungsverbot"},

{n:"Q-Fieber",a:"Query-Fieber, Coxiellose",k:"infekt",
d:"Zoonose durch Coxiella burnetii, v. a. über Staub von Schafen/Ziegen übertragen.",
u:"Coxiella burnetii • Inhalation von kontaminiertem Staub (Geburtsprodukte von Schafen, Ziegen, Rindern; Schafherden, Lammzeit), Rohmilch, Zecken • Inkubation 2–3 Wochen • ~50 % symptomlos",
s:"Plötzliches hohes Fieber, starke Kopfschmerzen (retroorbital), Muskelschmerzen • atypische Pneumonie (trockener Husten) • Hepatitis • Chronisch: Endokarditis (Monate–Jahre später, v. a. bei Herzklappenfehlern), Q-Fieber-Müdigkeitssyndrom",
l:"Hohes Fieber, starke Kopfschmerzen und atypische Pneumonie nach Kontakt zu Schafen",
ko:"Endokarditis • Hepatitis • Abort, Frühgeburt • chronisches Erschöpfungssyndrom",
dd:"Influenza • Mykoplasmen-/Legionellen-Pneumonie • Ornithose • Hepatitis",
b:"Coxiella-Serologie (Phase-I/II-Antikörper), PCR • Transaminasen ↑, Thrombozytopenie",
nf:0,bv:BV7+" (Coxiella burnetii)"},

{n:"Leptospirose",a:"Morbus Weil, Feldfieber, Schlammfieber",k:"infekt",
d:"Weltweit vorkommende Zoonose durch Leptospiren, übertragen über Urin infizierter Tiere (v. a. Ratten).",
u:"Leptospira interrogans • Kontakt von Haut/Schleimhäuten mit Urin infizierter Tiere oder kontaminiertem Wasser/Schlamm (Kanalarbeiter, Landwirte, Wassersportler, Überschwemmungen, Tropenreisen) • Inkubation 7–12 Tage (2–30)",
s:"Biphasisch: 1. septische Phase: plötzliches hohes Fieber, Schüttelfrost, heftige Muskelschmerzen (v. a. Waden!), Kopfschmerzen, Konjunktivitis (Augenrötung ohne Eiter) • 2. Immunphase: Meningitis, Uveitis • Morbus Weil (schwer): Ikterus, Nierenversagen, Blutungen (Lunge!), Myokarditis",
l:"Hohes Fieber + Wadenschmerzen + Konjunktivitis nach Kontakt mit Süßwasser/Ratten",
ko:"Morbus Weil: Leber- und Nierenversagen, Lungenblutung • Tod (bis 20 %)",
dd:"Influenza • Malaria, Dengue • Hepatitis • Hantavirus • Sepsis",
b:"Leptospiren-Serologie (MAT), PCR (Blut, Urin) • Leukozytose, Thrombozytopenie, CK ↑, Bilirubin ↑, Kreatinin ↑",
nf:1,nfm:"Ikterus, verminderte Urinmenge, Blutungen → 112.",
bv:BV7+" (Leptospira interrogans)"},

{n:"Hantavirus-Infektion",a:"Nephropathia epidemica, hämorrhagisches Fieber mit renalem Syndrom",k:"infekt",
d:"Durch Nagetiere (in Deutschland v. a. Rötelmaus) übertragene Virusinfektion mit Fieber und Nierenbeteiligung.",
u:"Hantaviren (Puumala, Dobrava) • Inhalation von Staub mit Ausscheidungen infizierter Mäuse (Schuppen, Keller, Holzstapel, Gartenhaus) • keine Mensch-zu-Mensch-Übertragung • Inkubation 2–4 Wochen",
s:"Plötzliches hohes Fieber, Schüttelfrost • starke Kopf-, Rücken-, Flanken- und Bauchschmerzen • Sehstörungen (Myopie) • Übelkeit, Erbrechen • Nierenbeteiligung: Oligurie, dann Polyurie, Proteinurie, Hämaturie • Blutdruckabfall",
l:"Hohes Fieber + Rücken-/Flankenschmerzen + Nierenfunktionsstörung nach Mäusekontakt",
ko:"Akutes Nierenversagen (Dialyse) • Blutungen • Schock • Lungenbeteiligung (amerikanische Typen)",
dd:"Leptospirose • Pyelonephritis • Influenza • Glomerulonephritis",
b:"Hantavirus-IgM/IgG, PCR • Thrombozytopenie, Kreatinin ↑, Proteinurie, Hämaturie, CRP ↑",
nf:1,nfm:"Oligurie/Anurie, Blutungen, Kreislaufschwäche → 112.",
bv:BV7+" (Hantaviren)"},

{n:"Weitere Zoonosen (Tularämie, Brucellose, Ornithose)",a:"Hasenpest, Maltafieber/Morbus Bang, Papageienkrankheit/Psittakose",k:"infekt",
d:"Bakterielle Infektionen, die von Tieren auf den Menschen übertragen werden. Tularämie (Francisella tularensis), Brucellose (Brucella spp.), Ornithose/Psittakose (Chlamydia psittaci).",
u:"Tularämie: Kontakt mit Hasen/Wildkaninchen (Jäger, Abhäuten), Zecken, Inhalation • Brucellose: Rohmilch(-käse) aus Mittelmeerländern/Nahost, Kontakt mit Schafen, Ziegen, Rindern • Ornithose: Inhalation von Staub aus Vogelkot/-federn (Papageien, Wellensittiche, Tauben, Geflügel)",
s:"Tularämie: Fieber, Geschwür an der Eintrittsstelle mit schmerzhafter Lymphknotenschwellung (ulceroglandulär), Pneumonie • Brucellose: undulierendes (wellenförmiges) Fieber, Nachtschweiß, Gelenk-/Rückenschmerzen (Spondylitis, Sakroiliitis), Hepatosplenomegalie, Orchitis • Ornithose: hohes Fieber, starke Kopfschmerzen, atypische Pneumonie mit trockenem Husten, relative Bradykardie, Splenomegalie",
l:"Fieber mit spezifischer Tierexposition (Hasen / Rohmilch / Vögel)",
ko:"Tularämie: Sepsis, Pneumonie • Brucellose: Endokarditis, Spondylitis, Chronifizierung • Ornithose: Myokarditis, Endokarditis",
dd:"Influenza • atypische Pneumonien (Mykoplasmen, Legionellen, Q-Fieber) • Tuberkulose • Typhus • Lymphom",
b:"Serologie, PCR, Kultur (Speziallabor) • Blutkulturen (Brucellen)",
nf:0,bv:BV7+" (Francisella tularensis, Brucella spp., Chlamydia psittaci)"},

{n:"Creutzfeldt-Jakob-Krankheit (CJK)",a:"Humane spongiforme Enzephalopathie, vCJK",k:"infekt",
d:"Seltene, immer tödliche Erkrankung des Gehirns durch fehlgefaltete Prionproteine mit schwammartiger Zerstörung des Gewebes.",
u:"Sporadisch (~85 %, ältere Menschen) • genetisch (Prionprotein-Mutation) • iatrogen (Hornhaut-, Dura-Transplantat, Wachstumshormon aus Leichenhypophysen) • variante CJK (vCJK): BSE-belastetes Rindfleisch",
s:"Rasch fortschreitende Demenz (Wochen bis Monate) • Myoklonien (Muskelzuckungen) • Ataxie, Sehstörungen • Persönlichkeitsveränderung, Depression, Psychose (vCJK: jüngere Patienten, psychiatrische Symptome zuerst) • akinetischer Mutismus im Endstadium",
l:"Rasch fortschreitende Demenz mit Myoklonien",
ko:"Tod meist innerhalb eines Jahres",
dd:"Alzheimer-Demenz (langsam) • Enzephalitis (auch autoimmun) • Lewy-Körper-Demenz • Hashimoto-Enzephalopathie • Vitamin-B12-Mangel",
b:"Liquor: Protein 14-3-3, Tau ↑, RT-QuIC • EEG: periodische Sharp-Wave-Komplexe • MRT (kortikales Bändchen, Basalganglien)",
nf:0,bv:BV6+" (humane spongiforme Enzephalopathie, außer familiär-hereditäre Formen)"},

{n:"Giardiasis / Lambliasis",a:"Lamblienruhr, Giardia-Infektion",k:"infekt",
d:"Dünndarminfektion durch den Einzeller Giardia lamblia (intestinalis), häufige Ursache von Reisediarrhö und chronischen Durchfällen.",
u:"Giardia lamblia • fäkal-oral: kontaminiertes Trinkwasser (auch Bergbäche), Lebensmittel, Schmierinfektion (Kitas) • Inkubation 3–25 Tage",
s:"Oft symptomlos • wässrige bis breiige, übelriechende, fettige Durchfälle • Blähungen, Aufstoßen (faulig, schwefelig), Oberbauchkrämpfe • Übelkeit, Appetitlosigkeit • Gewichtsverlust • chronisch: Malabsorption, Laktoseintoleranz",
l:"Übelriechende, fettige Durchfälle mit Blähungen nach Reise",
ko:"Malabsorption, Gedeihstörung bei Kindern • sekundäre Laktoseintoleranz • Reizdarm postinfektiös",
dd:"Zöliakie • Reizdarm • andere Darminfektionen (Kryptosporidien, Amöben) • Laktoseintoleranz",
b:"Stuhl: Antigennachweis, PCR, Mikroskopie (Zysten, mehrfach)",
nf:0,bv:BV7+" (Giardia lamblia)"},

{n:"Yersiniose",a:"Yersinia-enterocolitica-Infektion, Pseudoappendizitis",k:"infekt",
d:"Darminfektion durch Yersinia enterocolitica oder pseudotuberculosis, häufig mit Befall der mesenterialen Lymphknoten (Pseudoappendizitis).",
u:"Yersinia enterocolitica • rohes/ungenügend gegartes Schweinefleisch (Mett, Hackfleisch), Rohmilch, kontaminiertes Wasser • vermehrt sich auch bei Kühlschranktemperatur • Inkubation 3–10 Tage",
s:"Kleinkinder: Durchfall (teils blutig), Fieber, Bauchschmerzen • ältere Kinder/Jugendliche: Lymphadenitis mesenterialis → Schmerzen im rechten Unterbauch, Fieber (Pseudoappendizitis!) • Erwachsene: Enteritis, Erythema nodosum, reaktive Arthritis (HLA-B27)",
l:"Rechtsseitiger Unterbauchschmerz mit Fieber und Durchfall (Pseudoappendizitis)",
ko:"Reaktive Arthritis • Erythema nodosum • Sepsis (bei Eisenüberladung, Immunschwäche) • Myokarditis",
dd:"Appendizitis (!) • M. Crohn • Campylobacter, Salmonellen",
b:"Stuhlkultur/PCR • Yersinien-Serologie (Immunoblot) • CRP ↑",
nf:0,bv:BVGE+" • Yersinia enterocolitica = § 7 IfSG"},

{n:"Madenwürmer",a:"Oxyuriasis, Enterobiasis",k:"infekt",
d:"Häufigste Wurmerkrankung in Mitteleuropa, v. a. bei Kindern, durch Enterobius vermicularis.",
u:"Enterobius vermicularis • fäkal-oral, Selbstinfektion (Kratzen am After → Finger → Mund), Schmierinfektion in Familie/Kita • Eier in Bettwäsche, Staub • Inkubation 2–6 Wochen",
s:"Starker nächtlicher Juckreiz am After (Weibchen legen nachts Eier ab) • Schlafstörungen, Unruhe, Reizbarkeit, Konzentrationsstörungen • Kratzspuren, Ekzem perianal • bei Mädchen: Vulvovaginitis • sichtbare weiße, fadenförmige Würmer (ca. 1 cm) auf dem Stuhl/am After",
l:"Nächtlicher Juckreiz am After bei Kindern",
ko:"Perianalekzem, Superinfektion • Vulvovaginitis, Harnwegsinfekte • selten Appendizitis",
dd:"Hämorrhoiden, Analfissur • Analekzem, Pilzinfektion • Hygienemangel",
b:"Klebestreifenmethode (Analabklatsch morgens) • Eosinophilie selten",
nf:0},

{n:"Lepra",a:"Aussatz, Hansen-Krankheit",k:"infekt",
d:"Chronische Infektionskrankheit durch Mycobacterium leprae mit Befall von Haut und peripheren Nerven. In Deutschland nur importiert.",
u:"Mycobacterium leprae • Tröpfchen bei engem, langem Kontakt, geringe Kontagiosität • Inkubation Jahre (2–20) • Formen: tuberkuloid (gute Immunabwehr), lepromatös (schwache Abwehr)",
s:"Hypopigmentierte oder rötliche Hautflecken mit Gefühlsverlust (Anästhesie) • verdickte, tastbare periphere Nerven • Sensibilitätsstörungen, Muskelschwäche, Lähmungen • lepromatös: Knoten (Leprome), Facies leonina (Löwengesicht), Verlust der Augenbrauen • schmerzlose Verletzungen, Ulzerationen, Verstümmelungen",
l:"Gefühllose Hautflecken mit verdickten Nerven",
ko:"Verstümmelungen (Finger, Zehen) durch unbemerkte Verletzungen • Erblindung • Leprareaktionen",
dd:"Vitiligo • Pityriasis versicolor • Sarkoidose • Polyneuropathie • Lupus",
b:"Hautabstrich/Biopsie (säurefeste Stäbchen), PCR",
nf:0,bv:BV7+" (Mycobacterium leprae)"},

{n:"Trichinellose",a:"Trichinose",k:"infekt",
d:"Infektion mit Larven des Fadenwurms Trichinella spiralis durch rohes Fleisch; die Larven wandern in die Muskulatur.",
u:"Trichinella spiralis • rohes oder ungenügend gegartes Schweine- oder Wildschweinfleisch (Mett, Rohwurst), Bärenfleisch • Fleischbeschau verhindert Fälle • Inkubation 5–15 Tage",
s:"Darmphase: Durchfall, Bauchschmerzen, Übelkeit • Muskelphase: hohes Fieber, starke Muskelschmerzen (Kau-, Augen-, Atemmuskulatur), Lidödeme (Gesichtsödem), Bindehautblutungen, Splitterblutungen unter den Nägeln, Exanthem",
l:"Fieber + Muskelschmerzen + Lidödeme nach rohem Schweine-/Wildfleisch",
ko:"Myokarditis • Enzephalitis • Pneumonie • Thrombosen",
dd:"Influenza • Polymyositis • Lebensmittelvergiftung • Angioödem",
b:"Eosinophilie (ausgeprägt!) • CK ↑, LDH ↑ • Trichinella-Antikörper • Muskelbiopsie",
nf:0,bv:BV7+" (Trichinella spiralis)"}
);

D.push(
{n:"Akuter Glaukomanfall",a:"Akutes Winkelblockglaukom, grüner Star (akut)",k:"auge",
d:"Plötzlicher, massiver Anstieg des Augeninnendrucks (> 50 mmHg) durch Verlegung des Kammerwinkels. Augenärztlicher Notfall – Erblindung innerhalb von Stunden möglich.",
u:"Enger Kammerwinkel (Weitsichtige, kurze Augen, Ältere, Frauen) • Auslöser: Pupillenerweiterung im Dunkeln, Stress, Medikamente (Anticholinergika, Antidepressiva, Antihistaminika, Pupillen-erweiternde Augentropfen, Sympathomimetika)",
s:"Plötzliche, heftige Augen- und Kopfschmerzen (Stirn, Schläfe), oft einseitig • rotes Auge (gemischte Injektion) • steinharter Augapfel (tastbar) • lichtstarre, mittelweite, entrundete Pupille • Sehverschlechterung, Nebelsehen, farbige Ringe um Lichtquellen (Halos) • Hornhautödem (trüb) • Übelkeit, Erbrechen (DD akutes Abdomen!), Bradykardie",
l:"Rotes, steinhartes Auge mit Kopfschmerz, Sehstörung und Erbrechen",
ko:"Irreversible Schädigung des Sehnervs, Erblindung innerhalb von Stunden • Anfall am Partnerauge",
dd:"Migräne • Iritis (enge Pupille, weiches Auge) • Konjunktivitis • Clusterkopfschmerz • akutes Abdomen, Herzinfarkt (Übelkeit/Erbrechen)",
b:"Augeninnendruckmessung (Tonometrie), Spaltlampe, Gonioskopie (Augenarzt)",
nf:2,nfm:"Sofort Augenklinik/112 • nichts Pupillenerweiterndes geben • Patient nicht ins Dunkle setzen • Oberkörper hoch"},

{n:"Chronisches Glaukom",a:"Offenwinkelglaukom, grüner Star",k:"auge",
d:"Fortschreitende Schädigung des Sehnervs (Optikusatrophie) mit typischen Gesichtsfeldausfällen, meist bei erhöhtem Augeninnendruck. Zweithäufigste Erblindungsursache.",
u:"Erhöhter Augeninnendruck (> 21 mmHg) durch gestörten Kammerwasserabfluss • Alter > 40, familiär, Kurzsichtigkeit, Diabetes, Hypotonie, Durchblutungsstörungen, Kortison (Steroidglaukom), Afrikaner • Normaldruckglaukom möglich",
s:"Lange völlig symptomlos (schleichend, schmerzlos) • Gesichtsfeldausfälle beginnend am Rand (bogenförmige Skotome), bemerkt erst spät • Tunnelblick im Endstadium • Blendempfindlichkeit",
l:"Symptomlos – Gesichtsfeldausfälle erst spät bemerkt (Vorsorge ab 40!)",
ko:"Irreversible Erblindung",

{n:"Netzhautablösung",a:"Ablatio retinae, Amotio retinae",k:"auge",

{n:"Zentralarterienverschluss",a:"Retinaler Arterienverschluss, „Augeninfarkt“",k:"auge",

{n:"Tonsillitis / Angina tonsillaris",a:"Mandelentzündung, Pharyngitis",k:"hno",

{n:"Präeklampsie / Eklampsie / HELLP-Syndrom",a:"Schwangerschaftsvergiftung, Gestose, schwangerschaftsinduzierte Hypertonie",k:"gyn",

{n:"Vorzeitige Plazentalösung / Placenta praevia",a:"Abruptio placentae, Blutungen in der Spätschwangerschaft",k:"gyn",
d:"Vorzeitige Plazentalösung: teilweise oder vollständige Ablösung der normal sitzenden Plazenta vor der Geburt. Placenta praevia: Plazenta liegt vor oder über dem inneren Muttermund. Beide: Blutungen in der zweiten Schwangerschaftshälfte – lebensbedrohlich für Mutter und Kind.",
u:"Plazentalösung: Präeklampsie/Hypertonie, Trauma (Unfall, Sturz), Rauchen, Kokain, vorzeitiger Blasensprung, frühere Lösung • Placenta praevia: frühere Kaiserschnitte/Uterus-OP, Mehrgebärende, Alter, Rauchen",
s:"Plazentalösung: plötzlicher, heftiger Dauerschmerz im Bauch, bretthart gespannter Uterus („Holzuterus“), dunkle vaginale Blutung (kann fehlen – Blutung hinter der Plazenta!), Schock oft stärker als sichtbarer Blutverlust, kindliche Herztöne pathologisch • Placenta praevia: plötzliche, SCHMERZLOSE, hellrote vaginale Blutung, weicher Uterus",
l:"Blutung in der Spätschwangerschaft – schmerzhaft mit hartem Uterus (Lösung) oder schmerzlos (praevia)",
ko:"Hämorrhagischer Schock • DIC • Tod des Kindes (Sauerstoffmangel) • Tod der Mutter",
dd:"Vorzeitige Wehen • Uterusruptur • Zervixblutung (Polyp, Karzinom) • Zeichnungsblutung",
b:"Hb, Gerinnung (Fibrinogen, Thrombozyten, D-Dimere) • Blutgruppe/Kreuzblut • Sonografie, CTG • KEINE vaginale Untersuchung bei Blutung (praevia!)",
nf:2,nfm:"112 • Linksseitenlage, Beine leicht hoch • keine vaginale Untersuchung, keine Tamponade • Schockbekämpfung, Wärmeerhalt • Vitalzeichen"},

{n:"Endometriose",a:"Endometriosis",k:"gyn",

l:"Zunehmend starke Regelschmerzen + Schmerzen beim Geschlechtsverkehr + unerfüllter Kinderwunsch",
ko:"Infertilität (30–50 %) • Endometriosezysten („Schokoladenzysten“) am Eierstock • Verwachsungen, Darm-/Harnleiterstenose • chronische Schmerzen, Depression",
dd:"Primäre Dysmenorrhö • Adnexitis • Myome • Reizdarm • Ovarialtumor • interstitielle Zystitis",
b:"CA 125 evtl. ↑ (unspezifisch) • Vaginalsonografie • Laparoskopie mit Histologie (Goldstandard)",
nf:0},

{n:"Uterus myomatosus",a:"Myome, Gebärmuttermyome",k:"gyn",

l:"Verstärkte Regelblutung mit Druckgefühl im Unterbauch",
ko:"Eisenmangelanämie • Stieldrehung, Nekrose (akuter Schmerz) • Harnstau • Infertilität, Geburtshindernis • sehr selten Leiomyosarkom (rasches Wachstum nach Menopause!)",

b:"Blutbild, Ferritin (Anämie) • Vaginalsonografie",
nf:0},

{n:"Mammakarzinom",a:"Brustkrebs",k:"gyn",
d:"Bösartiger Tumor der Brustdrüse (meist duktales Karzinom). Häufigste Krebserkrankung der Frau (jede 8. Frau); auch Männer können erkranken.",
u:"Alter • genetisch (BRCA1/2, familiäre Belastung) • hormonell: frühe Menarche, späte Menopause, Kinderlosigkeit/späte erste Schwangerschaft, kurze/keine Stillzeit, Hormonersatztherapie • Übergewicht nach Menopause, Alkohol, Bewegungsmangel, Rauchen • dichtes Brustgewebe, frühere Bestrahlung • atypische Hyperplasie",

ko:"Metastasen: Knochen (häufigste), Lunge, Leber, Gehirn • Lymphödem des Arms nach Therapie • Rezidive",
dd:"Mastopathie (zyklusabhängig, schmerzhaft) • Fibroadenom (glatt, verschieblich, junge Frauen) • Zyste • Mastitis (DD inflammatorisches Karzinom) • Lipom, Fettgewebsnekrose",
b:"Mammografie (Screening 50–75 J.), Sonografie, MRT • Stanzbiopsie mit Hormonrezeptor-/HER2-Status • Tumormarker CA 15-3, CEA (Verlauf) • AP, Kalzium (Knochenmetastasen)",
nf:0},

{n:"Zervixkarzinom",a:"Gebärmutterhalskrebs",k:"gyn",

nf:0},
